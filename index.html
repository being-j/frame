<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Framed">
  <title>Framed — Aesthetic Camera</title>
  <style>
    :root {
      --bg: #0c0c0d;
      --fg: #f2f0ea;
      --mut: #8c8a85;
      --acc: #ffb347;
      --green: #34c759;
      --pan: #1a1a1d;
      --stage: #000;
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    section {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--bg);
    }
    [hidden] { display: none !important; }
    
    button, label.btn {
      font: inherit;
      color: inherit;
      background: var(--pan);
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button:active, label.btn:active { transform: scale(0.95); }
    button.on, label.btn.on { background: var(--acc); color: #111; font-weight: 600; }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      flex-wrap: wrap;
    }

    #wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
    }
    #stage {
      position: relative;
      flex: none;
      background: var(--stage);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
    }
    video, #ov {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    video { object-fit: cover; }
    
    #hint {
      position: absolute;
      left: 0;
      right: 0;
      top: 10px;
      text-align: center;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      padding: 0 16px;
      z-index: 10;
    }

    #tools {
      display: flex;
      gap: 14px;
      padding: 4px 18px;
    }
    #tools label {
      flex: 1;
      font-size: 11px;
      color: var(--mut);
    }
    input[type=range] {
      accent-color: var(--acc);
      width: 100%;
      height: 4px;
    }

    #info-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 20px;
    }
    small {
      color: var(--mut);
      font-size: 11px;
      font-family: ui-monospace, Menlo, monospace;
    }

    #bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 8px 10px 16px;
    }
    #shut {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid var(--bg);
      outline: 3px solid var(--fg);
      padding: 0;
      cursor: pointer;
      transition: all 0.2s;
    }
    #shut.lit {
      outline-color: var(--green);
      box-shadow: 0 0 20px var(--green);
      background: #f0fdf4;
    }
    #shut:active {
      transform: scale(0.92);
      background: var(--acc);
    }

    /* Editor View */
    #pvw {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: #000;
    }
    #pv {
      max-width: 100%;
      max-height: 100%;
      border-radius: 6px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
    }
    #panel {
      height: 190px;
      overflow-y: auto;
      padding: 4px 16px;
      background: var(--bg);
    }
    .sl {
      display: grid;
      grid-template-columns: 84px 1fr 34px;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--mut);
      margin: 6px 0;
    }
    .sl span:last-child {
      text-align: right;
      font-family: monospace;
      color: var(--fg);
    }
    #busy {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      z-index: 99;
    }
  </style>
</head>
<body>

<!-- CAMERA SECTION -->
<section id="cam">
  <div class="row" id="top"></div>

  <div id="wrap">
    <div id="stage">
      <video id="v" playsinline webkit-playsinline muted autoplay></video>
      <canvas id="ov"></canvas>
      <div id="hint"></div>
    </div>
  </div>

  <div id="tools">
    <label>Zoom<input type="range" id="zm" min="1" max="5" step="0.1" value="1"></label>
    <label>Exposure<input type="range" id="ex" min="-2" max="2" step="0.1" value="0"></label>
  </div>

  <div id="info-row">
    <small id="res">Starting camera...</small>
    <small id="det">Aesthetic Engine Ready</small>
  </div>

  <div id="bar">
    <label class="btn" for="f1" title="Import">Photos</label>
    <button id="auto">✦ Scan</button>
    <button id="shut" aria-label="Shutter"></button>
    <button id="drw">Your frame</button>
    <label class="btn" for="f2" title="Full native resolution capture" style="color:var(--acc); font-weight:700;">24MP</label>
  </div>
</section>

<!-- EDITOR SECTION -->
<section id="ed" hidden>
  <div id="pvw"><canvas id="pv"></canvas></div>
  <div class="row" id="tabs"></div>
  <div id="panel"></div>
  <div class="row">
    <button id="back">Retake</button>
    <small id="info" style="flex:1; text-align:center;"></small>
    <button id="save" class="on">Save</button>
  </div>
</section>

<div id="busy" hidden>Developing high-res film…</div>

<!-- File pickers positioned offscreen without broken display:none -->
<input type="file" id="f1" accept="image/*" style="position:fixed; top:-9999px;">
<input type="file" id="f2" accept="image/*" capture="environment" style="position:fixed; top:-9999px;">

<script>
// 1. Purge legacy broken Service Worker caches
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    for (let r of regs) r.unregister();
  });
}

const $ = s => document.querySelector(s);
const RAT = { '3:4': 3/4, '4:5': 4/5, '1:1': 1, '3:2': 3/2, '9:16': 9/16 };
let ratio = '3:2', facing = 'environment', stream = null, track = null, imageCapture = null;
let frame = null, drawMode = false, autoOn = false, src = null, small = null, p = null;
let camExp = 0, stable = 0, lastMP = 0;
const v = $('#v'), ov = $('#ov'), stage = $('#stage');
const tick = () => new Promise(r => setTimeout(r, 20));

// Setup Aspect Ratio and Header buttons
const topBar = $('#top');
Object.keys(RAT).forEach(k => {
  const b = document.createElement('button');
  b.textContent = k;
  b.className = k === ratio ? 'on' : '';
  b.onclick = (e) => {
    e.stopPropagation();
    ratio = k;
    fit();
    [...topBar.children].forEach(c => {
      if (RAT[c.textContent] !== undefined) c.classList.toggle('on', c.textContent === k);
    });
    frame = null;
    draw();
  };
  topBar.appendChild(b);
});

const fl = document.createElement('button');
fl.textContent = 'Flip';
fl.onclick = (e) => {
  e.stopPropagation();
  facing = (facing === 'environment') ? 'user' : 'environment';
  start();
};
topBar.appendChild(fl);

const tb = document.createElement('button');
tb.textContent = 'Flash';
topBar.appendChild(tb);

// Horizon Level
let lvlOn = false, lvlAng = 0, lvlRaf = 0;
const lb = document.createElement('button');
lb.textContent = 'Level';
lb.onclick = async (e) => {
  e.stopPropagation();
  lvlOn = !lvlOn;
  lb.classList.toggle('on', lvlOn);
  if (lvlOn && window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) {
    try {
      if (await DeviceOrientationEvent.requestPermission() !== 'granted') {
        lvlOn = false;
        lb.classList.remove('on');
      }
    } catch(err){}
  }
  draw();
};
topBar.appendChild(lb);

window.addEventListener('deviceorientation', e => {
  if (!lvlOn) return;
  lvlAng = Math.max(-45, Math.min(45, e.gamma || 0));
  cancelAnimationFrame(lvlRaf);
  lvlRaf = requestAnimationFrame(draw);
});

function drawLevel(x, W, H) {
  if (!lvlOn) return;
  const d = Math.max(1, W / 400), ok = Math.abs(lvlAng) < 1.2;
  x.save();
  x.translate(W / 2, H / 2);
  x.rotate(-lvlAng * Math.PI / 180);
  x.strokeStyle = ok ? '#34c759' : 'rgba(255,255,255,.75)';
  x.lineWidth = 2.5 * d;
  x.beginPath();
  x.moveTo(-W * 0.24, 0); x.lineTo(-W * 0.08, 0);
  x.moveTo(W * 0.08, 0);  x.lineTo(W * 0.24, 0);
  x.stroke();
  x.restore();
}

// Resilient iOS Camera Starter
async function start() {
  $('#res').textContent = 'Connecting to camera…';
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: facing,
        width: { ideal: 3840 },
        height: { ideal: 2160 }
      },
      audio: false
    });
    v.srcObject = stream;
    track = stream.getVideoTracks()[0];
    if (window.ImageCapture && track) {
      imageCapture = new ImageCapture(track);
    }
    const c = track.getCapabilities ? track.getCapabilities() : {};
    const s = track.getSettings ? track.getSettings() : {};
    lastMP = ((s.width * s.height) / 1e6) || 0;
    $('#res').textContent = `Sensor: ${s.width}×${s.height} (${lastMP.toFixed(1)}MP)`;
    
    $('#zm').parentNode.style.opacity = c.zoom ? 1 : 0.4;
    if (c.zoom) {
      $('#zm').min = c.zoom.min;
      $('#zm').max = Math.min(c.zoom.max, 8);
    }
    tb.style.display = c.torch ? '' : 'none';
    fit();
  } catch (err) {
    $('#hint').textContent = 'Tap screen to allow camera or use Photos/24MP';
    $('#res').textContent = 'Camera blocked or awaiting touch';
  }
}

$('#zm').oninput = e => {
  const val = +e.target.value;
  if (track && track.getCapabilities && track.getCapabilities().zoom) {
    track.applyConstraints({ advanced: [{ zoom: val }] }).catch(() => {});
  } else {
    v.style.transform = `scale(${val})`;
  }
};

$('#ex').oninput = e => {
  camExp = +e.target.value;
  const c = track && track.getCapabilities ? track.getCapabilities() : {};
  if (c.exposureCompensation) {
    track.applyConstraints({ advanced: [{ exposureCompensation: camExp }] }).catch(() => {});
    camExp = 0;
  } else {
    v.style.filter = `brightness(${Math.pow(2, camExp / 2)})`;
  }
};

let torch = false;
tb.onclick = (e) => {
  e.stopPropagation();
  torch = !torch;
  tb.classList.toggle('on', torch);
  if (track) track.applyConstraints({ advanced: [{ torch }] }).catch(() => {});
};

function size() {
  const d = devicePixelRatio || 1;
  ov.width = stage.clientWidth * d;
  ov.height = stage.clientHeight * d;
}

function fit() {
  const w = $('#wrap'), a = RAT[ratio];
  const W = w.clientWidth - 16, H = w.clientHeight;
  if (W <= 0 || H <= 0) return;
  let sw = W, sh = W / a;
  if (sh > H) { sh = H; sw = H * a; }
  stage.style.width = sw + 'px';
  stage.style.height = sh + 'px';
  size();
  draw();
}
new ResizeObserver(fit).observe($('#wrap'));
fit();

// Viewfinder canvas overlay
function draw() {
  const x = ov.getContext('2d'), W = ov.width, H = ov.height;
  x.clearRect(0, 0, W, H);

  // Rule of thirds
  x.strokeStyle = 'rgba(255, 255, 255, 0.35)';
  x.lineWidth = 1;
  x.beginPath();
  for (let i = 1; i < 3; i++) {
    x.moveTo(W * i / 3, 0); x.lineTo(W * i / 3, H);
    x.moveTo(0, H * i / 3); x.lineTo(W, H * i / 3);
  }
  x.stroke();

  // Framing Target & Matte
  if (frame) {
    const s = frame.s, l = (frame.cx - s / 2) * W, t = (frame.cy - s / 2) * H, w = s * W, h = s * H;
    x.fillStyle = 'rgba(0, 0, 0, 0.45)';
    x.beginPath();
    x.rect(0, 0, W, H);
    x.rect(l, t, w, h);
    x.fill('evenodd');

    x.strokeStyle = autoOn ? (stable >= 2 ? '#34c759' : '#ffd60a') : '#fff';
    x.lineWidth = 3;
    x.strokeRect(l, t, w, h);
  }

  drawLevel(x, W, H);
}

// User drag framing
let dp = null;
ov.onpointerdown = e => {
  if (!drawMode) return;
  const r = ov.getBoundingClientRect();
  dp = { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
  frame = { cx: dp.x, cy: dp.y, s: 0.25 };
  ov.setPointerCapture(e.pointerId);
  draw();
};
ov.onpointermove = e => {
  if (!dp) return;
  const r = ov.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  const s = Math.min(1, Math.max(0.25, 2 * Math.max(Math.abs(x - dp.x), Math.abs(y - dp.y))));
  frame = { cx: Math.min(1 - s / 2, Math.max(s / 2, dp.x)), cy: Math.min(1 - s / 2, Math.max(s / 2, dp.y)), s };
  draw();
};
ov.onpointerup = () => { dp = null; };

$('#drw').onclick = (e) => {
  e.stopPropagation();
  autoOn = false;
  $('#auto').classList.remove('on');
  drawMode = !drawMode;
  $('#drw').classList.toggle('on', drawMode);
  if (!drawMode) frame = null;
  $('#hint').textContent = drawMode ? 'Drag from the center of your shot' : '';
  $('#shut').classList.remove('lit');
  draw();
};

// Saliency Analysis for Auto Coach
function vis() {
  const vw = v.videoWidth || 640, vh = v.videoHeight || 480, a = RAT[ratio];
  let cw, ch;
  if (vw / vh > a) { ch = vh; cw = vh * a; } else { cw = vw; ch = vw / a; }
  return { x: (vw - cw) / 2, y: (vh - ch) / 2, w: cw, h: ch };
}

const dc = document.createElement('canvas');
function analyzeFrame() {
  if (!v.videoWidth) return null;
  const q = vis(), N = 36, M = Math.round(N / RAT[ratio]);
  dc.width = N; dc.height = M;
  const x = dc.getContext('2d', { willReadFrequently: true });
  x.drawImage(v, q.x, q.y, q.w, q.h, 0, 0, N, M);
  const d = x.getImageData(0, 0, N, M).data;
  let tot = 0, sumX = 0, sumY = 0;
  for (let y = 1; y < M - 1; y++) {
    for (let xx = 1; xx < N - 1; xx++) {
      const idx = (y * N + xx) * 4;
      const lum = 0.299 * d[idx] + 0.587 * d[idx+1] + 0.114 * d[idx+2];
      const r = d[idx], g = d[idx+1], b = d[idx+2];
      const isSkin = (r > 60 && g > 35 && b > 25 && r > g && r > b);
      const edge = Math.abs(lum - (0.299 * d[idx+4] + 0.587 * d[idx+5] + 0.114 * d[idx+6]));
      const w = edge + (isSkin ? 60 : 0);
      if (w > 20) {
        tot += w; sumX += w * xx; sumY += w * y;
      }
    }
  }
  if (tot <= 0) return { cx: 0.5, cy: 0.5, s: 0.7 };
  const mx = (sumX / tot) / N, my = (sumY / tot) / M;
  const ux = mx < 0.5 ? 1/3 : 2/3, uy = my < 0.5 ? 1/3 : 2/3;
  return { cx: Math.min(0.65, Math.max(0.35, mx - (ux - 0.5) * 0.6)), cy: Math.min(0.65, Math.max(0.35, my - (uy - 0.5) * 0.6)), s: 0.65 };
}

let scanTimer = null;
$('#auto').onclick = (e) => {
  e.stopPropagation();
  autoOn = !autoOn;
  $('#auto').classList.toggle('on', autoOn);
  drawMode = false;
  $('#drw').classList.remove('on');
  if (!autoOn) {
    frame = null;
    clearTimeout(scanTimer);
    $('#hint').textContent = '';
    $('#shut').classList.remove('lit');
  } else {
    tickScan();
  }
  draw();
};

function tickScan() {
  if (!autoOn) return;
  const t = analyzeFrame();
  if (t) {
    frame = t;
    stable++;
    const lock = stable >= 2;
    $('#hint').textContent = lock ? 'Golden Ratio Locked — Shoot' : 'Framing subject…';
    $('#hint').style.color = lock ? '#34c759' : '#ffd60a';
    $('#shut').classList.toggle('lit', lock);
    draw();
  }
  scanTimer = setTimeout(tickScan, 400);
}

// Shutter Capture
$('#shut').onclick = async (e) => {
  e.stopPropagation();
  $('#busy').hidden = false;
  await tick();

  let captured = null;
  if (imageCapture) {
    try {
      const blob = await imageCapture.takePhoto();
      const bm = await createImageBitmap(blob);
      captured = document.createElement('canvas');
      captured.width = bm.width; captured.height = bm.height;
      captured.getContext('2d').drawImage(bm, 0, 0);
    } catch(err){}
  }
  if (!captured) {
    const s = track ? track.getSettings() : {};
    const w = (s && s.width) || v.videoWidth || 1920;
    const h = (s && s.height) || v.videoHeight || 1080;
    captured = document.createElement('canvas');
    captured.width = w; captured.height = h;
    captured.getContext('2d').drawImage(v, 0, 0, w, h);
  }

  const q = { x: 0, y: 0, w: captured.width, h: captured.height };
  const targetAspect = RAT[ratio];
  let cw = q.w, ch = q.h;
  if (cw / ch > targetAspect) cw = ch * targetAspect; else ch = cw / targetAspect;
  let cropX = (q.w - cw) / 2, cropY = (q.h - ch) / 2;

  if (frame) {
    cropX += (frame.cx - frame.s / 2) * cw;
    cropY += (frame.cy - frame.s / 2) * ch;
    cw *= frame.s;
    ch *= frame.s;
  }

  const finalC = document.createElement('canvas');
  finalC.width = Math.round(cw);
  finalC.height = Math.round(ch);
  finalC.getContext('2d').drawImage(captured, cropX, cropY, cw, ch, 0, 0, finalC.width, finalC.height);

  $('#busy').hidden = true;
  edit(finalC, camExp);
};

// File inputs for Photos & 24MP full sensor
async function loadFile(f) {
  if (!f) return;
  $('#busy').hidden = false;
  await tick();
  let bm;
  try {
    bm = await createImageBitmap(f, { imageOrientation: 'from-image' });
  } catch(e) {
    bm = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = rej;
      i.src = URL.createObjectURL(f);
    });
  }
  const c = document.createElement('canvas');
  c.width = bm.width; c.height = bm.height;
  c.getContext('2d').drawImage(bm, 0, 0);
  $('#busy').hidden = true;
  edit(c, 0);
}
$('#f1').onchange = $('#f2').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };

// Film Lab Engine (Curves & HSL)
const DEF = { exposure: 0, contrast: 0, highlights: 0, shadows: 0, fade: 0, temp: 0, tint: 0, sat: 0, grain: 0, glow: 0, vignette: 0, leak: 0, dust: 0, mono: false, frame: 'Paper', date: true, look: 'PORTRA', seed: 1, title: 'FRAMED STUDIO', specs: '' };
const LOOKS = {
  PORTRA: { exposure: 5, contrast: 12, temp: 16, sat: 8, fade: 8, grain: 28, vignette: 8 },
  TRIX: { mono: true, exposure: -4, contrast: 36, grain: 58, vignette: 16 },
  CINESTILL: { temp: -16, tint: 4, contrast: 18, sat: 6, grain: 38, glow: 45, vignette: 12 },
  SUPERIA: { exposure: 8, temp: 4, tint: -8, contrast: 20, sat: 20, grain: 32 },
  KODACHROME: { exposure: -8, temp: 20, contrast: 28, sat: 22, grain: 24, vignette: 10 }
};
const TABS = {
  Looks: null,
  Light: [['exposure','Exposure'],['contrast','Contrast'],['highlights','Highlights'],['shadows','Shadows'],['fade','Fade'],['temp','Temperature'],['tint','Tint']],
  Color: [['sat','Saturation']],
  Curve: null,
  HSL: null,
  Effects: [['grain','Grain'],['glow','Halation/Glow'],['vignette','Vignette'],['leak','Light Leak'],['dust','Dust & Scratches']],
  Frame: null
};
const FRAMES = ['Paper', 'Polaroid', 'Filmstrip', 'Negative', 'Specs', 'Plain', 'White', 'Black'];

function curveLUT(P) {
  const n = P.length, x = P.map(a => a[0]), y = P.map(a => a[1]);
  const dx = [], m = [], t = new Array(n);
  for (let i = 0; i < n - 1; i++) { dx[i] = x[i + 1] - x[i]; m[i] = (y[i + 1] - y[i]) / dx[i]; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) t[i] = t[i + 1] = 0;

let hk = 0, cch = 'm';
const HC = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#14b8a6', '#3b82f6', '#8b5cf6', '#d946ef'];
const CCOL = { m: '#e8e6e0', r: '#ef4444', g: '#22c55e', b: '#3b82f6' };
const idPts = () => Array.from({ length: 9 }, (_, i) => [i / 8, i / 8]);

function hslPanel(P) {
  p.hsl = p.hsl || HC.map(() => [0, 0, 0]);
  const r = document.createElement('div');
  r.className = 'row';
  HC.forEach((c, i) => {
    const b = document.createElement('button');
    b.style.cssText = `width:32px;height:32px;padding:0;background:${c};outline:${i === hk ? '3px solid var(--fg)' : 'none'};border-radius:50%;`;
    b.onclick = () => { hk = i; panel(); };
    r.appendChild(b);
  });
  P.appendChild(r);
  ['Hue', 'Saturation', 'Luminance'].forEach((n, j) => {
    const d = document.createElement('div');
    d.className = 'sl';
    const v = p.hsl[hk][j];
    d.innerHTML = `<span>${n}</span><input type="range" min="-100" max="100" value="${v}"><span>${v}</span>`;
    d.querySelector('input').oninput = e => { p.hsl[hk][j] = +e.target.value; d.lastChild.textContent = e.target.value; paint(); };
    P.appendChild(d);
  });
}

function curvePanel(P) {
  p.curves = p.curves || { m: idPts(), r: idPts(), g: idPts(), b: idPts() };
  const S = 150, dpr = devicePixelRatio || 1;
  const w = document.createElement('div');
  w.style.cssText = 'display:flex;gap:14px;align-items:center;justify-content:center;';
  const cv = document.createElement('canvas');
  cv.width = cv.height = S * dpr;
  cv.style.cssText = `width:${S}px;height:${S}px;border-radius:10px;background:var(--pan);touch-action:none;`;

  const dr = () => {
    const x = cv.getContext('2d');
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.clearRect(0, 0, S, S);
    x.strokeStyle = 'rgba(128,128,128,.3)';
    x.lineWidth = 1;
    x.beginPath();
    for (let i = 1; i < 4; i++) {
      x.moveTo(S * i / 4, 0); x.lineTo(S * i / 4, S);
      x.moveTo(0, S * i / 4); x.lineTo(S * i / 4, S);
    }
    x.stroke();
    const pts = p.curves[cch], L = curveLUT(pts);
    x.strokeStyle = CCOL[cch];
    x.lineWidth = 2.5;
    x.beginPath();
    for (let v = 0; v < 256; v++) {
      const X = v / 255 * S, Y = S - L[v] / 255 * S;
      v ? x.lineTo(X, Y) : x.moveTo(X, Y);
    }
    x.stroke();
    x.fillStyle = CCOL[cch];
    pts.forEach(q => { x.beginPath(); x.arc(q[0] * S, S - q[1] * S, 4.5, 0, 7); x.fill(); });
  };

  let di = -1;
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height]; };
  cv.onpointerdown = e => { const q = pos(e); di = Math.round(Math.min(1, Math.max(0, q[0])) * 8); cv.setPointerCapture(e.pointerId); p.curves[cch][di][1] = Math.min(1, Math.max(0, q[1])); dr(); paint(); };
  cv.onpointermove = e => { if (di < 0) return; p.curves[cch][di][1] = Math.min(1, Math.max(0, pos(e)[1])); dr(); paint(); };

  const col = document.createElement('div');
  col.style.cssText = 'display:flex;flex-direction:column;gap:6px;';
  [['m', 'RGB'], ['r', 'R'], ['g', 'G'], ['b', 'B']].forEach(([k, n]) => {
    const b = document.createElement('button');
    b.textContent = n;
    b.className = k === cch ? 'on' : '';
    b.onclick = () => { cch = k; panel(); };
    col.appendChild(b);
  });
  const rs = document.createElement('button');
  rs.textContent = 'Reset';
  rs.onclick = () => { p.curves = null; panel(); paint(); };
  col.appendChild(rs);
  w.appendChild(cv); w.appendChild(col); P.appendChild(w); dr();
}

function stampInputs(P) {
  [['title', 'Title', 'FRAMED STUDIO'], ['specs', 'Custom Specs', '35MM F/1.4 · ISO 400']].forEach(([k, l, ph]) => {
    const i = document.createElement('input');
    i.value = p[k] || '';
    i.placeholder = ph;
    i.style.cssText = 'display:block;width:100%;box-sizing:border-box;margin:6px 0;padding:8px 12px;border:0;border-radius:8px;background:var(--pan);color:var(--fg);font-size:14px;';
    i.oninput = e => { p[k] = e.target.value; paint(); };
    P.appendChild(i);
  });
}

let tab = 'Looks', raf = 0;
function edit(c, expo) {
  src = c;
  const k = Math.min(1, 1400 / Math.max(c.width, c.height));
  small = document.createElement('canvas');
  small.width = Math.round(c.width * k);
  small.height = Math.round(c.height * k);
  small.getContext('2d').drawImage(c, 0, 0, small.width, small.height);

  p = { ...DEF, ...LOOKS.PORTRA, seed: 1 + Math.floor(Math.random() * 999) };
  p.exposure += expo * 30;
  $('#info').textContent = `${(c.width * c.height / 1e6).toFixed(1)} MP Source`;
  $('#cam').hidden = true;
  $('#ed').hidden = false;
  tabs(); panel(); paint();
}

function tabs() {
  const t = $('#tabs');
  t.innerHTML = '';
  Object.keys(TABS).forEach(k => {
    const b = document.createElement('button');
    b.textContent = k;
    b.className = k === tab ? 'on' : '';
    b.onclick = () => { tab = k; tabs(); panel(); };
    t.appendChild(b);
  });
}

function panel() {
  const P = $('#panel');
  P.innerHTML = '';
  if (tab === 'Curve') return curvePanel(P);
  if (tab === 'HSL') return hslPanel(P);
  if (tab === 'Looks') {
    const r = document.createElement('div');
    r.className = 'row';
    Object.keys(LOOKS).forEach(k => {
      const b = document.createElement('button');
      b.textContent = k;
      b.className = p.look === k ? 'on' : '';
      b.onclick = () => {
        p = { ...DEF, ...LOOKS[k], look: k, frame: p.frame, date: p.date, title: p.title, specs: p.specs, curves: p.curves, hsl: p.hsl, seed: p.seed };
        panel(); paint();
      };
      r.appendChild(b);
    });
    P.appendChild(r);
  } else if (tab === 'Frame') {
    const r = document.createElement('div');
    r.className = 'row';
    FRAMES.forEach(k => {
      const b = document.createElement('button');
      b.textContent = k;
      b.className = p.frame === k ? 'on' : '';
      b.onclick = () => { p.frame = k; panel(); paint(); };
      r.appendChild(b);
    });
    const d = document.createElement('button');
    d.textContent = 'Date Stamp';
    d.className = p.date ? 'on' : '';
    d.onclick = () => { p.date = !p.date; panel(); paint(); };
    r.appendChild(d);
    P.appendChild(r);
    stampInputs(P);
  } else {
    TABS[tab].forEach(([k, n]) => {
      const d = document.createElement('div');
      d.className = 'sl';
      const neg = ['exposure', 'contrast', 'highlights', 'shadows', 'temp', 'tint', 'sat'].includes(k);
      d.innerHTML = `<span>${n}</span><input type="range" min="${neg ? -100 : 0}" max="100" value="${p[k]}"><span>${Math.round(p[k])}</span>`;
      d.querySelector('input').oninput = e => { p[k] = +e.target.value; d.lastChild.textContent = e.target.value; paint(); };
      P.appendChild(d);
    });
  }
}

function paint() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    const o = render(small, p);
    const pv = $('#pv');
    pv.width = o.width; pv.height = o.height;
    pv.getContext('2d').drawImage(o, 0, 0);
  });
}

function hash(x, y, s) {

  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}

function render(sc, p) {
  const w = sc.width, h = sc.height, m = Math.min(w, h);
  const ph = document.createElement('canvas');
  ph.width = w; ph.height = h;
  const x = ph.getContext('2d', { willReadFrequently: true });
  x.drawImage(sc, 0, 0);

  const ex = Math.pow(2, p.exposure / 50), ct = 1 + p.contrast / 100, hi = p.highlights / 100, sh = p.shadows / 100, fd = p.fade / 100 * 0.14, tw = p.temp / 100, tn = p.tint / 100, sa = 1 + p.sat / 100, gr = p.grain / 100 * 0.22, vg = p.vignette / 100, bs = Math.max(0, Math.min(3, Math.round(Math.log2(w / 1200)))), sd = p.seed * 7919;

  for (let y0 = 0; y0 < h; y0 += 256) {
    const hh = Math.min(256, h - y0), im = x.getImageData(0, y0, w, hh), d = im.data;
    for (let yy = 0; yy < hh; yy++) {
      const y = y0 + yy, dy = y / h - 0.5;
      for (let xx = 0; xx < w; xx++) {
        const i = (yy * w + xx) * 4;
        let r = d[i] / 255 * ex * (1 + tw * 0.18), g = d[i + 1] / 255 * ex * (1 - tn * 0.12), b = d[i + 2] / 255 * ex * (1 - tw * 0.18), l = 0.299 * r + 0.587 * g + 0.114 * b;
        const a = sh * (1 - l)**2 * 0.35 + hi * l * l * 0.35;
        r += a; g += a; b += a;
        r = (r - 0.5) * ct + 0.5; g = (g - 0.5) * ct + 0.5; b = (b - 0.5) * ct + 0.5;
        r = fd + r * (1 - fd); g = fd + g * (1 - fd); b = fd + b * (1 - fd);
        l = 0.299 * r + 0.587 * g + 0.114 * b;
        if (p.mono) { r = g = b = l; } else { r = l + (r - l) * sa; g = l + (g - l) * sa; b = l + (b - l) * sa; }

        const dx = xx / w - 0.5, vf = 1 - vg * (dx * dx + dy * dy) * 2.2, n = gr ? (hash(xx >> bs, y >> bs, sd) - 0.5) * gr * (1.1 - Math.abs(l - 0.5)) : 0;

  const rr = () => (s = (s * 16807) % 2147483647) / 2147483647;

  if (p.glow > 0) {
    const t = document.createElement('canvas');
    t.width = Math.max(8, w >> 3); t.height = Math.max(8, h >> 3);
    const c = t.getContext('2d');
    c.drawImage(ph, 0, 0, t.width, t.height);
    c.globalCompositeOperation = 'multiply'; c.fillStyle = '#ff7a45'; c.fillRect(0, 0, t.width, t.height);

  }

    const cx = rr() < 0.5 ? 0 : w, g = x.createRadialGradient(cx, h * (0.2 + rr() * 0.5), 0, cx, h * 0.4, m * 0.9);
    g.addColorStop(0, `rgba(255,110,30,${p.leak / 100 * 0.8})`); g.addColorStop(0.5, `rgba(255,40,60,${p.leak / 100 * 0.25})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
  }

  if (p.dust > 0) {
    x.fillStyle = 'rgba(255,255,255,.65)';
    for (let i = 0; i < p.dust * 0.8; i++) { x.beginPath(); x.arc(rr() * w, rr() * h, m * 0.0012 * (0.5 + rr() * 1.5), 0, 7); x.fill(); }
    x.strokeStyle = 'rgba(255,255,255,.22)'; x.lineWidth = Math.max(1, m * 0.0006);
    for (let i = 0; i < p.dust * 0.12; i++) { const a = rr() * w, b = rr() * h; x.beginPath(); x.moveTo(a, b); x.lineTo(a + (rr() - 0.5) * m * 0.03, b + rr() * m * 0.12); x.stroke(); }
  }

  if (p.date) {
    x.font = `bold ${m * 0.035}px ui-monospace, Menlo, monospace`;
    x.textAlign = 'right'; x.fillStyle = '#ff8a1e'; x.shadowColor = '#ff5a00'; x.shadowBlur = m * 0.01;
    x.fillText(ds, w - m * 0.04, h - m * 0.04); x.shadowBlur = 0;
  }

  const F = { Plain: [0, 0, '#000'], White: [0.06, 0.06, '#f6f4ef'], Paper: [0.06, 0.15, '#ece4d2'], Black: [0.06, 0.06, '#0b0b0b'], Negative: [0.07, 0.07, '#141210'], Specs: [0.04, 0.16, '#f7f7f5'], Polaroid: [0.05, 0.24, '#fcfbf8'], Filmstrip: [0.1, 0.1, '#0f0f11'] }[p.frame];
  const pd = F[0] * m, bt = F[1] * m;
  if (!pd && !bt) return ph;

  const o = document.createElement('canvas');
  o.width = w + 2 * pd; o.height = h + pd + bt;
  const c = o.getContext('2d');
  c.fillStyle = F[2]; c.fillRect(0, 0, o.width, o.height); c.drawImage(ph, pd, pd);

  c.textAlign = 'left';
  const ttl = (p.title || '').toUpperCase(), spc = (p.specs || `${(w * h / 1e6).toFixed(0)}MP · ${w}×${h} · ${p.look}`).toUpperCase(), mono = 'ui-monospace, Menlo, monospace', bot = h + pd;

  if (p.frame === 'Paper') {
    const ty = bot + bt * 0.45;
    c.fillStyle = '#1c1c1f'; c.font = `700 ${m * 0.03}px -apple-system, Georgia, serif`; c.fillText(ttl, pd, ty);
    c.fillStyle = '#6b7280'; c.font = `${m * 0.017}px ${mono}`; c.fillText(`${spc}  ·  ${ds}`, pd, ty + m * 0.045);
  }
  if (p.frame === 'Polaroid') {
    const ty = bot + bt * 0.42;
    c.fillStyle = '#2a2a2e'; c.font = `italic 600 ${m * 0.036}px -apple-system, sans-serif`; c.fillText(p.title || 'Framed', pd + m * 0.01, ty);
    c.fillStyle = '#8f949e'; c.font = `${m * 0.016}px ${mono}`; c.fillText(`${spc}  ·  ${ds}`, pd + m * 0.012, ty + m * 0.07);
  }
  if (p.frame === 'Specs') {
    c.fillStyle = '#111'; c.font = `bold ${m * 0.028}px ${mono}`; c.fillText(`${p.look.toUpperCase()}  ·  ${(w * h / 1e6).toFixed(0)}MP`, pd, h + pd + m * 0.06);
    c.font = `${m * 0.022}px ${mono}`; c.fillStyle = '#666'; c.fillText(`${w}×${h}  ·  ${dt.toDateString()}`, pd, h + pd + m * 0.1);
  }
  if (p.frame === 'Filmstrip') {
    const hw = m * 0.035, hh = m * 0.05, st = m * 0.07, hy = (pd - hh) / 2;
    c.fillStyle = '#2a2a30';
    for (let X = m * 0.02; X < o.width - m * 0.04; X += st) {
      c.fillRect(X, hy * 0.6, hw, hh); c.fillRect(X, o.height - hy * 0.6 - hh, hw, hh);
    }
    c.fillStyle = '#e2a842'; c.font = `600 ${m * 0.016}px ${mono}`; c.fillText(`KODAK 5074 // ${p.look.toUpperCase()} // DX-35`, pd, pd - m * 0.012);
    c.fillStyle = '#f3f4f6'; c.font = `700 ${m * 0.02}px ${mono}`; c.fillText(ttl, pd, bot + m * 0.03);
    c.fillStyle = '#e2a842'; c.font = `${m * 0.014}px ${mono}`; c.textAlign = 'right'; c.fillText(spc, o.width - pd, bot + m * 0.03);
  }
  if (p.frame === 'Negative') {
    c.fillStyle = '#2a2622';
    for (let i = 0; i < o.width / (m * 0.06); i++) {
      c.fillRect(i * m * 0.06 + m * 0.02, m * 0.02, m * 0.03, m * 0.03);
      c.fillRect(i * m * 0.06 + m * 0.02, o.height - m * 0.05, m * 0.03, m * 0.03);
    }
    c.fillStyle = '#ff9a2e'; c.font = `${m * 0.022}px ${mono}`; c.fillText(`FRAMED 400   ▸ ${String(Math.floor(rr() * 36) + 1).padStart(2, '0')}`, pd, o.height - m * 0.058);
  }
  return o;
}

$('#back').onclick = () => { $('#ed').hidden = true; $('#cam').hidden = false; src = small = null; };
$('#save').onclick = async () => {
  $('#busy').hidden = false; await tick();
  const o = render(src, p);
  o.toBlob(async b => {
    const f = new File([b], `framed-${Date.now()}.jpg`, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f] }); } catch(e) {}
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = f.name; a.click();
    }
    $('#info').textContent = `Exported ${o.width}×${o.height}`;
    $('#busy').hidden = true;
  }, 'image/jpeg', 0.96);
};

// Immediate start
start();
</script>
