 else if(tab==='Frame'){const r=document.createElement('div');r.className='row';FRAMES.forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className=p.frame===k?'on':'';b.onclick=()=>{p.frame=k;panel();paint()};r.appendChild(b)});P.appendChild(r)}
 else TABS[tab].forEach(([k,n])=>{const d=document.createElement('div');d.className='sl';const neg=['exposure','contrast','highlights','shadows','temp','tint','sat'].includes(k);d.innerHTML=`<span>${n}</span><input type="range" min="${k==='mono'||k==='date'||k==='frame'||k==='look' ? 0 : -100}" max="${k==='mono'||k==='date'||k==='frame'||k==='look' ? 1 : 100}" step="1" value="${Number.isFinite(p[k])?p[k]:0}" data-k="${k}"><span>${k==='mono'||k==='date'||k==='frame'||k==='look' ? (p[k]? 'On' : 'Off') : (p[k]>0?'+':'')+p[k]}</span>`;const inpt=d.querySelector('input');inpt.oninput=e=>{const v=+e.target.value; if(k==='mono') p.mono=v>0; else if(k==='date') p.date=v>0; else if(k==='frame') p.frame=FRAMES[v]||p.frame; else if(k==='look'){p.look=Object.keys(LOOKS)[v]||p.look;} else {p[k]=v; if (neg && v>0) p[k]=v; } panel(); paint();};P.appendChild(d)})}
function paint(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const o=render(small,p);const pv=$('#pv');pv.width=o.width;pv.height=o.height;pv.getContext('2d').drawImage(o,0,0)})}
function hash(x,y,s){let n=Math.imul(x,374761393)+Math.imul(y,668265263)+s|0;n=Math.imul(n^(n>>>13),1274126177);n^=n>>>16;return(n>>>0)/4294967296}
function render(sc,p){const w=sc.width,h=sc.height,m=Math.min(w,h),ph=document.createElement('canvas');ph.width=w;ph.height=h;const x=ph.getContext('2d',{willReadFrequently:true});x.drawImage(sc,0,0);const ex=Math.pow(2,p.exposure/50),ct=1+p.contrast/100,hi=p.highlights/100,sh=p.shadows/100,fd=p.fade/100*.14,tw=p.temp/100,tn=p.tint/100,sa=1+p.sat/100,gr=p.grain/100*.22,vg=p.vignette/100,bs=Math.max(1,Math.round(Math.log2(Math.max(w,h))+1));const sd=Math.abs(p.seed||1)*1.234;const im=x.getImageData(0,0,w,h),d=im.data;for(let y=0;y<h;y++){for(let x0=0;x0<w;x0++){const i=(y*w+x0)*4;let r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255;let l=.299*r+.587*g+.114*b;const a=sh*(1-l)*(1-l)*.35+hi*l*l*.35;r+=a;g+=a;b+=a;r=(r-.5)*ct+.5;g=(g-.5)*ct+.5;b=(b-.5)*ct+.5;r=fd+r*(1-fd);g=fd+g*(1-fd);b=fd+b*(1-fd);l=.299*r+.587*g+.114*b;if(p.mono){r=g=b=l}else{r=l+(r-l)*sa;g=l+(g-l)*sa;b=l+(b-l)*sa}const dx=x0/w-.5,dy=y/h-.5;const vf=1-vg*(dx*dx+dy*dy)*2.2;const n=gr?(hash(x0>>bs,y>>bs,sd)-.5)*gr*(1.1-Math.abs(l-.5)):0;d[i]=Math.min(1,Math.max(0,(r*vf+n)*ex))*255;d[i+1]=Math.min(1,Math.max(0,(g*vf+n)*ex))*255;d[i+2]=Math.min(1,Math.max(0,(b*vf+n)*ex))*255;}}x.putImageData(im,0,0);const rr=()=>(sd=(sd*16807)%2147483647)/2147483647;if(p.glow>0){const t=document.createElement('canvas');t.width=Math.max(8,w>>3);t.height=Math.max(8,h>>3);const c=t.getContext('2d');c.drawImage(ph,0,0,t.width,t.height);c.filter='blur(12px)';c.globalCompositeOperation='screen';x.drawImage(t,0,0,w,h)}if(p.leak>0){const cx=rr()<.5?0:w;const g=x.createRadialGradient(cx,h*(.2+rr()*.5),0,cx,h*.4,m*.9);g.addColorStop(0,`rgba(255,110,30,${p.leak/100*.8})`);g.addColorStop(1,'rgba(255,110,30,0)');x.fillStyle=g;x.fillRect(0,0,w,h)}if(p.dust>0){x.fillStyle='rgba(255,255,255,.65)';for(let i=0;i<p.dust*.8;i++){x.beginPath();x.arc(rr()*w,rr()*h,m*.0012*(.5+rr()*1.5),0,7);x.fill()}}const dt=new Date(),ds=`'${String(dt.getFullYear()).slice(2)} ${String(dt.getMonth()+1).padStart(2,'0')} ${String(dt.getDate()).padStart(2,'0')}`;if(p.date){x.font=`bold ${m*.035}px ui-monospace,Menlo,monospace`;x.textAlign='right';x.fillStyle='#ff8a1e';x.shadowColor='#ff5a00';x.shadowBlur=m*.01;x.fillText(ds,w-m*.04,h-m*.04);x.shadowBlur=0}const F={Plain:[0,0,'#000'],White:[.06,.06,'#f6f4ef'],Paper:[.06,.15,'#ece4d2'],Black:[.06,.06,'#0b0b0b'],Negative:[.07,.07,'#141210'],Specs:[.04,.16,'#f7f7f5']}[p.frame],pd=F[0]*m,bt=F[1]*m;if(!pd&&!bt)return ph;const o=document.createElement('canvas');o.width=w+2*pd;o.height=h+pd+bt;const c=o.getContext('2d');c.fillStyle=F[2];c.fillRect(0,0,o.width,o.height);c.drawImage(ph,pd,pd);return o}
$('#back').onclick=()=>{$('#ed').hidden=true;$('#cam').hidden=false;src=small=null};
$('#save').onclick=async()=>{$('#busy').hidden=false;await tick();const o=render(src,p);o.toBlob(async b=>{const f=new File([b],`framed-${Date.now()}.jpg`,{type:'image/jpeg'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click()}$('#info').textContent=`Exported ${o.width}×${o.height}`;$('#busy').hidden=true},'image/jpeg',.95)};
start();
