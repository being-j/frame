<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Framed">
  <title>Framed — Intelligent Aesthetic Camera</title>
  <style>
    :root {
      --bg: #09090b;
      --fg: #f4f4f5;
      --mut: #8c8a85;
      --acc: #ffd60a;
      --green: #34c759;
      --pan: #18181b;
      --pan-border: #27272a;
      --stage: #000;
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    section {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--bg);
    }
    [hidden] { display: none !important; }
    
    button, label.btn {
      font: inherit;
      color: inherit;
      background: var(--pan);
      border: 1px solid var(--pan-border);
      border-radius: 999px;
      padding: 7px 13px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      transition: background 0.15s, transform 0.1s;
    }
    button:active, label.btn:active { transform: scale(0.95); }
    button.on, label.btn.on { background: var(--acc); color: #000; border-color: var(--acc); font-weight: 600; }
    button.locked, label.btn.locked { background: var(--green); color: #000; font-weight: 700; border-color: var(--green); }

    .row {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      flex-wrap: wrap;
      z-index: 25;
    }

    #wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      position: relative;
    }
    #stage {
      position: relative;
      flex: none;
      background: var(--stage);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 6px 28px rgba(0,0,0,0.7);
    }
    video, #ov {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    video { object-fit: cover; transform-origin: center center; }
    
    /* Top AI Guidance HUD */
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      z-index: 30;
    }
    #hint-pill {
      background: rgba(18, 18, 22, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
      max-width: 95%;
      text-align: center;
    }
    #hint-pill.locked {
      border-color: var(--green);
      color: var(--green);
      box-shadow: 0 0 24px rgba(52, 199, 89, 0.4);
    }
    #hint-pill.aiming {
      border-color: var(--acc);
      color: var(--acc);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      flex-shrink: 0;
      border-radius: 50%;
      background: currentColor;
      animation: pulseDot 1.4s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    /* APPLE iOS PRO ARC ZOOM CONTROLLER */
    #zoom-arc-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 115px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      z-index: 28;
      pointer-events: none;
    }
    /* Pill bar when collapsed */
    #zoom-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(12px);
      padding: 4px 8px;
      border-radius: 999px;
      margin-bottom: 10px;
      pointer-events: auto;
      border: 1px solid rgba(255,255,255,0.12);
      transition: opacity 0.2s, transform 0.2s;
    }
    #zoom-pills.hidden-pills {
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
    }
    .zp {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background 0.2s, color 0.2s;
    }
    .zp.active {
      background: rgba(255,255,255,0.22);
      color: var(--acc);
      transform: scale(1.12);
      border: 1px solid rgba(255, 214, 10, 0.5);
    }
    /* Interactive Pro Arc Wheel */
    #zoom-wheel-canvas {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 115px;
      pointer-events: auto;
      touch-action: none;
      opacity: 0;
      transition: opacity 0.22s ease;
    }
    #zoom-wheel-canvas.visible {
      opacity: 1;
    }

    #info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 20px;
      z-index: 25;
    }
    small {
      color: var(--mut);
      font-size: 11px;
      font-family: ui-monospace, Menlo, monospace;
    }

    #bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 6px 10px 16px;
      z-index: 25;
    }
    #shut {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid var(--bg);
      outline: 3px solid var(--fg);
      padding: 0;
      cursor: pointer;
      transition: all 0.2s;
    }
    #shut.lit {
      outline-color: var(--green);
      box-shadow: 0 0 24px var(--green);
      background: #f0fdf4;
      transform: scale(1.04);
    }
    #shut:active {
      transform: scale(0.92);
      background: var(--acc);
    }

    /* Editor View */
    #pvw {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: #000;
    }
    #pv {
      max-width: 100%;
      max-height: 100%;
      border-radius: 6px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
    }
    #panel {
      height: 195px;
      overflow-y: auto;
      padding: 4px 16px;
      background: var(--bg);
    }
    .sl {
      display: grid;
      grid-template-columns: 88px 1fr 34px;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--mut);
      margin: 6px 0;
    }
    .sl span:last-child {
      text-align: right;
      font-family: monospace;
      color: var(--fg);
    }
    #busy {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      z-index: 99;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: var(--acc);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- CAMERA SECTION -->
<section id="cam">
  <div class="row" id="top"></div>

  <div id="wrap">
    <div id="stage">
      <video id="v" playsinline webkit-playsinline muted autoplay></video>
      <canvas id="ov"></canvas>
      <div id="hud">
        <div id="hint-pill">
          <div class="status-dot"></div>
          <span id="hint-text">0.5x Wide View · Tap "✦ Scan" to Compose</span>
        </div>
      </div>

      <!-- Apple iOS Pro Camera Zoom Dial Overlay -->
      <div id="zoom-arc-wrap">
        <div id="zoom-pills">
          <button class="zp active" data-z="0.5">0.5</button>
          <button class="zp" data-z="1">1x</button>
          <button class="zp" data-z="2">2</button>
          <button class="zp" data-z="4">4</button>
          <button class="zp" data-z="8">8</button>
        </div>
        <canvas id="zoom-wheel-canvas"></canvas>
      </div>
    </div>
  </div>

  <div id="info-row">
    <small id="res">Starting sensor...</small>
    <small id="comp-tag" style="color:var(--acc);">13MM · 0.5x ULTRA WIDE</small>
    <small id="exif-tag">EXIF: Ready</small>
  </div>

  <div id="bar">
    <label class="btn" for="f1" title="Import with EXIF">Photos</label>
    <button id="scan-btn" title="One-time scan: picks composition, tracks subject, and auto-zooms">✦ Scan</button>
    <button id="shut" aria-label="Shutter"></button>
    <button id="grid-btn" title="Cycle Overlays">Grid: 3rds</button>
    <label class="btn" for="f2" title="Full native resolution capture" style="color:var(--acc); font-weight:700;">24MP</label>
  </div>
</section>

<!-- EDITOR SECTION -->
<section id="ed" hidden>
  <div id="pvw"><canvas id="pv"></canvas></div>
  <div class="row" id="tabs"></div>
  <div id="panel"></div>
  <div class="row">
    <button id="back">Retake</button>
    <small id="info" style="flex:1; text-align:center;"></small>
    <button id="save" class="on">Save</button>
  </div>
</section>

<div id="busy" hidden>
  <div class="spinner"></div>
  <span id="busy-label">Developing photo…</span>
</div>

<!-- Offscreen file pickers -->
<input type="file" id="f1" accept="image/*" style="position:fixed; top:-9999px;">
<input type="file" id="f2" accept="image/*" capture="environment" style="position:fixed; top:-9999px;">
<input type="file" id="f-lut" accept=".cube" style="position:fixed; top:-9999px;">

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    for (let r of regs) r.unregister();
  });
}

const $ = s => document.querySelector(s);
const RAT = { '3:4': 3/4, '4:5': 4/5, '1:1': 1, '3:2': 3/2, '9:16': 9/16, '65:24': 65/24 };
let ratio = '3:4', facing = 'environment', stream = null, track = null, imageCapture = null;
let src = null, small = null, p = null;
let camExp = 0, lastMP = 0;
const v = $('#v'), ov = $('#ov'), stage = $('#stage');
const tick = () => new Promise(r => setTimeout(r, 20));

// Sticky border style preserved across captures
let savedFrameStyle = 'Paper';

function getPhoneOrientation() {
  if (window.innerWidth > window.innerHeight) {
    return (window.orientation !== undefined && window.orientation !== 0) ? window.orientation : 90;
  }
  return 0;
}

/* =========================================================================
   APPLE PRO CAMERA ARC ZOOM DIAL (0.5x to 8x with MM equivalents)
   ========================================================================= */
const zoomPills = $('#zoom-pills');
const wheelCanvas = $('#zoom-wheel-canvas');
const wCtx = wheelCanvas.getContext('2d');
let currentZoom = 0.5;
let minZoom = 0.5;
let maxZoom = 8.0;
let wheelHideTimer = null;
let isDraggingWheel = false;
let dragStartX = 0;
let dragStartZoom = 0.5;

const STOPS = [
  { z: 0.5, mm: '13MM' },
  { z: 1.0, mm: '24MM' },
  { z: 2.0, mm: '48MM' },
  { z: 4.0, mm: '100MM' },
  { z: 8.0, mm: '200MM' }
];

function zoomToMM(z) {
  return Math.round(z * 24) + 'MM';
}

function applyCameraZoom(val) {
  currentZoom = Math.max(0.5, Math.min(8.0, val));

  // Update active pill
  document.querySelectorAll('.zp').forEach(btn => {
    const bz = parseFloat(btn.dataset.z);
    const isCurrent = Math.abs(bz - currentZoom) < 0.25 || 
      (bz === 0.5 && currentZoom < 0.8) ||
      (bz === 1 && currentZoom >= 0.8 && currentZoom < 1.6) ||
      (bz === 2 && currentZoom >= 1.6 && currentZoom < 3.2) ||
      (bz === 4 && currentZoom >= 3.2 && currentZoom < 6.0) ||
      (bz === 8 && currentZoom >= 6.0);
    btn.classList.toggle('active', isCurrent);
    if (isCurrent) {
      btn.textContent = (Math.abs(currentZoom - bz) < 0.08) 
        ? (bz === 1 ? '1x' : bz) 
        : currentZoom.toFixed(1) + 'x';
    } else {
      btn.textContent = bz === 1 ? '1x' : bz;
    }
  });

  const mmText = zoomToMM(currentZoom);
  $('#comp-tag').textContent = `${mmText} · ${currentZoom.toFixed(1)}x`;

  // Apply to hardware sensor if supported, or smooth optical-like crop scale
  const c = track && track.getCapabilities ? track.getCapabilities() : {};
  if (c.zoom) {
    const hwMin = c.zoom.min || 1.0;
    const hwMax = c.zoom.max || 8.0;
    if (currentZoom >= 1.0) {
      const targetHW = Math.min(hwMax, Math.max(hwMin, currentZoom));
      track.applyConstraints({ advanced: [{ zoom: targetHW }] }).catch(() => {});
      v.style.transform = currentZoom > hwMax ? `scale(${currentZoom / hwMax})` : 'scale(1)';
    } else {
      // 0.5x Ultra-Wide view: set hardware to minimum and fit full wide sensor
      track.applyConstraints({ advanced: [{ zoom: hwMin }] }).catch(() => {});
      v.style.transform = 'scale(1)';
    }
  } else {
    // Fallback digital zoom scaling relative to 0.5x base
    const scaleFactor = currentZoom <= 0.5 ? 1.0 : (currentZoom / 0.5) * 0.72;
    v.style.transform = `scale(${Math.max(1.0, scaleFactor)})`;
  }

  updateSynthesizedExif();
  drawZoomArcWheel();
}

// Draw the Apple Pro Arc Dial on wheelCanvas
function drawZoomArcWheel() {
  const dpr = devicePixelRatio || 1;
  const W = wheelCanvas.clientWidth;
  const H = wheelCanvas.clientHeight;
  if (!W || !H) return;
  wheelCanvas.width = W * dpr;
  wheelCanvas.height = H * dpr;
  wCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  wCtx.clearRect(0, 0, W, H);

  const cx = W / 2;
  const radius = W * 0.72;
  const cy = H + radius - 95;

  // Semi-transparent dark dome background
  wCtx.save();
  wCtx.beginPath();
  wCtx.arc(cx, cy, radius, Math.PI * 1.15, Math.PI * 1.85);
  wCtx.lineTo(cx, cy);
  wCtx.closePath();
  wCtx.fillStyle = 'rgba(10, 10, 12, 0.72)';
  wCtx.fill();
  wCtx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
  wCtx.lineWidth = 1;
  wCtx.stroke();

  // Convert zoom (0.5 .. 8.0) to logarithmic angle (-40 deg to +40 deg)
  const logMin = Math.log2(0.5); // -1
  const logMax = Math.log2(8.0); // +3
  const curLog = Math.log2(currentZoom);

  // Draw ticks along arc
  const totalTicks = 40;
  for (let i = 0; i <= totalTicks; i++) {
    const tLog = logMin + (i / totalTicks) * (logMax - logMin);
    const tZoom = Math.pow(2, tLog);
    const angleOffset = (tLog - curLog) * 0.28; // radians
    const angle = -Math.PI / 2 + angleOffset;

    if (angle < -Math.PI * 0.82 || angle > -Math.PI * 0.18) continue;

    const isMajor = (i % 10 === 0);
    const tickLen = isMajor ? 14 : 7;
    const rOuter = radius - 6;
    const rInner = rOuter - tickLen;

    const x1 = cx + Math.cos(angle) * rOuter;
    const y1 = cy + Math.sin(angle) * rOuter;
    const x2 = cx + Math.cos(angle) * rInner;
    const y2 = cy + Math.sin(angle) * rInner;

    wCtx.beginPath();
    wCtx.moveTo(x1, y1);
    wCtx.lineTo(x2, y2);
    wCtx.strokeStyle = isMajor ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.35)';
    wCtx.lineWidth = isMajor ? 2 : 1;
    wCtx.stroke();

    // Label major stops (0.5, 1x, 2, 4, 8)
    if (isMajor) {
      const stopVal = Math.round(tZoom * 10) / 10;
      const lx = cx + Math.cos(angle) * (rInner - 14);
      const ly = cy + Math.sin(angle) * (rInner - 14);
      wCtx.save();
      wCtx.translate(lx, ly);
      wCtx.rotate(angle + Math.PI / 2);
      wCtx.font = '700 12px -apple-system, sans-serif';
      wCtx.fillStyle = Math.abs(currentZoom - stopVal) < 0.15 ? '#ffd60a' : '#fff';
      wCtx.textAlign = 'center';
      wCtx.fillText(stopVal === 1 ? '1x' : String(stopVal), 0, 0);

      wCtx.font = '500 9px ui-monospace, monospace';
      wCtx.fillStyle = 'rgba(255,214,10,0.85)';
      wCtx.fillText(zoomToMM(stopVal), 0, 12);
      wCtx.restore();
    }
  }

  // Yellow Center Pointer Triangle at top of arc
  const topY = cy - radius + 2;
  wCtx.fillStyle = '#ffd60a';
  wCtx.beginPath();
  wCtx.moveTo(cx, topY + 10);
  wCtx.lineTo(cx - 5, topY + 2);
  wCtx.lineTo(cx + 5, topY + 2);
  wCtx.closePath();
  wCtx.fill();

  wCtx.restore();
}

function showZoomWheelTemporarily() {
  wheelCanvas.classList.add('visible');
  zoomPills.classList.add('hidden-pills');
  drawZoomArcWheel();
  clearTimeout(wheelHideTimer);
  wheelHideTimer = setTimeout(() => {
    if (!isDraggingWheel) {
      wheelCanvas.classList.remove('visible');
      zoomPills.classList.remove('hidden-pills');
    }
  }, 1600);
}

// Dual Tap & Scrub Interaction (Matching Apple Camera):
// 1. Single Tap on pill -> Directly snaps to 0.5x, 1x, 2x, 4x, 8x
// 2. Drag / Swipe horizontally -> Opens and scrubs the curved Apple Arc Dial
let isScrubbing = false;
let touchMovedDist = 0;

document.querySelectorAll('.zp').forEach(btn => {
  // Direct click handler
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const targetZ = parseFloat(btn.dataset.z);
    applyCameraZoom(targetZ);
    showZoomWheelTemporarily();
  });
});

function handleZoomPointerDown(clientX) {
  isDraggingWheel = true;
  isScrubbing = false;
  touchMovedDist = 0;
  dragStartX = clientX;
  dragStartZoom = currentZoom;
}

function handleZoomPointerMove(clientX) {
  if (!isDraggingWheel) return;
  const deltaX = dragStartX - clientX;
  touchMovedDist = Math.abs(deltaX);

  // If moved > 6px, user is scrubbing the arc wheel
  if (touchMovedDist > 6) {
    isScrubbing = true;
    showZoomWheelTemporarily();
    const logStart = Math.log2(dragStartZoom);
    const logDelta = deltaX / 80;
    const newZoom = Math.pow(2, Math.max(-1, Math.min(3, logStart + logDelta)));
    applyCameraZoom(newZoom);
  }
}

function handleZoomPointerUp(e) {
  if (!isDraggingWheel) return;
  isDraggingWheel = false;
  isScrubbing = false;
  showZoomWheelTemporarily();
}

zoomPills.addEventListener('pointerdown', e => {
  handleZoomPointerDown(e.clientX);
});
wheelCanvas.addEventListener('pointerdown', e => {
  try { wheelCanvas.setPointerCapture(e.pointerId); } catch(err){}
  handleZoomPointerDown(e.clientX);
});
window.addEventListener('pointermove', e => {
  handleZoomPointerMove(e.clientX);
});
window.addEventListener('pointerup', handleZoomPointerUp);
window.addEventListener('pointercancel', handleZoomPointerUp);


/* =========================================================================
   REAL-TIME OPTICAL TEMPLATE + GYRO TARGET TRACKER & COMPOSITION SELECTOR
   ========================================================================= */
let lockedTarget = null; 
// { x, y, label, targetZoom, compName, patch: Uint8Array, patchW: 12, patchH: 12 }
let scanState = 'idle'; // 'idle' | 'locked_aiming' | 'centered_zoomed'
let hasVibrated = false;

// Gyroscope delta tracking for instant pan/tilt feedback
let lastGyro = null;
window.addEventListener('deviceorientation', e => {
  if (scanState !== 'locked_aiming' || !lockedTarget) {
    lastGyro = { beta: e.beta || 0, gamma: e.gamma || 0 };
    return;
  }
  const b = e.beta || 0;
  const g = e.gamma || 0;
  if (lastGyro) {
    const dGamma = g - lastGyro.gamma; // Pan left/right (degrees)
    const dBeta = b - lastGyro.beta;   // Tilt up/down (degrees)
    // When camera pans right (dGamma > 0), a real-world object moves LEFT in the camera view!
    const fovDeg = 65 / Math.max(1, currentZoom);
    if (Math.abs(dGamma) < 20 && Math.abs(dBeta) < 20) {
      lockedTarget.x -= (dGamma / fovDeg);
      lockedTarget.y -= (dBeta / fovDeg);
    }
  }
  lastGyro = { beta: b, gamma: g };
});

const scanCanvas = document.createElement('canvas');
const SW = 64, SH = 64;
scanCanvas.width = SW;
scanCanvas.height = SH;

// Step 1: Analyze Wide Scene, Pick Best Composition & Extract Visual Patch
function scanSceneAndSelectComposition() {
  if (!v.videoWidth || v.paused) return null;
  const q = vis();
  const x = scanCanvas.getContext('2d', { willReadFrequently: true });
  x.drawImage(v, q.x, q.y, q.w, q.h, 0, 0, SW, SH);
  const d = x.getImageData(0, 0, SW, SH).data;

  // Compute local luminance & structure tensor (Sobel edges + local contrast)
  const lum = new Float32Array(SW * SH);
  let meanLum = 0;
  for (let i = 0; i < SW * SH; i++) {
    lum[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
    meanLum += lum[i];
  }
  meanLum /= (SW * SH);

  let bestX = Math.floor(SW / 2), bestY = Math.floor(SH / 2), maxScore = -1;
  let horizEnergy = 0, vertEnergy = 0;

  // Evaluate 8x8 windows to find the most distinct 3D object/subject (ignores flat bedsheet patterns by favoring isolated focal contrast)
  for (let y = 8; y < SH - 8; y += 2) {
    for (let xx = 8; xx < SW - 8; xx += 2) {
      let boxEdge = 0, boxChroma = 0;
      for (let dy = -3; dy <= 3; dy++) {
        for (let dx = -3; dx <= 3; dx++) {
          const idx = (y + dy) * SW + (xx + dx);
          const gx = Math.abs(lum[idx + 1] - lum[idx - 1]);
          const gy = Math.abs(lum[idx + SW] - lum[idx - SW]);
          boxEdge += (gx + gy);
          horizEnergy += gy;
          vertEnergy += gx;

          const pIdx = idx * 4;
          const r = d[pIdx], g = d[pIdx + 1], b = d[pIdx + 2];
          boxChroma += (Math.max(r, g, b) - Math.min(r, g, b));
        }
      }

      // Surround suppression: true subjects stand out from their outer ring
      const centerL = lum[y * SW + xx];
      const surroundDiff = Math.abs(centerL - meanLum);

      // Favor upper/middle focal plane over bottom edge clutter
      const ny = y / SH;
      const heightBias = ny < 0.78 ? 1.25 : 0.65;

      const score = (boxEdge * 1.1 + boxChroma * 0.9 + surroundDiff * 12) * heightBias;
      if (score > maxScore) {
        maxScore = score;
        bestX = xx;
        bestY = y;
      }
    }
  }

  // Extract 9x9 template patch around (bestX, bestY) for real-time optical tracking
  const PW = 9;
  const patch = new Float32Array(PW * PW);
  const half = Math.floor(PW / 2);
  for (let py = 0; py < PW; py++) {
    for (let px = 0; px < PW; px++) {
      const sy = Math.min(SH - 1, Math.max(0, bestY - half + py));
      const sx = Math.min(SW - 1, Math.max(0, bestX - half + px));
      patch[py * PW + px] = lum[sy * SW + sx];
    }
  }

  // Decide best composition based on subject placement & scene lines
  const normX = bestX / SW;
  const normY = bestY / SH;
  let compName = 'Rule of Thirds';
  let recommendedGrid = '3rds';
  let recZoom = 2.0;

  if (Math.abs(normX - 0.5) < 0.12 && Math.abs(normY - 0.5) < 0.12) {
    compName = 'Center Symmetry';
    recommendedGrid = 'phi';
    recZoom = 1.8;
  } else if (horizEnergy > vertEnergy * 1.35) {
    compName = 'Golden Horizon';
    recommendedGrid = 'phi';
    recZoom = 1.5;
  } else {
    compName = 'Rule of Thirds Isolation';
    recommendedGrid = '3rds';
    recZoom = 2.0;
  }

  // Set the grid automatically to match the chosen composition
  gridMode = recommendedGrid;
  $('#grid-btn').textContent = `Grid: ${gridMode}`;

  return {
    x: normX,
    y: normY,
    label: compName,
    targetZoom: recZoom,
    patch,
    pw: PW
  };
}

// Step 2: Real-Time Optical Patch Tracking (Updates lockedTarget.x, y as camera moves!)
function trackLockedTargetOnVideo() {
  if (scanState !== 'locked_aiming' || !lockedTarget || !v.videoWidth || v.paused) return;

  const q = vis();
  const x = scanCanvas.getContext('2d', { willReadFrequently: true });
  x.drawImage(v, q.x, q.y, q.w, q.h, 0, 0, SW, SH);
  const d = x.getImageData(0, 0, SW, SH).data;

  const lum = new Float32Array(SW * SH);
  for (let i = 0; i < SW * SH; i++) {
    lum[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
  }

  const curX = Math.round(lockedTarget.x * SW);
  const curY = Math.round(lockedTarget.y * SH);
  const searchRadius = 10; // search +/- 10 cells around current position
  const PW = lockedTarget.pw;
  const half = Math.floor(PW / 2);
  const patch = lockedTarget.patch;

  let bestMatchX = curX;
  let bestMatchY = curY;
  let minSSD = Infinity;

  for (let sy = Math.max(half, curY - searchRadius); sy <= Math.min(SH - 1 - half, curY + searchRadius); sy++) {
    for (let sx = Math.max(half, curX - searchRadius); sx <= Math.min(SW - 1 - half, curX + searchRadius); sx++) {
      let ssd = 0;
      for (let py = 0; py < PW; py++) {
        for (let px = 0; px < PW; px++) {
          const diff = lum[(sy - half + py) * SW + (sx - half + px)] - patch[py * PW + px];
          ssd += diff * diff;
        }
      }
      if (ssd < minSSD) {
        minSSD = ssd;
        bestMatchX = sx;
        bestMatchY = sy;
      }
    }
  }

  // Smoothly update target coordinates with optical match
  const newX = bestMatchX / SW;
  const newY = bestMatchY / SH;
  lockedTarget.x = lockedTarget.x * 0.35 + newX * 0.65;
  lockedTarget.y = lockedTarget.y * 0.35 + newY * 0.65;

  // Refresh patch slightly to adapt to lighting changes
  for (let py = 0; py < PW; py++) {
    for (let px = 0; px < PW; px++) {
      const lumVal = lum[(bestMatchY - half + py) * SW + (bestMatchX - half + px)];
      patch[py * PW + px] = patch[py * PW + px] * 0.85 + lumVal * 0.15;
    }
  }
}

// Real-Time 60fps Tracking & Auto-Zoom Trigger Loop
function monitorSubjectAlignment() {
  if (scanState === 'locked_aiming' && lockedTarget) {
    // 1. Track subject movement across the video feed in real time!
    trackLockedTargetOnVideo();

    // 2. Check distance between center crosshair (0.5, 0.5) and tracked target
    const dx = lockedTarget.x - 0.5;
    const dy = lockedTarget.y - 0.5;
    const distance = Math.hypot(dx, dy);

    if (distance > 0.045) {
      updateGuidanceHUD(dx, dy);
    } else {
      // Camera reached the target point! Lock and Auto-Zoom!
      scanState = 'centered_zoomed';
      lockedTarget.x = 0.5;
      lockedTarget.y = 0.5;
      $('#hint-pill').className = 'locked';
      $('#scan-btn').classList.remove('on');
      $('#scan-btn').classList.add('locked');

      const targetZ = lockedTarget.targetZoom || 2.0;
      let zStep = currentZoom;
      const zTimer = setInterval(() => {
        if (zStep < targetZ - 0.05) {
          zStep += (targetZ - zStep) * 0.28;
          applyCameraZoom(zStep);
          $('#hint-text').textContent = `✨ ${lockedTarget.label} · Auto-Zooming ${zStep.toFixed(1)}x…`;
        } else {
          clearInterval(zTimer);
          applyCameraZoom(targetZ);
          $('#hint-text').textContent = `✓ ${lockedTarget.label} Locked (${targetZ.toFixed(1)}x) — Shoot!`;
          $('#shut').classList.add('lit');

          if (!hasVibrated && navigator.vibrate) {
            try { navigator.vibrate([45, 60, 45]); } catch(err){}
            hasVibrated = true;
          }
        }
      }, 35);
    }
    draw();
  }
  requestAnimationFrame(monitorSubjectAlignment);
}
requestAnimationFrame(monitorSubjectAlignment);

function updateGuidanceHUD(dx = 0, dy = 0) {
  if (scanState !== 'locked_aiming' || !lockedTarget) return;
  const dirs = [];
  if (Math.abs(dx) > 0.06) dirs.push(dx > 0 ? 'Pan Right ▸' : '◂ Pan Left');
  if (Math.abs(dy) > 0.06) dirs.push(dy > 0 ? 'Tilt Down ▾' : '▴ Tilt Up');
  const dirText = dirs.length ? dirs.join(' · ') : 'Hold steady on target…';
  $('#hint-text').textContent = `🎯 ${lockedTarget.label}: ${dirText}`;
}


/* =========================================================================
   CANVAS OVERLAYS: DYNAMIC TRACKING RETICLE, VECTOR LINE & GRIDS
   ========================================================================= */
function draw() {
  const x = ov.getContext('2d'), W = ov.width, H = ov.height;
  x.clearRect(0, 0, W, H);

  drawGridOverlay(x, W, H);

  // Center Crosshair (Fixed at camera center)
  x.save();
  const isLocked = (scanState === 'centered_zoomed');
  x.strokeStyle = isLocked ? '#34c759' : 'rgba(255, 255, 255, 0.55)';
  x.lineWidth = isLocked ? 2.5 : 1.5;
  x.beginPath();
  x.moveTo(W / 2 - 14, H / 2); x.lineTo(W / 2 + 14, H / 2);
  x.moveTo(W / 2, H / 2 - 14); x.lineTo(W / 2, H / 2 + 14);
  x.stroke();

  // Draw Tracked Subject Reticle & Shrinking Vector Line
  if (lockedTarget && scanState !== 'idle') {
    const tx = lockedTarget.x * W;
    const ty = lockedTarget.y * H;
    const color = isLocked ? '#34c759' : '#ffd60a';

    // Outer target ring + corner ticks
    x.strokeStyle = color;
    x.lineWidth = isLocked ? 3 : 2.2;
    x.beginPath();
    x.arc(tx, ty, isLocked ? 32 : 22, 0, Math.PI * 2);
    x.stroke();

    // Inner subject anchor dot
    x.fillStyle = color;
    x.beginPath();
    x.arc(tx, ty, 5, 0, Math.PI * 2);
    x.fill();

    if (!isLocked) {
      // Dynamic dashed vector line connecting Center Crosshair to Moving Target
      x.setLineDash([6, 6]);
      x.strokeStyle = color;
      x.lineWidth = 2;
      x.beginPath();
      x.moveTo(W / 2, H / 2);
      x.lineTo(tx, ty);
      x.stroke();
      x.setLineDash([]);

      // Composition label badge
      x.font = '600 11.5px -apple-system, sans-serif';
      const badgeText = `● ${lockedTarget.label}`;
      const tw = x.measureText(badgeText).width + 16;
      const bx = Math.min(W - tw - 8, Math.max(8, tx + 14));
      const by = Math.max(28, ty - 16);
      x.fillStyle = 'rgba(12, 12, 15, 0.88)';
      x.fillRect(bx, by - 16, tw, 22);
      x.fillStyle = color;
      x.fillText(badgeText, bx + 8, by - 1);
    }
  }
  x.restore();
}

const GRID_MODES = ['3rds', 'phi', 'spiral', 'baroque', 'off'];
let gridMode = '3rds';

$('#grid-btn').onclick = (e) => {
  e.stopPropagation();
  const nextIdx = (GRID_MODES.indexOf(gridMode) + 1) % GRID_MODES.length;
  gridMode = GRID_MODES[nextIdx];
  $('#grid-btn').textContent = `Grid: ${gridMode}`;
  $('#grid-btn').classList.toggle('on', gridMode !== 'off');
  draw();
};

function drawGridOverlay(x, W, H) {
  if (gridMode === 'off') return;
  x.save();
  x.strokeStyle = 'rgba(255, 255, 255, 0.26)';
  x.lineWidth = 1;

  if (gridMode === '3rds') {
    x.beginPath();
    for (let i = 1; i < 3; i++) {
      x.moveTo(W * i / 3, 0); x.lineTo(W * i / 3, H);
      x.moveTo(0, H * i / 3); x.lineTo(W, H * i / 3);
    }
    x.stroke();
  } else if (gridMode === 'phi') {
    const p1 = 0.382, p2 = 0.618;
    x.beginPath();
    x.moveTo(W * p1, 0); x.lineTo(W * p1, H);
    x.moveTo(W * p2, 0); x.lineTo(W * p2, H);
    x.moveTo(0, H * p1); x.lineTo(W, H * p1);
    x.moveTo(0, H * p2); x.lineTo(W, H * p2);
    x.stroke();
  } else if (gridMode === 'spiral') {
    x.beginPath();
    let sx = 0, sy = 0, sw = W, sh = H;
    const phi = 0.6180339887;
    for (let i = 0; i < 5; i++) {
      const cut = (i % 2 === 0) ? sw * phi : sh * phi;
      if (i % 2 === 0) {
        x.strokeRect(sx, sy, cut, sh);
        sx += cut; sw -= cut;
      } else {
        x.strokeRect(sx, sy, sw, cut);
        sy += cut; sh -= cut;
      }
    }
  } else if (gridMode === 'baroque') {
    x.beginPath();
    x.moveTo(0, H); x.lineTo(W, 0);
    x.moveTo(0, 0); x.lineTo(W, H);
    x.stroke();
  }
  x.restore();
}

function vis() {
  const vw = v.videoWidth || 640, vh = v.videoHeight || 480, a = RAT[ratio];
  let cw, ch;
  if (vw / vh > a) { ch = vh; cw = vh * a; } else { cw = vw; ch = vw / a; }
  return { x: (vw - cw) / 2, y: (vh - ch) / 2, w: cw, h: ch };
}

function fit() {
  const w = $('#wrap'), a = RAT[ratio] || (3/4);

  const H = Math.max(100, w.clientHeight - 8);
  if (W <= 0 || H <= 0) return;

  let sw = W, sh = W / a;
  if (sh > H) {
    sh = H;
    sw = H * a;

  stage.style.height = Math.round(sh) + 'px';

   SHUTTER CAPTURE (RESETS SCAN & RESETS ZOOM TO 0.5x AFTER CLICKING)
   ========================================================================= */
$('#shut').onclick = async (e) => {
  e.stopPropagation();
  $('#busy-label').textContent = 'Developing High-Res Capture…';
  $('#busy').hidden = false;
  await tick();

  let captured = null;
  if (imageCapture) {
    try {
      const blob = await imageCapture.takePhoto();
      const bm = await createImageBitmap(blob);
      captured = document.createElement('canvas');
      captured.width = bm.width; captured.height = bm.height;
      captured.getContext('2d').drawImage(bm, 0, 0);
    } catch(err){}
  }
  if (!captured) {
    const s = track ? track.getSettings() : {};
    const w = (s && s.width) || v.videoWidth || 1920;
    const h = (s && s.height) || v.videoHeight || 1080;
    captured = document.createElement('canvas');
    captured.width = w; captured.height = h;
    captured.getContext('2d').drawImage(v, 0, 0, w, h);
  }

  const rotAngle = getPhoneOrientation();
  let orientedCanvas = captured;
  if (rotAngle !== 0) {
    orientedCanvas = document.createElement('canvas');
    const isQuarter = (Math.abs(rotAngle) === 90);
    orientedCanvas.width = isQuarter ? captured.height : captured.width;
    orientedCanvas.height = isQuarter ? captured.width : captured.height;

    const rx = orientedCanvas.getContext('2d');
    rx.translate(orientedCanvas.width / 2, orientedCanvas.height / 2);
    rx.rotate((-rotAngle * Math.PI) / 180);
    rx.drawImage(captured, -captured.width / 2, -captured.height / 2);
  }

  // Crop to chosen aspect ratio & digital zoom factor if applicable
  const targetAspect = RAT[ratio];
  let cw = orientedCanvas.width, ch = orientedCanvas.height;
  if (cw / ch > targetAspect) cw = ch * targetAspect; else ch = cw / targetAspect;

  const c = track && track.getCapabilities ? track.getCapabilities() : {};
  if (!c.zoom && currentZoom > 0.5) {
    const zScale = Math.min(4.0, currentZoom / 0.5 * 0.72);
    cw /= zScale;
    ch /= zScale;
  }

  const cropX = (orientedCanvas.width - cw) / 2;
  const cropY = (orientedCanvas.height - ch) / 2;

  const finalC = document.createElement('canvas');
  finalC.width = Math.round(cw);
  finalC.height = Math.round(ch);
  finalC.getContext('2d').drawImage(orientedCanvas, cropX, cropY, cw, ch, 0, 0, finalC.width, finalC.height);

  const exifData = updateSynthesizedExif();

  // AUTO-RESET SCAN AND ZOOM TO 0.5x AFTER CLICKING PICTURE
  resetScanDirector();
  applyCameraZoom(0.5);

  $('#busy').hidden = true;
  edit(finalC, camExp, exifData);
};

async function loadFile(f) {

  await tick();
  let bm;
  try {
    bm = await createImageBitmap(f, { imageOrientation: 'from-image' });
  } catch(e) {
    bm = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = rej;
      i.src = URL.createObjectURL(f);
    });
  }
  const c = document.createElement('canvas');
  c.width = bm.width; c.height = bm.height;
  c.getContext('2d').drawImage(bm, 0, 0);

  resetScanDirector();
  applyCameraZoom(0.5);

  $('#busy').hidden = true;
  edit(c, 0, updateSynthesizedExif());
}

function curveLUT(P) {
  const n = P.length, x = P.map(a => a[0]), y = P.map(a => a[1]);
  const dx = [], m = [], t = new Array(n);
  for (let i = 0; i < n - 1; i++) { dx[i] = x[i + 1] - x[i]; m[i] = (y[i + 1] - y[i]) / dx[i]; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) t[i] = t[i + 1] = 0;

const BC = [0, 30, 60, 120, 180, 225, 270, 320];

let hk = 0, cch = 'm';
const HC = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#14b8a6', '#3b82f6', '#8b5cf6', '#d946ef'];
const CCOL = { m: '#e8e6e0', r: '#ef4444', g: '#22c55e', b: '#3b82f6' };
const idPts = () => Array.from({ length: 9 }, (_, i) => [i / 8, i / 8]);

function hslPanel(P) {
  p.hsl = p.hsl || HC.map(() => [0, 0, 0]);
  const r = document.createElement('div');
  r.className = 'row';
  HC.forEach((c, i) => {
    const b = document.createElement('button');
    b.style.cssText = `width:32px;height:32px;padding:0;background:${c};outline:${i === hk ? '3px solid var(--fg)' : 'none'};border-radius:50%;`;
    b.onclick = () => { hk = i; panel(); };
    r.appendChild(b);
  });
  P.appendChild(r);
  ['Hue', 'Saturation', 'Luminance'].forEach((n, j) => {
    const d = document.createElement('div');
    d.className = 'sl';
    const v = p.hsl[hk][j];
    d.innerHTML = `<span>${n}</span><input type="range" min="-100" max="100" value="${v}"><span>${v}</span>`;
    d.querySelector('input').oninput = e => { p.hsl[hk][j] = +e.target.value; d.lastChild.textContent = e.target.value; paint(); };
    P.appendChild(d);
  });
}

function curvePanel(P) {
  p.curves = p.curves || { m: idPts(), r: idPts(), g: idPts(), b: idPts() };
  const S = 150, dpr = devicePixelRatio || 1;
  const w = document.createElement('div');
  w.style.cssText = 'display:flex;gap:14px;align-items:center;justify-content:center;';
  const cv = document.createElement('canvas');
  cv.width = cv.height = S * dpr;
  cv.style.cssText = `width:${S}px;height:${S}px;border-radius:10px;background:var(--pan);touch-action:none;`;

  const dr = () => {
    const x = cv.getContext('2d');
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.clearRect(0, 0, S, S);
    x.strokeStyle = 'rgba(128,128,128,.3)';
    x.lineWidth = 1;
    x.beginPath();
    for (let i = 1; i < 4; i++) {
      x.moveTo(S * i / 4, 0); x.lineTo(S * i / 4, S);
      x.moveTo(0, S * i / 4); x.lineTo(S, S * i / 4);
    }
    x.stroke();
    const pts = p.curves[cch], L = curveLUT(pts);
    x.strokeStyle = CCOL[cch];
    x.lineWidth = 2.5;
    x.beginPath();
    for (let v = 0; v < 256; v++) {
      const X = v / 255 * S, Y = S - L[v] / 255 * S;
      v ? x.lineTo(X, Y) : x.moveTo(X, Y);

    x.stroke();
    x.fillStyle = CCOL[cch];

  };

  let di = -1;
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height]; };
  cv.onpointerdown = e => { const q = pos(e); di = Math.round(Math.min(1, Math.max(0, q[0])) * 8); cv.setPointerCapture(e.pointerId); p.curves[cch][di][1] = Math.min(1, Math.max(0, q[1])); dr(); paint(); };

  const col = document.createElement('div');
  col.style.cssText = 'display:flex;flex-direction:column;gap:6px;';
  [['m', 'RGB'], ['r', 'R'], ['g', 'G'], ['b', 'B']].forEach(([k, n]) => {
    const b = document.createElement('button');
    b.textContent = n;
    b.className = k === cch ? 'on' : '';
    b.onclick = () => { cch = k; panel(); };
    col.appendChild(b);
  });
  const rs = document.createElement('button');
  rs.textContent = 'Reset';
  rs.onclick = () => { p.curves = null; panel(); paint(); };
  col.appendChild(rs);
  w.appendChild(cv); w.appendChild(col); P.appendChild(w); dr();
}

function stampInputs(P) {
  [['title', 'Title (Make & Model)', 'FRAMED STUDIO'], ['specs', 'Lens / Exposure Specs', '24MM F/1.78 · ISO 64']].forEach(([k, l, ph]) => {
    const i = document.createElement('input');
    i.value = p[k] || '';
    i.placeholder = ph;
    i.style.cssText = 'display:block;width:100%;box-sizing:border-box;margin:6px 0;padding:8px 12px;border:0;border-radius:8px;background:var(--pan);color:var(--fg);font-size:13px;';
    i.oninput = e => { p[k] = e.target.value; paint(); };
    P.appendChild(i);
  });
}

let tab = 'Looks', raf = 0;
function edit(c, expo, exifData = null) {
  src = c;
  const k = Math.min(1, 1400 / Math.max(c.width, c.height));
  small = document.createElement('canvas');
  small.width = Math.round(c.width * k);
  small.height = Math.round(c.height * k);
  small.getContext('2d').drawImage(c, 0, 0, small.width, small.height);

  p = { ...DEF, ...LOOKS.PORTRA, frame: savedFrameStyle, seed: 1 + Math.floor(Math.random() * 999) };
  p.exposure += expo * 30;

  if (exifData) {
    if (exifData.title) p.title = exifData.title;
    if (exifData.specs) p.specs = exifData.specs;
  }

  $('#info').textContent = `${(c.width * c.height / 1e6).toFixed(1)} MP Source`;
  $('#cam').hidden = true;
  $('#ed').hidden = false;
  tabs(); panel(); paint();
}

function tabs() {
  const t = $('#tabs');
  t.innerHTML = '';
  Object.keys(TABS).forEach(k => {
    const b = document.createElement('button');
    b.textContent = k;
    b.className = k === tab ? 'on' : '';
    b.onclick = () => { tab = k; tabs(); panel(); };
    t.appendChild(b);
  });
}

function panel() {
  const P = $('#panel');
  P.innerHTML = '';
  if (tab === 'Curve') return curvePanel(P);
  if (tab === 'HSL') return hslPanel(P);
  if (tab === 'Looks') {
    const r = document.createElement('div');
    r.className = 'row';
    Object.keys(LOOKS).forEach(k => {
      const b = document.createElement('button');
      b.textContent = k;
      b.className = p.look === k ? 'on' : '';
      b.onclick = () => {
        p = { ...DEF, ...LOOKS[k], look: k, frame: savedFrameStyle, date: p.date, title: p.title, specs: p.specs, curves: p.curves, hsl: p.hsl, seed: p.seed };
        panel(); paint();
      };
      r.appendChild(b);
    });
    P.appendChild(r);
  } else if (tab === 'Frame') {
    const r = document.createElement('div');
    r.className = 'row';
    FRAMES.forEach(k => {
      const b = document.createElement('button');
      b.textContent = k;
      b.className = p.frame === k ? 'on' : '';
      b.onclick = () => {
        p.frame = k;
        savedFrameStyle = k;
        panel(); paint();
      };
      r.appendChild(b);
    });
    const d = document.createElement('button');
    d.textContent = 'Date Stamp';
    d.className = p.date ? 'on' : '';
    d.onclick = () => { p.date = !p.date; panel(); paint(); };
    r.appendChild(d);
    P.appendChild(r);
    stampInputs(P);
  } else {
    TABS[tab].forEach(([k, n]) => {
      const d = document.createElement('div');
      d.className = 'sl';
      const neg = ['exposure', 'contrast', 'highlights', 'shadows', 'temp', 'tint', 'sat'].includes(k);
      d.innerHTML = `<span>${n}</span><input type="range" min="${neg ? -100 : 0}" max="100" value="${p[k]}"><span>${Math.round(p[k])}</span>`;
      d.querySelector('input').oninput = e => { p[k] = +e.target.value; d.lastChild.textContent = e.target.value; paint(); };
      P.appendChild(d);
    });
  }
}

function paint() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    const o = render(small, p);
    const pv = $('#pv');
    pv.width = o.width; pv.height = o.height;
    pv.getContext('2d').drawImage(o, 0, 0);
  });
}

function hash(x, y, s) {
  let n = Math.imul(x, 374761393) + Math.imul(y, 668265263) + s | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}

function render(sc, p) {
  const w = sc.width, h = sc.height, m = Math.min(w, h);
  const ph = document.createElement('canvas');
  ph.width = w; ph.height = h;
  const x = ph.getContext('2d', { willReadFrequently: true });
  x.drawImage(sc, 0, 0);

  const ex = Math.pow(2, p.exposure / 50), ct = 1 + p.contrast / 100, hi = p.highlights / 100, sh = p.shadows / 100, fd = p.fade / 100 * 0.14, tw = p.temp / 100, tn = p.tint / 100, sa = 1 + p.sat / 100, gr = p.grain / 100 * 0.22, vg = p.vignette / 100, bs = Math.max(0, Math.min(3, Math.round(Math.log2(w / 1200)))), sd = p.seed * 7919;
  const CV = buildCurves(p), CR = CV && CV[0], CG = CV && CV[1], CB = CV && CV[2], HS = hslActive(p);

  for (let y0 = 0; y0 < h; y0 += 256) {
    const hh = Math.min(256, h - y0), im = x.getImageData(0, y0, w, hh), d = im.data;
    for (let yy = 0; yy < hh; yy++) {
      const y = y0 + yy, dy = y / h - 0.5;
      for (let xx = 0; xx < w; xx++) {
        const i = (yy * w + xx) * 4;
        let r = d[i] / 255 * ex * (1 + tw * 0.18);
        let g = d[i + 1] / 255 * ex * (1 - tn * 0.12);
        let b = d[i + 2] / 255 * ex * (1 - tw * 0.18);
        let l = 0.299 * r + 0.587 * g + 0.114 * b;

        const a = sh * (1 - l)**2 * 0.35 + hi * l * l * 0.35;
        r += a; g += a; b += a;
        r = (r - 0.5) * ct + 0.5; g = (g - 0.5) * ct + 0.5; b = (b - 0.5) * ct + 0.5;
        r = fd + r * (1 - fd); g = fd + g * (1 - fd); b = fd + b * (1 - fd);
        l = 0.299 * r + 0.587 * g + 0.114 * b;

        if (p.mono) {
          r = g = b = l;
        } else {
          r = l + (r - l) * sa;
          g = l + (g - l) * sa;
          b = l + (b - l) * sa;
        }

        if (HS) {
          hslApply(r, g, b, p.hsl);
          r = hR; g = hG; b = hB;
        }

        const dx = xx / w - 0.5, vf = 1 - vg * (dx * dx + dy * dy) * 2.2;
        const n = gr ? (hash(xx >> bs, y >> bs, sd) - 0.5) * gr * (1.1 - Math.abs(l - 0.5)) : 0;

          d[i + 1] = CG[d[i + 1]];
          d[i + 2] = CB[d[i + 2]];

  }

  const rr = () => (s = (s * 16807) % 2147483647) / 2147483647;

  if (p.glow > 0) {
    const t = document.createElement('canvas');
    t.width = Math.max(8, w >> 3); t.height = Math.max(8, h >> 3);
    const c = t.getContext('2d');
    c.drawImage(ph, 0, 0, t.width, t.height);
    c.globalCompositeOperation = 'multiply'; c.fillStyle = '#ff7a45'; c.fillRect(0, 0, t.width, t.height);

  }

    const cx = rr() < 0.5 ? 0 : w, g = x.createRadialGradient(cx, h * (0.2 + rr() * 0.5), 0, cx, h * 0.4, m * 0.9);
    g.addColorStop(0, `rgba(255,110,30,${p.leak / 100 * 0.8})`); g.addColorStop(0.5, `rgba(255,40,60,${p.leak / 100 * 0.25})`); g.addColorStop(1, 'rgba(0,0,0,0)');

  }

    x.fillStyle = 'rgba(255,255,255,.65)';
    for (let i = 0; i < p.dust * 0.8; i++) { x.beginPath(); x.arc(rr() * w, rr() * h, m * 0.0012 * (0.5 + rr() * 1.5), 0, 7); x.fill(); }
    x.strokeStyle = 'rgba(255,255,255,.22)'; x.lineWidth = Math.max(1, m * 0.0006);
    for (let i = 0; i < p.dust * 0.12; i++) { const a = rr() * w, b = rr() * h; x.beginPath(); x.moveTo(a, b); x.lineTo(a + (rr() - 0.5) * m * 0.03, b + rr() * m * 0.12); x.stroke(); }
  }

  const dt = new Date(), ds = `'${String(dt.getFullYear()).slice(2)} ${String(dt.getMonth() + 1).padStart(2, '0')} ${String(dt.getDate()).padStart(2, '0')}`;
  if (p.date) {
    x.font = `bold ${m * 0.035}px ui-monospace, Menlo, monospace`;
    x.textAlign = 'right'; x.fillStyle = '#ff8a1e'; x.shadowColor = '#ff5a00'; x.shadowBlur = m * 0.01;
    x.fillText(ds, w - m * 0.04, h - m * 0.04); x.shadowBlur = 0;
  }

  const F = { Plain: [0, 0, '#000'], White: [0.06, 0.06, '#f6f4ef'], Paper: [0.06, 0.15, '#ece4d2'], Black: [0.06, 0.06, '#0b0b0b'], Negative: [0.07, 0.07, '#141210'], Specs: [0.04, 0.16, '#f7f7f5'], Polaroid: [0.05, 0.24, '#fcfbf8'], Filmstrip: [0.1, 0.1, '#0f0f11'] }[p.frame];
  const pd = F[0] * m, bt = F[1] * m;
  if (!pd && !bt) return ph;

  const o = document.createElement('canvas');
  o.width = w + 2 * pd; o.height = h + pd + bt;
  const c = o.getContext('2d');
  c.fillStyle = F[2]; c.fillRect(0, 0, o.width, o.height); c.drawImage(ph, pd, pd);

  c.textAlign = 'left';
  const ttl = (p.title || '').toUpperCase();
  const spc = (p.specs || `${(w * h / 1e6).toFixed(0)}MP · ${w}×${h} · ${p.look}`).toUpperCase();
  const mono = 'ui-monospace, Menlo, monospace', bot = h + pd;

  if (p.frame === 'Paper') {
    const ty = bot + bt * 0.45;
    c.fillStyle = '#1c1c1f'; c.font = `700 ${m * 0.03}px -apple-system, Georgia, serif`; c.fillText(ttl, pd, ty);
    c.fillStyle = '#6b7280'; c.font = `${m * 0.017}px ${mono}`; c.fillText(`${spc}`, pd, ty + m * 0.045);
  }
  if (p.frame === 'Polaroid') {
    const ty = bot + bt * 0.42;
    c.fillStyle = '#2a2a2e'; c.font = `italic 600 ${m * 0.036}px -apple-system, sans-serif`; c.fillText(p.title || 'Framed', pd + m * 0.01, ty);
    c.fillStyle = '#8f949e'; c.font = `${m * 0.016}px ${mono}`; c.fillText(`${spc}`, pd + m * 0.012, ty + m * 0.07);
  }
  if (p.frame === 'Specs') {
    c.fillStyle = '#111'; c.font = `bold ${m * 0.028}px ${mono}`; c.fillText(ttl, pd, h + pd + m * 0.055);
    c.font = `${m * 0.021}px ${mono}`; c.fillStyle = '#666'; c.fillText(`${spc} · ${dt.toDateString()}`, pd, h + pd + m * 0.1);
  }
  if (p.frame === 'Filmstrip') {
    const hw = m * 0.035, hh = m * 0.05, st = m * 0.07, hy = (pd - hh) / 2;
    c.fillStyle = '#2a2a30';
    for (let X = m * 0.02; X < o.width - m * 0.04; X += st) {
      c.fillRect(X, hy * 0.6, hw, hh);
      c.fillRect(X, o.height - hy * 0.6 - hh, hw, hh);
    }
    c.fillStyle = '#e2a842'; c.font = `600 ${m * 0.016}px ${mono}`; c.fillText(`KODAK 5074 // ${p.look.toUpperCase()} // DX-35`, pd, pd - m * 0.012);
    c.fillStyle = '#f3f4f6'; c.font = `700 ${m * 0.02}px ${mono}`; c.fillText(ttl, pd, bot + m * 0.03);
    c.fillStyle = '#e2a842'; c.font = `${m * 0.014}px ${mono}`; c.textAlign = 'right'; c.fillText(spc, o.width - pd, bot + m * 0.03);
  }
  if (p.frame === 'Negative') {
    c.fillStyle = '#2a2622';
    for (let i = 0; i < o.width / (m * 0.06); i++) {
      c.fillRect(i * m * 0.06 + m * 0.02, m * 0.02, m * 0.03, m * 0.03);
      c.fillRect(i * m * 0.06 + m * 0.02, o.height - m * 0.05, m * 0.03, m * 0.03);
    }
    c.fillStyle = '#ff9a2e'; c.font = `${m * 0.022}px ${mono}`; c.fillText(`FRAMED 400 ▸ ${String(Math.floor(rr() * 36) + 1).padStart(2, '0')}`, pd, o.height - m * 0.058);
  }
  return o;
}

$('#back').onclick = () => {
  $('#ed').hidden = true;
  $('#cam').hidden = false;
  src = small = null;
  resetScanDirector();
  applyCameraZoom(0.5);
};
$('#save').onclick = async () => {
  $('#busy-label').textContent = 'Exporting Full Resolution…';
  $('#busy').hidden = false; await tick();
  const o = render(src, p);
  o.toBlob(async b => {
    const f = new File([b], `framed-${Date.now()}.jpg`, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f] }); } catch(e) {}
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = f.name; a.click();
    }
    $('#info').textContent = `Exported ${o.width}×${o.height}`;
    $('#busy').hidden = true;
  }, 'image/jpeg', 0.96);
};

// Start camera immediately
start();
</script>
