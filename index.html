<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Framed">
  <title>Framed — Horizon-Locked Camera Studio</title>
  <style>
    :root {
      --bg: #09090b;
      --fg: #f4f4f5;
      --mut: #8c8a85;
      --acc: #ffb347;
      --green: #34c759;
      --pan: #18181b;
      --pan-border: #27272a;
      --stage: #000;
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    section {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--bg);
    }
    [hidden] { display: none !important; }
    
    button, label.btn {
      font: inherit;
      color: inherit;
      background: var(--pan);
      border: 1px solid var(--pan-border);
      border-radius: 999px;
      padding: 7px 13px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1), background 0.15s;
    }
    button:active, label.btn:active { transform: scale(0.94); }
    button.on, label.btn.on { background: var(--acc); color: #000; border-color: var(--acc); font-weight: 600; }
    button.locked, label.btn.locked { background: var(--green); color: #000; font-weight: 700; }

    .row {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      flex-wrap: wrap;
      z-index: 25;
    }

    #wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      position: relative;
    }
    #stage {
      position: relative;
      flex: none;
      background: var(--stage);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
      transition: width 0.3s ease, height 0.3s ease;
    }

    /* Live Video & Canvas Container with Gravity Counter-Rotation */
    #rotator {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
      transform-origin: center center;
    }
    video#v {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
      transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    canvas#ov {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: center center;
      transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    
    /* Top AI Guidance HUD */
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      z-index: 30;
    }
    #hint-pill {
      background: rgba(18, 18, 22, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transition: all 0.25s ease;
    }
    #hint-pill.aiming {
      border-color: var(--acc);
      color: var(--acc);
      box-shadow: 0 0 20px rgba(255, 179, 71, 0.35);
    }
    #hint-pill.locked {
      border-color: var(--green);
      color: var(--green);
      box-shadow: 0 0 24px rgba(52, 199, 89, 0.4);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulseDot 1.4s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    #tools {
      display: flex;
      gap: 14px;
      padding: 4px 18px;
      z-index: 25;
    }
    #tools label {
      flex: 1;
      font-size: 11px;
      color: var(--mut);
    }
    input[type=range] {
      accent-color: var(--acc);
      width: 100%;
      height: 4px;
    }

    #info-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 20px;
      z-index: 25;
    }
    small {
      color: var(--mut);
      font-size: 11px;
      font-family: ui-monospace, Menlo, monospace;
    }

    #bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 8px 10px 16px;
      z-index: 25;
    }
    #shut {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid var(--bg);
      outline: 3px solid var(--fg);
      padding: 0;
      cursor: pointer;
      transition: all 0.2s;
    }
    #shut.lit {
      outline-color: var(--green);
      box-shadow: 0 0 24px var(--green);
      background: #f0fdf4;
      transform: scale(1.04);
    }
    #shut:active {
      transform: scale(0.92);
      background: var(--acc);
    }

    /* Rotating Icons in Landscape Mode */
    .rot-icon {
      display: inline-block;
      transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
      transform-origin: center center;
    }

    /* Editor View */
    #pvw {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: #000;
    }
    #pv {
      max-width: 100%;
      max-height: 100%;
      border-radius: 6px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
    }
    #panel {
      height: 195px;
      overflow-y: auto;
      padding: 4px 16px;
      background: var(--bg);
    }
    .sl {
      display: grid;
      grid-template-columns: 88px 1fr 34px;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--mut);
      margin: 6px 0;
    }
    .sl span:last-child {
      text-align: right;
      font-family: monospace;
      color: var(--fg);
    }
    #busy {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      z-index: 99;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: var(--acc);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- CAMERA SECTION -->
<section id="cam">
  <div class="row" id="top"></div>

  <div id="wrap">
    <div id="stage">
      <div id="rotator">
        <video id="v" playsinline webkit-playsinline muted autoplay></video>
        <canvas id="ov"></canvas>
      </div>

      <div id="hud">
        <div id="hint-pill" class="aiming">
          <div class="status-dot"></div>
          <span id="hint-text">Wide Scan (0.5x) · Finding Subject…</span>
        </div>
      </div>
    </div>
  </div>

  <div id="tools">
    <label>Sensor Zoom
      <input type="range" id="zm" min="1" max="5" step="0.1" value="1">
    </label>
    <label>Exposure EV
      <input type="range" id="ex" min="-2" max="2" step="0.1" value="0">
    </label>
  </div>

  <div id="info-row">
    <small id="res">Starting camera...</small>
    <small id="gravity-status">Viewfinder: Gravity Locked</small>
  </div>

  <div id="bar">
    <label class="btn" for="f1" title="Import with EXIF"><span class="rot-icon">Photos</span></label>
    <button id="director-btn" class="on" title="3-Step Smart Director: Pointer -> Center -> Auto-Zoom"><span class="rot-icon">✦ Director</span></button>
    <button id="shut" aria-label="Shutter"></button>
    <button id="grid-btn" title="Cycle Overlays"><span class="rot-icon">Grid: 3rds</span></button>
    <label class="btn" for="f2" title="Full native resolution capture" style="color:var(--acc); font-weight:700;"><span class="rot-icon">24MP</span></label>
  </div>
</section>

<!-- EDITOR SECTION -->
<section id="ed" hidden>
  <div id="pvw"><canvas id="pv"></canvas></div>
  <div class="row" id="tabs"></div>
  <div id="panel"></div>
  <div class="row">
    <button id="back">Retake</button>
    <small id="info" style="flex:1; text-align:center;"></small>
    <button id="save" class="on">Save</button>
  </div>
</section>

<div id="busy" hidden>
  <div class="spinner"></div>
  <span id="busy-label">Developing photo…</span>
</div>

<!-- Offscreen file pickers -->
<input type="file" id="f1" accept="image/*" style="position:fixed; top:-9999px;">
<input type="file" id="f2" accept="image/*" capture="environment" style="position:fixed; top:-9999px;">
<input type="file" id="f-lut" accept=".cube" style="position:fixed; top:-9999px;">

<script>
// 1. Purge legacy service worker caches
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    for (let r of regs) r.unregister();
  });
}

const $ = s => document.querySelector(s);
const RAT = { '3:4': 3/4, '4:5': 4/5, '1:1': 1, '3:2': 3/2, '9:16': 9/16, '65:24': 65/24 };
let ratio = '4:5', facing = 'environment', stream = null, track = null, imageCapture = null;
let frame = null, src = null, small = null, p = null;
let camExp = 0, stable = 0, lastMP = 0;
const v = $('#v'), ov = $('#ov'), stage = $('#stage'), rotator = $('#rotator');
const tick = () => new Promise(r => setTimeout(r, 20));

/* =========================================================================
   LIVE VIEWFINDER GRAVITY COUNTER-ROTATION
   - Viewfinder stays upright relative to real world / eyes
   - Camera video stream counter-rotates live in real-time
   - Button icons rotate on their own centers (90° / -90° / 0°)
   - Final photo buffer is captured in true upright orientation
   ========================================================================= */
let gravityLocked = true;
let currentTiltQuadrant = 0; // 0, 90 (landscape left), -90 (landscape right), 180
let smoothTiltAngle = 0;

window.addEventListener('deviceorientation', e => {
  const gamma = e.gamma || 0;
  const beta = e.beta || 0;

  // Determine physical tilt quadrant
  let targetAngle = 0;
  if (Math.abs(gamma) > Math.abs(beta)) {
    targetAngle = gamma > 25 ? 90 : (gamma < -25 ? -90 : 0);
  } else {
    targetAngle = beta < -25 ? 180 : 0;
  }

  if (targetAngle !== currentTiltQuadrant) {
    currentTiltQuadrant = targetAngle;
    applyLiveViewfinderCounterRotation(currentTiltQuadrant);
  }
});

function applyLiveViewfinderCounterRotation(angleDeg) {
  if (!gravityLocked) return;

  // 1. Rotate the UI button icons on their centers (Native Camera App style)
  document.querySelectorAll('.rot-icon').forEach(el => {
    el.style.transform = `rotate(${-angleDeg}deg)`;
  });

  // 2. Counter-rotate the live stream & overlay canvas inside the stage
  // When turned 90° landscape, scale up by (width/height ratio) to prevent letterboxing
  const isLandscape = (Math.abs(angleDeg) === 90);
  const currentRatio = RAT[ratio]; // e.g. 0.8 for 4:5
  const scaleComp = isLandscape ? (1 / currentRatio) : 1.0;

  rotator.style.transform = `rotate(${-angleDeg}deg) scale(${scaleComp})`;

  // Update status badge
  $('#gravity-status').textContent = angleDeg === 0 
    ? 'Viewfinder: Upright (Portrait)' 
    : `Viewfinder: Gravity-Locked (${angleDeg > 0 ? 'Right' : 'Left'})`;
}

/* =========================================================================
   3-STEP AI DIRECTOR ENGINE:
   1. Wide Scan (0.5x) -> Pinpoint Subject Pointer
   2. Guide user to aim/center camera on the pointer
   3. Auto-Zoom into subject and lock aesthetic framing
   ========================================================================= */
let directorActive = true;
let detectedSubject = null;
let directorPhase = 0; // 0: Scanning, 1: Pointer displayed, 2: Centered, 3: Auto-Zoom Locked
let currentZoom = 1.0;
let maxZoom = 5.0;
let minZoom = 1.0;
let hasVibrated = false;

const dc = document.createElement('canvas');

function scanWideSceneForSubject() {
  if (!v.videoWidth || v.paused) return null;
  const q = vis();
  const N = 48, M = Math.round(N / RAT[ratio]);
  dc.width = N; dc.height = M;
  const x = dc.getContext('2d', { willReadFrequently: true });
  x.drawImage(v, q.x, q.y, q.w, q.h, 0, 0, N, M);
  const d = x.getImageData(0, 0, N, M).data;

  let bestX = 0, bestY = 0, maxWeight = 0;
  let skinTotal = 0;

  for (let y = 1; y < M - 1; y++) {
    for (let xx = 1; xx < N - 1; xx++) {
      const idx = (y * N + xx) * 4;
      const r = d[idx], g = d[idx + 1], b = d[idx + 2];
      const lum = 0.299 * r + 0.587 * g + 0.114 * b;

      const lumRight = 0.299 * d[idx + 4] + 0.587 * d[idx + 5] + 0.114 * d[idx + 6];
      const lumDown = 0.299 * d[idx + N * 4] + 0.587 * d[idx + N * 4 + 1] + 0.114 * d[idx + N * 4 + 2];
      const edge = Math.abs(lum - lumRight) + Math.abs(lum - lumDown);

      const isSkin = (r > 65 && g > 35 && b > 25 && r > g && r > b && (r - g) > 12);
      if (isSkin) skinTotal++;

      const weight = edge + (isSkin ? 95 : 0);
      if (weight > maxWeight) {
        maxWeight = weight;
        bestX = xx;
        bestY = y;
      }
    }
  }

  if (maxWeight < 25) return null;

  return {
    x: Math.max(0.1, Math.min(0.9, bestX / N)),
    y: Math.max(0.1, Math.min(0.9, bestY / M)),
    label: skinTotal > 20 ? 'Person' : 'Main Subject'
  };
}

async function tickDirector() {
  if (!directorActive) return;

  const subj = scanWideSceneForSubject();
  const pill = $('#hint-pill');
  const txt = $('#hint-text');

  if (subj) {
    detectedSubject = subj;

    const dx = subj.x - 0.5;
    const dy = subj.y - 0.5;
    const distToCenter = Math.hypot(dx, dy);

    if (distToCenter > 0.11) {
      directorPhase = 1;
      pill.className = 'aiming';
      hasVibrated = false;

      let moveText = [];
      if (Math.abs(dx) > 0.08) moveText.push(dx > 0 ? 'Move camera Right ▸' : '◂ Move camera Left');
      if (Math.abs(dy) > 0.08) moveText.push(dy > 0 ? 'Tilt Down ▾' : '▴ Tilt Up');

      txt.textContent = `🎯 ${subj.label} spotted! ${moveText.join(' · ')}`;
      $('#shut').classList.remove('lit');

    } else {
      directorPhase = 2;
      pill.className = 'locked';

      const targetZoom = (subj.label === 'Person' ? 2.2 : 1.8);
      if (currentZoom < targetZoom) {
        currentZoom += (targetZoom - currentZoom) * 0.25;
        applyCameraZoom(currentZoom);
        txt.textContent = `✨ Centered! Auto-Zooming to ${currentZoom.toFixed(1)}x…`;
      } else {
        directorPhase = 3;
        txt.textContent = `✓ ${subj.label} Isolated & Upright — Shoot!`;
        $('#shut').classList.add('lit');

        if (!hasVibrated && navigator.vibrate) {
          try { navigator.vibrate([40, 60, 40]); } catch(e){}
          hasVibrated = true;
        }
      }
    }
  } else {
    directorPhase = 0;
    pill.className = 'aiming';
    txt.textContent = 'Wide View (0.5x) · Scanning Scene…';
    $('#shut').classList.remove('lit');
  }

  draw();
  setTimeout(tickDirector, 280);
}

function applyCameraZoom(val) {
  currentZoom = Math.max(minZoom, Math.min(maxZoom, val));
  $('#zm').value = currentZoom;
  if (track && track.getCapabilities && track.getCapabilities().zoom) {
    track.applyConstraints({ advanced: [{ zoom: currentZoom }] }).catch(() => {});
  } else {
    v.style.transform = `scale(${currentZoom})`;
  }
}

$('#director-btn').onclick = (e) => {
  e.stopPropagation();
  directorActive = !directorActive;
  $('#director-btn').classList.toggle('on', directorActive);
  if (directorActive) {
    applyCameraZoom(minZoom);
    tickDirector();
  } else {
    detectedSubject = null;
    $('#hint-text').textContent = 'Manual Mode Active';
    $('#hint-pill').className = '';
    $('#shut').classList.remove('lit');
    draw();
  }
};

/* Viewfinder Drawing & Pointer Reticle */
function draw() {
  const x = ov.getContext('2d'), W = ov.width, H = ov.height;
  x.clearRect(0, 0, W, H);

  // Render Grid Overlay
  drawGridOverlay(x, W, H);

  // Center crosshair
  x.save();
  x.strokeStyle = 'rgba(255, 255, 255, 0.25)';
  x.lineWidth = 1;
  x.beginPath();
  x.moveTo(W / 2 - 12, H / 2); x.lineTo(W / 2 + 12, H / 2);
  x.moveTo(W / 2, H / 2 - 12); x.lineTo(W / 2 + 12, H / 2);
  x.stroke();

  // Draw Pointer Reticle
  if (directorActive && detectedSubject) {
    const s = detectedSubject;
    const px = s.x * W;
    const py = s.y * H;
    const isLocked = (directorPhase >= 2);
    const color = isLocked ? '#34c759' : '#ffb347';

    // Target circle
    x.strokeStyle = color;
    x.lineWidth = isLocked ? 3 : 2;
    x.beginPath();
    x.arc(px, py, isLocked ? 28 : 20, 0, Math.PI * 2);
    x.stroke();

    x.fillStyle = color;
    x.beginPath();
    x.arc(px, py, 4, 0, Math.PI * 2);
    x.fill();

    // Directional dashed line
    if (!isLocked) {
      x.setLineDash([6, 6]);
      x.lineWidth = 2;
      x.beginPath();
      x.moveTo(W / 2, H / 2);
      x.lineTo(px, py);
      x.stroke();
      x.setLineDash([]);

      x.font = '600 12px -apple-system, sans-serif';
      const label = `● ${s.label}`;
      const tw = x.measureText(label).width + 14;
      x.fillStyle = 'rgba(12, 12, 15, 0.85)';
      x.fillRect(px + 12, py - 18, tw, 22);
      x.fillStyle = color;
      x.fillText(label, px + 18, py - 3);
    }
  }
  x.restore();
}

/* =========================================================================
   MULTIPLE GRID OVERLAYS
   ========================================================================= */
const GRID_MODES = ['3rds', 'phi', 'spiral', 'baroque', 'off'];
let gridMode = '3rds';

$('#grid-btn').onclick = (e) => {
  e.stopPropagation();
  const nextIdx = (GRID_MODES.indexOf(gridMode) + 1) % GRID_MODES.length;
  gridMode = GRID_MODES[nextIdx];
  $('#grid-btn').querySelector('.rot-icon').textContent = `Grid: ${gridMode}`;
  $('#grid-btn').classList.toggle('on', gridMode !== 'off');
  draw();
};

function drawGridOverlay(x, W, H) {
  if (gridMode === 'off') return;
  x.save();
  x.strokeStyle = 'rgba(255, 255, 255, 0.3)';
  x.lineWidth = 1;

  if (gridMode === '3rds') {
    x.beginPath();
    for (let i = 1; i < 3; i++) {
      x.moveTo(W * i / 3, 0); x.lineTo(W * i / 3, H);
      x.moveTo(0, H * i / 3); x.lineTo(W, H * i / 3);
    }
    x.stroke();
  } else if (gridMode === 'phi') {
    const p1 = 0.382, p2 = 0.618;
    x.beginPath();
    x.moveTo(W * p1, 0); x.lineTo(W * p1, H);
    x.moveTo(W * p2, 0); x.lineTo(W * p2, H);
    x.moveTo(0, H * p1); x.lineTo(W, H * p1);
    x.moveTo(0, H * p2); x.lineTo(W, H * p2);
    x.stroke();
  } else if (gridMode === 'spiral') {
    x.beginPath();
    let sx = 0, sy = 0, sw = W, sh = H;
    const phi = 0.6180339887;
    for (let i = 0; i < 5; i++) {
      const cut = (i % 2 === 0) ? sw * phi : sh * phi;
      if (i % 2 === 0) {
        x.strokeRect(sx, sy, cut, sh);
        sx += cut; sw -= cut;
      } else {
        x.strokeRect(sx, sy, sw, cut);
        sy += cut; sh -= cut;
      }
    }
  } else if (gridMode === 'baroque') {
    x.beginPath();
    x.moveTo(0, H); x.lineTo(W, 0);
    x.moveTo(0, 0); x.lineTo(W, H);
    x.stroke();
  }
  x.restore();
}

function vis() {
  const vw = v.videoWidth || 640, vh = v.videoHeight || 480, a = RAT[ratio];
  let cw, ch;
  if (vw / vh > a) { ch = vh; cw = vh * a; } else { cw = vw; ch = vw / a; }
  return { x: (vw - cw) / 2, y: (vh - ch) / 2, w: cw, h: ch };
}

// Top Bar Aspects, Flip, Torch
const topBar = $('#top');
Object.keys(RAT).forEach(k => {
  const b = document.createElement('button');
  b.innerHTML = `<span class="rot-icon">${k}</span>`;
  b.className = k === ratio ? 'on' : '';
  b.onclick = (e) => {
    e.stopPropagation();
    ratio = k;
    fit();
    [...topBar.children].forEach(c => {
      const txt = c.textContent.trim();
      if (RAT[txt] !== undefined) c.classList.toggle('on', txt === k);
    });
    applyLiveViewfinderCounterRotation(currentTiltQuadrant);
    draw();
  };
  topBar.appendChild(b);
});

const fl = document.createElement('button');
fl.innerHTML = '<span class="rot-icon">Flip</span>';

// Camera Starter (Defaults to ultra-wide 0.5x)
async function start() {
  $('#res').textContent = 'Connecting wide sensor…';
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: facing,
        width: { ideal: 3840 },
        height: { ideal: 2160 }
      },
      audio: false
    });
    v.srcObject = stream;
    track = stream.getVideoTracks()[0];
    if (window.ImageCapture && track) {
      imageCapture = new ImageCapture(track);
    }
    const c = track.getCapabilities ? track.getCapabilities() : {};
    const s = track.getSettings ? track.getSettings() : {};
    lastMP = ((s.width * s.height) / 1e6) || 0;
    $('#res').textContent = `Sensor: ${s.width}×${s.height} (${lastMP.toFixed(1)}MP)`;
    
    if (c.zoom) {
      minZoom = c.zoom.min || 1.0;
      maxZoom = Math.min(c.zoom.max, 8.0);
      $('#zm').min = minZoom;
      $('#zm').max = maxZoom;
      applyCameraZoom(minZoom);
    }
    tb.style.display = c.torch ? '' : 'none';
    fit();
    applyLiveViewfinderCounterRotation(currentTiltQuadrant);
    tickDirector();
  } catch (err) {
    $('#res').textContent = 'Camera awaiting permission';
  }
}

$('#zm').oninput = e => {
  directorActive = false;
  $('#director-btn').classList.remove('on');
  applyCameraZoom(+e.target.value);
};

$('#ex').oninput = e => {
  camExp = +e.target.value;
  const c = track && track.getCapabilities ? track.getCapabilities() : {};
  if (c.exposureCompensation) {
    track.applyConstraints({ advanced: [{ exposureCompensation: camExp }] }).catch(() => {});
    camExp = 0;
  } else {
    v.style.filter = `brightness(${Math.pow(2, camExp / 2)})`;
  }
};

let torch = false;
tb.onclick = (e) => {
  e.stopPropagation();
  torch = !torch;
  tb.classList.toggle('on', torch);
  if (track) track.applyConstraints({ advanced: [{ torch }] }).catch(() => {});
};

function size() {
  const d = devicePixelRatio || 1;
  ov.width = stage.clientWidth * d;
  ov.height = stage.clientHeight * d;
}

function fit() {
  const w = $('#wrap'), a = RAT[ratio];
  const W = w.clientWidth - 16, H = w.clientHeight;
  if (W <= 0 || H <= 0) return;
  let sw = W, sh = W / a;
  if (sh > H) { sh = H; sw = H * a; }
  stage.style.width = sw + 'px';
  stage.style.height = sh + 'px';
  size();
  draw();
}
new ResizeObserver(fit).observe($('#wrap'));
fit();

/* =========================================================================
   TRUE GRAVITY-LOCKED UPRIGHT CAPTURE
   ========================================================================= */
$('#shut').onclick = async (e) => {
  e.stopPropagation();
  $('#busy-label').textContent = 'Developing High-Res Shot…';
  $('#busy').hidden = false;
  await tick();

  let captured = null;
  if (imageCapture) {
    try {
      const blob = await imageCapture.takePhoto();
      const bm = await createImageBitmap(blob);
      captured = document.createElement('canvas');
      captured.width = bm.width; captured.height = bm.height;
      captured.getContext('2d').drawImage(bm, 0, 0);
    } catch(err){}
  }
  if (!captured) {
    const s = track ? track.getSettings() : {};
    const w = (s && s.width) || v.videoWidth || 1920;
    const h = (s && s.height) || v.videoHeight || 1080;
    captured = document.createElement('canvas');
    captured.width = w; captured.height = h;
    captured.getContext('2d').drawImage(v, 0, 0, w, h);
  }

  // True Gravity Counter-Rotation: Always upright!
  let rotatedCanvas = captured;
  if (currentTiltQuadrant !== 0) {
    rotatedCanvas = document.createElement('canvas');
    const isQuarter = (Math.abs(currentTiltQuadrant) === 90);
    rotatedCanvas.width = isQuarter ? captured.height : captured.width;
    rotatedCanvas.height = isQuarter ? captured.width : captured.height;

    const rx = rotatedCanvas.getContext('2d');
    rx.translate(rotatedCanvas.width / 2, rotatedCanvas.height / 2);
    rx.rotate((-currentTiltQuadrant * Math.PI) / 180);
    rx.drawImage(captured, -captured.width / 2, -captured.height / 2);
  }

  // Crop to chosen aspect ratio (Portrait 4:5, 3:4, etc.)
  const targetAspect = RAT[ratio];
  let cw = rotatedCanvas.width, ch = rotatedCanvas.height;
  if (cw / ch > targetAspect) cw = ch * targetAspect; else ch = cw / targetAspect;
  const cropX = (rotatedCanvas.width - cw) / 2;
  const cropY = (rotatedCanvas.height - ch) / 2;

  const finalC = document.createElement('canvas');
  finalC.width = Math.round(cw);
  finalC.height = Math.round(ch);
  finalC.getContext('2d').drawImage(rotatedCanvas, cropX, cropY, cw, ch, 0, 0, finalC.width, finalC.height);

  $('#busy').hidden = true;
  edit(finalC, camExp, {
    title: 'FRAMED STUDIO',
    specs: `${(finalC.width * finalC.height / 1e6).toFixed(1)}MP · ${finalC.width}×${finalC.height}`
  });
};

/* File picker for Photos & 24MP full sensor */
async function loadFile(f) {
  if (!f) return;
  $('#busy-label').textContent = 'Opening High-Res Image…';
  $('#busy').hidden = false;
  await tick();
  let bm;
  try {
    bm = await createImageBitmap(f, { imageOrientation: 'from-image' });
  } catch(e) {
    bm = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = rej;
      i.src = URL.createObjectURL(f);
    });
  }
  const c = document.createElement('canvas');
  c.width = bm.width; c.height = bm.height;
  c.getContext('2d').drawImage(bm, 0, 0);
  $('#busy').hidden = true;
  edit(c, 0);
}
$('#f1').onchange = $('#f2').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };

let hk = 0, cch = 'm';
const HC = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#14b8a6', '#3b82f6', '#8b5cf6', '#d946ef'];
const CCOL = { m: '#e8e6e0', r: '#ef4444', g: '#22c55e', b: '#3b82f6' };
const idPts = () => Array.from({ length: 9 }, (_, i) => [i / 8, i / 8]);

function hslPanel(P) {
  p.hsl = p.hsl || HC.map(() => [0, 0, 0]);
  const r = document.createElement('div');
  r.className = 'row';
  HC.forEach((c, i) => {
    const b = document.createElement('button');

    P.appendChild(d);

}

function curvePanel(P) {
  p.curves = p.curves || { m: idPts(), r: idPts(), g: idPts(), b: idPts() };
  const S = 150, dpr = devicePixelRatio || 1;
  const w = document.createElement('div');
  w.style.cssText = 'display:flex;gap:14px;align-items:center;justify-content:center;';
  const cv = document.createElement('canvas');
  cv.width = cv.height = S * dpr;
  cv.style.cssText = `width:${S}px;height:${S}px;border-radius:10px;background:var(--pan);touch-action:none;`;

  const dr = () => {
    const x = cv.getContext('2d');
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.clearRect(0, 0, S, S);
    x.strokeStyle = 'rgba(128,128,128,.3)';
    x.lineWidth = 1;
    x.beginPath();
    for (let i = 1; i < 4; i++) {
      x.moveTo(S * i / 4, 0); x.lineTo(S * i / 4, S);
      x.moveTo(0, S * i / 4); x.lineTo(S, S * i / 4);
    }
    x.stroke();
    const pts = p.curves[cch], L = curveLUT(pts);
    x.strokeStyle = CCOL[cch];
    x.lineWidth = 2.5;
    x.beginPath();
    for (let v = 0; v < 256; v++) {
      const X = v / 255 * S, Y = S - L[v] / 255 * S;
      v ? x.lineTo(X, Y) : x.moveTo(X, Y);
    }
    x.stroke();
    x.fillStyle = CCOL[cch];
    pts.forEach(q => { x.beginPath(); x.arc(q[0] * S, S - q[1] * S, 4.5, 0, 7); x.fill(); });
  };

  let di = -1;
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height]; };
  cv.onpointerdown = e => { const q = pos(e); di = Math.round(Math.min(1, Math.max(0, q[0])) * 8); cv.setPointerCapture(e.pointerId); p.curves[cch][di][1] = Math.min(1, Math.max(0, q[1])); dr(); paint(); };
  cv.onpointermove = e => { if (di < 0) return; p.curves[cch][di][1] = Math.min(1, Math.max(0, pos(e)[1])); dr(); paint(); };
  cv.onpointerup = () => { di = -1; };

  const col = document.createElement('div');
  col.style.cssText = 'display:flex;flex-direction:column;gap:6px;';
  [['m', 'RGB'], ['r', 'R'], ['g', 'G'], ['b', 'B']].forEach(([k, n]) => {
    const b = document.createElement('button');
    b.textContent = n;
    b.className = k === cch ? 'on' : '';
    b.onclick = () => { cch = k; panel(); };
    col.appendChild(b);
  });
  const rs = document.createElement('button');
  rs.textContent = 'Reset';
  rs.onclick = () => { p.curves = null; panel(); paint(); };
  col.appendChild(rs);
  w.appendChild(cv); w.appendChild(col); P.appendChild(w); dr();
}

function stampInputs(P) {

let tab = 'Looks', raf = 0;
function edit(c, expo, exifData = null) {
  src = c;
  const k = Math.min(1, 1400 / Math.max(c.width, c.height));
  small = document.createElement('canvas');
  small.width = Math.round(c.width * k);
  small.height = Math.round(c.height * k);
  small.getContext('2d').drawImage(c, 0, 0, small.width, small.height);

  p = { ...DEF, ...LOOKS.PORTRA, seed: 1 + Math.floor(Math.random() * 999) };
  p.exposure += expo * 30;

  if (exifData) {
    if (exifData.title) p.title = exifData.title;
    if (exifData.specs) p.specs = exifData.specs;
  }

  $('#info').textContent = `${(c.width * c.height / 1e6).toFixed(1)} MP Source`;
  $('#cam').hidden = true;
  $('#ed').hidden = false;
  tabs(); panel(); paint();
}

function tabs() {
  const t = $('#tabs');
  t.innerHTML = '';
  Object.keys(TABS).forEach(k => {
    const b = document.createElement('button');
    b.textContent = k;
    b.className = k === tab ? 'on' : '';
    b.onclick = () => { tab = k; tabs(); panel(); };
    t.appendChild(b);
  });
}

function panel() {
  const P = $('#panel');
  P.innerHTML = '';
  if (tab === 'Curve') return curvePanel(P);
  if (tab === 'HSL') return hslPanel(P);
  if (tab === 'Looks') {
    const r = document.createElement('div');
    r.className = 'row';
    Object.keys(LOOKS).forEach(k => {
      const b = document.createElement('button');
      b.textContent = k;
      b.className = p.look === k ? 'on' : '';
      b.onclick = () => {
        p = { ...DEF, ...LOOKS[k], look: k, frame: p.frame, date: p.date, title: p.title, specs: p.specs, curves: p.curves, hsl: p.hsl, seed: p.seed };
        panel(); paint();
      };
      r.appendChild(b);
    });
    P.appendChild(r);
  } else if (tab === 'Frame') {
    const r = document.createElement('div');
    r.className = 'row';
    FRAMES.forEach(k => {
      const b = document.createElement('button');
      b.textContent = k;
      b.className = p.frame === k ? 'on' : '';
      b.onclick = () => { p.frame = k; panel(); paint(); };
      r.appendChild(b);
    });
    const d = document.createElement('button');
    d.textContent = 'Date Stamp';
    d.className = p.date ? 'on' : '';
    d.onclick = () => { p.date = !p.date; panel(); paint(); };
    r.appendChild(d);
    P.appendChild(r);
    stampInputs(P);
  } else {
    TABS[tab].forEach(([k, n]) => {
      const d = document.createElement('div');
      d.className = 'sl';
      const neg = ['exposure', 'contrast', 'highlights', 'shadows', 'temp', 'tint', 'sat'].includes(k);
      d.innerHTML = `<span>${n}</span><input type="range" min="${neg ? -100 : 0}" max="100" value="${p[k]}"><span>${Math.round(p[k])}</span>`;
      d.querySelector('input').oninput = e => { p[k] = +e.target.value; d.lastChild.textContent = e.target.value; paint(); };
      P.appendChild(d);
    });
  }
}

function paint() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    const o = render(small, p);
    const pv = $('#pv');
    pv.width = o.width; pv.height = o.height;
    pv.getContext('2d').drawImage(o, 0, 0);
  });
}

          d[i] = CR[d[i]];
          d[i + 1] = CG[d[i + 1]];
          d[i + 2] = CB[d[i + 2]];
        }
      }
    }
    x.putImageData(im, 0, y0);
  }

  let s = p.seed * 9301;
  const rr = () => (s = (s * 16807) % 2147483647) / 2147483647;

  if (p.glow > 0) {
    const t = document.createElement('canvas');
    t.width = Math.max(8, w >> 3); t.height = Math.max(8, h >> 3);
    const c = t.getContext('2d');
    c.drawImage(ph, 0, 0, t.width, t.height);
    c.globalCompositeOperation = 'multiply'; c.fillStyle = '#ff7a45'; c.fillRect(0, 0, t.width, t.height);
    x.globalCompositeOperation = 'screen'; x.globalAlpha = p.glow / 100 * 0.45; x.drawImage(t, 0, 0, w, h); x.globalAlpha = 1;
  }
  x.globalCompositeOperation = 'screen';
  if (p.leak > 0) {
    const cx = rr() < 0.5 ? 0 : w, g = x.createRadialGradient(cx, h * (0.2 + rr() * 0.5), 0, cx, h * 0.4, m * 0.9);
    g.addColorStop(0, `rgba(255,110,30,${p.leak / 100 * 0.8})`); g.addColorStop(0.5, `rgba(255,40,60,${p.leak / 100 * 0.25})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
  }
  x.globalCompositeOperation = 'source-over';
  if (p.dust > 0) {
    x.fillStyle = 'rgba(255,255,255,.65)';
    for (let i = 0; i < p.dust * 0.8; i++) { x.beginPath(); x.arc(rr() * w, rr() * h, m * 0.0012 * (0.5 + rr() * 1.5), 0, 7); x.fill(); }
    x.strokeStyle = 'rgba(255,255,255,.22)'; x.lineWidth = Math.max(1, m * 0.0006);
    for (let i = 0; i < p.dust * 0.12; i++) { const a = rr() * w, b = rr() * h; x.beginPath(); x.moveTo(a, b); x.lineTo(a + (rr() - 0.5) * m * 0.03, b + rr() * m * 0.12); x.stroke(); }
  }

  const dt = new Date(), ds = `'${String(dt.getFullYear()).slice(2)} ${String(dt.getMonth() + 1).padStart(2, '0')} ${String(dt.getDate()).padStart(2, '0')}`;
  if (p.date) {
    x.font = `bold ${m * 0.035}px ui-monospace, Menlo, monospace`;
    x.textAlign = 'right'; x.fillStyle = '#ff8a1e'; x.shadowColor = '#ff5a00'; x.shadowBlur = m * 0.01;
    x.fillText(ds, w - m * 0.04, h - m * 0.04); x.shadowBlur = 0;
  }

  const F = { Plain: [0, 0, '#000'], White: [0.06, 0.06, '#f6f4ef'], Paper: [0.06, 0.15, '#ece4d2'], Black: [0.06, 0.06, '#0b0b0b'], Negative: [0.07, 0.07, '#141210'], Specs: [0.04, 0.16, '#f7f7f5'], Polaroid: [0.05, 0.24, '#fcfbf8'], Filmstrip: [0.1, 0.1, '#0f0f11'] }[p.frame];
  const pd = F[0] * m, bt = F[1] * m;
  if (!pd && !bt) return ph;

  const o = document.createElement('canvas');
  o.width = w + 2 * pd; o.height = h + pd + bt;
  const c = o.getContext('2d');
  c.fillStyle = F[2]; c.fillRect(0, 0, o.width, o.height); c.drawImage(ph, pd, pd);

  c.textAlign = 'left';
  const ttl = (p.title || '').toUpperCase();
  const spc = (p.specs || `${(w * h / 1e6).toFixed(0)}MP · ${w}×${h} · ${p.look}`).toUpperCase();
  const mono = 'ui-monospace, Menlo, monospace', bot = h + pd;

  if (p.frame === 'Paper') {
    const ty = bot + bt * 0.45;
    c.fillStyle = '#1c1c1f'; c.font = `700 ${m * 0.03}px -apple-system, Georgia, serif`; c.fillText(ttl, pd, ty);
    c.fillStyle = '#6b7280'; c.font = `${m * 0.017}px ${mono}`; c.fillText(`${spc}  ·  ${ds}`, pd, ty + m * 0.045);
  }
  if (p.frame === 'Polaroid') {
    const ty = bot + bt * 0.42;
    c.fillStyle = '#2a2a2e'; c.font = `italic 600 ${m * 0.036}px -apple-system, sans-serif`; c.fillText(p.title || 'Framed', pd + m * 0.01, ty);
    c.fillStyle = '#8f949e'; c.font = `${m * 0.016}px ${mono}`; c.fillText(`${spc}  ·  ${ds}`, pd + m * 0.012, ty + m * 0.07);
  }
  if (p.frame === 'Specs') {
    c.fillStyle = '#111'; c.font = `bold ${m * 0.028}px ${mono}`; c.fillText(ttl, pd, h + pd + m * 0.055);
    c.font = `${m * 0.021}px ${mono}`; c.fillStyle = '#666'; c.fillText(`${spc}  ·  ${dt.toDateString()}`, pd, h + pd + m * 0.1);
  }
  if (p.frame === 'Filmstrip') {
    const hw = m * 0.035, hh = m * 0.05, st = m * 0.07, hy = (pd - hh) / 2;
    c.fillStyle = '#2a2a30';
    for (let X = m * 0.02; X < o.width - m * 0.04; X += st) {
      c.fillRect(X, hy * 0.6, hw, hh); c.fillRect(X, o.height - hy * 0.6 - hh, hw, hh);
    }
    c.fillStyle = '#e2a842'; c.font = `600 ${m * 0.016}px ${mono}`; c.fillText(`KODAK 5074 // ${p.look.toUpperCase()} // DX-35`, pd, pd - m * 0.012);
    c.fillStyle = '#f3f4f6'; c.font = `700 ${m * 0.02}px ${mono}`; c.fillText(ttl, pd, bot + m * 0.03);
    c.fillStyle = '#e2a842'; c.font = `${m * 0.014}px ${mono}`; c.textAlign = 'right'; c.fillText(spc, o.width - pd, bot + m * 0.03);
  }
  if (p.frame === 'Negative') {
    c.fillStyle = '#2a2622';
    for (let i = 0; i < o.width / (m * 0.06); i++) {
      c.fillRect(i * m * 0.06 + m * 0.02, m * 0.02, m * 0.03, m * 0.03);
      c.fillRect(i * m * 0.06 + m * 0.02, o.height - m * 0.05, m * 0.03, m * 0.03);
    }
    c.fillStyle = '#ff9a2e'; c.font = `${m * 0.022}px ${mono}`; c.fillText(`FRAMED 400   ▸ ${String(Math.floor(rr() * 36) + 1).padStart(2, '0')}`, pd, o.height - m * 0.058);
  }
  return o;
}

$('#back').onclick = () => { $('#ed').hidden = true; $('#cam').hidden = false; src = small = null; };
$('#save').onclick = async () => {
  $('#busy-label').textContent = 'Exporting Full Resolution…';
  $('#busy').hidden = false; await tick();
  const o = render(src, p);
  o.toBlob(async b => {
    const f = new File([b], `framed-${Date.now()}.jpg`, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f] }); } catch(e) {}
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = f.name; a.click();
    }
    $('#info').textContent = `Exported ${o.width}×${o.height}`;
    $('#busy').hidden = true;
  }, 'image/jpeg', 0.96);
};

// Start camera immediately
start();
</script>
</body>
</html>
