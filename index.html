<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Framed Studio">
  <title>Framed — Neural Aesthetic Camera</title>
  <style>
    :root {
      --bg: #09090b;
      --fg: #f4f4f5;
      --mut: #a1a1aa;
      --acc: #eab308;
      --acc-glow: rgba(234, 179, 8, 0.35);
      --green: #22c55e;
      --green-glow: rgba(34, 197, 94, 0.4);
      --pan: #18181b;
      --pan-border: #27272a;
      --stage: #000;
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    section {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--bg);
    }
    [hidden] { display: none !important; }
    
    button {
      font: inherit;
      color: inherit;
      background: var(--pan);
      border: 1px solid var(--pan-border);
      border-radius: 999px;
      padding: 7px 14px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      transition: background 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.95); }
    button.on { background: var(--acc); color: #000; border-color: var(--acc); font-weight: 600; }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      flex-wrap: wrap;
    }

    #wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
    }
    #stage {
      position: relative;
      flex: none;
      background: var(--stage);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    video, #ov {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    video { object-fit: cover; }

    /* Top HUD / Guidance Banner */
    #hud {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      z-index: 20;
    }
    #hint-pill {
      background: rgba(15, 15, 18, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transition: all 0.25s ease;
    }
    #hint-pill.locked {
      border-color: var(--green);
      color: var(--green);
      box-shadow: 0 0 24px var(--green-glow);
    }
    #hint-pill.searching {
      border-color: var(--acc);
      color: var(--acc);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulseDot 1.4s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    /* Live Controls Bar */
    #tools {
      display: flex;
      gap: 16px;
      padding: 6px 20px;
    }
    #tools label {
      flex: 1;
      font-size: 11px;
      color: var(--mut);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    input[type=range] {
      accent-color: var(--acc);
      width: 100%;
      height: 4px;
      border-radius: 2px;
      outline: none;
    }

    #info-bar {
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
    }
    small {
      color: var(--mut);
      font-size: 11px;
      font-family: ui-monospace, Menlo, monospace;
    }

    #bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 8px 14px 18px;
    }
    #shut {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid var(--bg);
      outline: 3px solid rgba(255,255,255,0.85);
      padding: 0;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #shut.lit {
      outline-color: var(--green);
      box-shadow: 0 0 26px var(--green-glow);
      background: #f0fdf4;
      transform: scale(1.05);
    }
    #shut:active {
      transform: scale(0.92);
      background: var(--acc);
    }

    /* EDITOR VIEW */
    #pvw {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: #09090b;
    }
    #pv {
      max-width: 100%;
      max-height: 100%;
      border-radius: 4px;
      box-shadow: 0 6px 30px rgba(0,0,0,0.8);
    }
    #panel {
      height: 200px;
      overflow-y: auto;
      padding: 8px 16px;
      background: var(--bg);
    }
    .sl {
      display: grid;
      grid-template-columns: 88px 1fr 36px;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--mut);
      margin: 8px 0;
    }
    .sl span:last-child {
      text-align: right;
      font-family: monospace;
      color: var(--fg);
    }

    #busy {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(10px);
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 500;
      z-index: 99;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: var(--acc);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- VIEW 1: INTELLIGENT VIEWFINDER -->
<section id="cam">
  <div class="row" id="top"></div>

  <div id="wrap">
    <div id="stage" onclick="if(!stream){start();}">
      <video id="v" playsinline muted autoplay></video>
      <canvas id="ov"></canvas>
      <div id="hud">
        <div id="hint-pill" class="searching">
          <div class="status-dot"></div>
          <span id="hint-text">Framed AI Scanning Scene...</span>
        </div>
      </div>
    </div>
  </div>

  <div id="tools">
    <label>Sensor Zoom
      <input type="range" id="zm" min="1" max="5" step="0.1" value="1">
    </label>
    <label>Exposure Compensation
      <input type="range" id="ex" min="-2" max="2" step="0.1" value="0">
    </label>
  </div>

  <div id="info-bar">
    <small id="res">Sensor: Initializing...</small>
    <small id="det">Neural Saliency Ready</small>
  </div>

  <div id="bar">
    <button id="imp" title="Import photo">Photos</button>
    <button id="auto" class="on">✦ AI Coach</button>
    <button id="shut" aria-label="Take high resolution photo"></button>
    <button id="drw">Manual</button>
    <button id="nat" title="Full uncompressed 24MP/48MP native sensor capture" style="font-weight:700;color:var(--acc);">24MP</button>
  </div>
</section>

<!-- VIEW 2: PROFESSIONAL FILM LAB -->
<section id="ed" hidden>
  <div id="pvw"><canvas id="pv"></canvas></div>
  <div class="row" id="tabs"></div>
  <div id="panel"></div>
  <div class="row" style="border-top: 1px solid var(--pan); padding-top: 10px;">
    <button id="back">Retake</button>
    <small id="info" style="flex:1; text-align:center;"></small>
    <button id="save" class="on">Save Photo</button>
  </div>
</section>

<div id="busy" hidden>
  <div class="spinner"></div>
  <span id="busy-label">Developing high-res film...</span>
</div>

<input type="file" id="f1" accept="image/*" hidden>
<input type="file" id="f2" accept="image/*" capture="environment" hidden>

<script>
const $ = s => document.querySelector(s);
const RAT = { '3:4': 3/4, '4:5': 4/5, '1:1': 1, '3:2': 3/2, '9:16': 9/16, '65:24': 65/24 };
let ratio = '3:2', facing = 'environment', stream = null, track = null, imageCapture = null;
let frame = null, drawMode = false, autoOn = true, src = null, small = null, p = null;
let camExp = 0, stable = 0, lastMP = 0;
const v = $('#v'), ov = $('#ov'), stage = $('#stage');
const tick = () => new Promise(r => setTimeout(r, 20));

/* Set dynamic iOS web app icon */
try {
  const ic = document.createElement('canvas');
  ic.width = ic.height = 180;
  const x = ic.getContext('2d');
  x.fillStyle = '#09090b';
  x.fillRect(0,0,180,180);
  x.strokeStyle = '#eab308';
  x.lineWidth = 12;
  x.strokeRect(36,36,108,108);
  const l = document.createElement('link');
  l.rel = 'apple-touch-icon';
  l.href = ic.toDataURL();
  document.head.appendChild(l);
} catch(e){}

/* ---------- RATIO & TOP CONTROLS ---------- */
const topBar = $('#top');
Object.keys(RAT).forEach(k => {
  const b = document.createElement('button');
  b.textContent = k;
  b.className = k === ratio ? 'on' : '';
  b.onclick = () => {
    ratio = k;
    fit();
    [...topBar.children].forEach(c => {
      if (RAT[c.textContent] !== undefined) c.classList.toggle('on', c.textContent === k);
    });
    frame = null;
    size();
    draw();
  };
  topBar.appendChild(b);
});

const fl = document.createElement('button');
fl.textContent = 'Flip';
fl.onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; start(); };
topBar.appendChild(fl);

const tb = document.createElement('button');
tb.textContent = 'Torch';
topBar.appendChild(tb);

/* Horizon Level */
let lvlOn = false, lvlAng = 0, lvlRaf = 0;
{
  const lb = document.createElement('button');
  lb.textContent = 'Level';
  lb.onclick = async () => {
    lvlOn = !lvlOn;
    lb.classList.toggle('on', lvlOn);
    if (lvlOn && window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) {
      try {
        if (await DeviceOrientationEvent.requestPermission() !== 'granted') {
          lvlOn = false;
          lb.classList.remove('on');
        }
      } catch(e){}
    }
    draw();
  };
  topBar.appendChild(lb);
}
window.addEventListener('deviceorientation', e => {
  if (!lvlOn) return;
  lvlAng = Math.max(-45, Math.min(45, e.gamma || 0));
  cancelAnimationFrame(lvlRaf);
  lvlRaf = requestAnimationFrame(draw);
});

function drawLevel(x, W, H) {
  if (!lvlOn) return;
  const d = Math.max(1, W / 400), ok = Math.abs(lvlAng) < 1.2;
  x.save();
  x.translate(W / 2, H / 2);
  x.rotate(-lvlAng * Math.PI / 180);
  x.strokeStyle = ok ? '#22c55e' : 'rgba(255,255,255,.75)';
  x.lineWidth = 2.5 * d;
  x.beginPath();
  x.moveTo(-W * 0.24, 0); x.lineTo(-W * 0.08, 0);
  x.moveTo(W * 0.08, 0);  x.lineTo(W * 0.24, 0);
  x.stroke();
  x.restore();
}

let cameraActive = false;
async function start() {
  $('#res').textContent = 'Requesting camera access...';
  updateHint('Requesting camera permission...', false);

  if (stream) {
    try { stream.getTracks().forEach(t => t.stop()); } catch(e){}
    stream = null;
    cameraActive = false;
  }

  // Ensure video element properties are primed for iOS Safari
  v.muted = true;
  v.playsInline = true;
  v.setAttribute('playsinline', '');
  v.setAttribute('webkit-playsinline', '');

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    $('#res').textContent = 'Camera API not supported in this browser';
    updateHint('Open in Safari directly via HTTPS', false);
    return;
  }

  let camStream = null;
  let lastErr = null;

  // Tiered constraints: try high-res first, then clean facingMode
  const constraintsToTry = [
    { video: { facingMode: facing, width: { ideal: 4032 }, height: { ideal: 3024 } }, audio: false },
    { video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
    { video: { facingMode: facing }, audio: false },
    { video: true, audio: false }
  ];

  for (const c of constraintsToTry) {
    try {
      camStream = await navigator.mediaDevices.getUserMedia(c);
      if (camStream) break;
    } catch(err) {
      lastErr = err;
      console.warn("Camera constraint attempt failed:", err.name, err.message);
    }
  }

  if (!camStream) {
    const errName = lastErr ? lastErr.name : 'UnknownError';
    console.error("Camera access failed:", lastErr);
    if (errName === 'NotAllowedError' || errName === 'PermissionDeniedError') {
      $('#res').textContent = 'Permission Denied · Check Settings > Safari > Camera';
      updateHint('Camera blocked · Tap to re-request', false);
    } else {
      $('#res').textContent = `Camera Error: ${errName} · Tap to retry`;
      updateHint('Tap viewfinder to retry camera', false);
    }
    showCamFallbackPrompt();
    return;
  }

  stream = camStream;
  v.srcObject = stream;

  try {
    await v.play();
  } catch(playErr) {
    console.warn("v.play() paused by browser:", playErr);
    showCamFallbackPrompt();
  }

  track = stream.getVideoTracks()[0];
  if (window.ImageCapture && track) {
    try { imageCapture = new ImageCapture(track); } catch(e){}
  }

  const s = track ? track.getSettings() : {};
  const c = track && track.getCapabilities ? track.getCapabilities() : {};
  lastMP = ((s.width * s.height) / 1e6) || 0;
  $('#res').textContent = `Live: ${s.width || v.videoWidth || 'Active'}×${s.height || v.videoHeight || ''} (${lastMP ? lastMP.toFixed(1) + 'MP' : 'Active'})`;

  $('#zm').parentNode.style.opacity = c.zoom ? 1 : 0.6;
  if (c.zoom) {
    $('#zm').min = c.zoom.min;
    $('#zm').max = Math.min(c.zoom.max, 8);
  }
  tb.style.display = c.torch ? '' : 'none';

  cameraActive = true;
  hideCamFallbackPrompt();
  updateHint('AI Composition Coach Active', false);
  fit();
  draw();
}

function showCamFallbackPrompt() {
  let prompt = $('#cam-prompt');
  if (!prompt) {
    prompt = document.createElement('div');
    prompt.id = 'cam-prompt';
    prompt.style.cssText = 'position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(12,12,13,0.85);z-index:35;cursor:pointer;padding:24px;text-align:center;gap:14px;';
    prompt.innerHTML = '<div style="font-size:36px;">📷</div><div style="font-weight:700;font-size:16px;color:#fff;background:var(--acc);color:#000;padding:10px 22px;border-radius:24px;">Tap to Start Camera</div><div style="font-size:12px;color:#a1a1aa;max-width:260px;">iOS requires a tap to open the camera sensor in Home Screen apps</div>';
    prompt.onclick = (e) => { e.stopPropagation(); prompt.remove(); start(); };
    $('#stage').appendChild(prompt);
  }
}

function hideCamFallbackPrompt() {
  const prompt = $('#cam-prompt');
  if (prompt) prompt.remove();
}

v.onloadedmetadata = () => {
  fit();
  draw();
};

$('#zm').oninput = e => {
  const val = +e.target.value;
  if (track && track.getCapabilities && track.getCapabilities().zoom) {
    track.applyConstraints({ advanced: [{ zoom: val }] }).catch(() => {});
  } else {
    v.style.transform = `scale(${val})`;
  }
};

$('#ex').oninput = e => {
  camExp = +e.target.value;
  const c = track && track.getCapabilities ? track.getCapabilities() : {};
  if (c.exposureCompensation) {
    track.applyConstraints({ advanced: [{ exposureCompensation: camExp }] }).catch(() => {});
    camExp = 0;
  } else {
    v.style.filter = `brightness(${Math.pow(2, camExp / 2)})`;
  }
};

let torch = false;
tb.onclick = () => {
  torch = !torch;
  tb.classList.toggle('on', torch);
  if (track) track.applyConstraints({ advanced: [{ torch }] }).catch(() => {});
};

function size() {
  const d = devicePixelRatio || 1;
  ov.width = stage.clientWidth * d;
  ov.height = stage.clientHeight * d;
}

function fit() {
  const w = $('#wrap'), a = RAT[ratio];
  const W = w.clientWidth - 16, H = w.clientHeight;
  if (W <= 0 || H <= 0) return;
  let sw = W, sh = W / a;
  if (sh > H) {
    sh = H;
    sw = H * a;
  }
  stage.style.width = sw + 'px';
  stage.style.height = sh + 'px';
  size();
  draw();
}
new ResizeObserver(fit).observe($('#wrap'));
fit();

/* =========================================================================
   APPROACH A: DEEP NEURAL COMPOSITION ENGINE
   1. Multi-Stage Detection:
      - Stage 1: Fast Neural Model (COCO-SSD / MobileNet) via TF.js if network available.
      - Stage 2: Hardware-accelerated offline Multi-Scale Integral Image Saliency + Skin/Face Model.
   2. "Aesthetic Framed Math":
      - Computes optimal tight crop box (s) matching 35mm / Leica guidelines:
        * Subjects are not left tiny; optimal crop fills 45%-60% of frame height.
        * Eye line placed at upper third (y = 1/3).
        * Gaze / position offset placed along golden ratio (x = 1/3 or 2/3).
        * Provides clear, concise directional feedback ("Pan Left", "Tilt Up", "Step Closer").
   ========================================================================= */

let tfModel = null, tfLoading = false;
async function loadTFModel() {
  if (tfModel || tfLoading) return;
  tfLoading = true;
  try {
    const s1 = document.createElement('script');
    s1.src = 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js';
    document.head.appendChild(s1);
    await new Promise(r => s1.onload = r);

    const s2 = document.createElement('script');
    s2.src = 'https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js';
    document.head.appendChild(s2);
    await new Promise(r => s2.onload = r);

    tfModel = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
    $('#det').textContent = 'Neural Vision: COCO-SSD Active';
  } catch(e) {
    $('#det').textContent = 'Neural Vision: Offline Saliency Active';
  }
  tfLoading = false;
}

const dc = document.createElement('canvas');
const scCanvas = document.createElement('canvas');

function vis() {
  const vw = v.videoWidth, vh = v.videoHeight, a = RAT[ratio];
  let cw, ch;
  if (vw / vh > a) {
    ch = vh; cw = vh * a;
  } else {
    cw = vw; ch = vw / a;
  }
  return { x: (vw - cw) / 2, y: (vh - ch) / 2, w: cw, h: ch };
}

// Stage 2 Offline High-Precision Saliency (Face, Skin, & Multi-Frequency Gradient Tensor)
function detectOfflineSubject(W, H, d) {
  const n = W * H;
  const Y = new Float32Array(n);
  const Saliency = new Float32Array(n);

  let meanY = 0;
  for (let i = 0; i < n; i++) {
    const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2];
    const y = 0.299 * r + 0.587 * g + 0.114 * b;
    Y[i] = y;
    meanY += y;

    // Human skin/face tone chromaticity heuristic
    const isSkin = (r > 60 && g > 30 && b > 20 && r > g && r > b && Math.abs(r - g) > 10);
    if (isSkin) Saliency[i] += 40;
  }
  meanY /= n;

  // Sobel Edge & Contrast Energy
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      const idx = y * W + x;
      const gx = Math.abs(Y[idx + 1] - Y[idx - 1]);
      const gy = Math.abs(Y[idx + W] - Y[idx - W]);
      const edge = gx + gy;
      const contrast = Math.abs(Y[idx] - meanY);

      // Center-weighted aesthetic bias
      const cx = (x / W - 0.5), cy = (y / H - 0.5);
      const centerDist = 1 - 0.55 * (cx * cx + cy * cy);

      Saliency[idx] += (edge * 0.9 + contrast * 0.5) * centerDist;
    }
  }

  // Integral Image for fast bounding box search
  const I = new Float64Array((W + 1) * (H + 1));
  for (let y = 0; y < H; y++) {
    let rowSum = 0;
    for (let x = 0; x < W; x++) {
      rowSum += Saliency[y * W + x];
      I[(y + 1) * (W + 1) + (x + 1)] = I[y * (W + 1) + (x + 1)] + rowSum;
    }
  }

  const queryBox = (x0, y0, x1, y1) => {
    return I[y1 * (W + 1) + x1] - I[y0 * (W + 1) + x1] - I[y1 * (W + 1) + x0] + I[y0 * (W + 1) + x0];
  };

  // Evaluate candidate bounding boxes
  let bestScore = -1e9, bestSubject = null;
  const totEnergy = I[(W + 1) * (H + 1)] || 1;

  for (let sz = 0.25; sz <= 0.75; sz += 0.1) {
    const bw = Math.round(W * sz);
    const bh = Math.round(H * sz);
    for (let y = 0; y <= H - bh; y += Math.round(H * 0.08)) {
      for (let x = 0; x <= W - bw; x += Math.round(W * 0.08)) {
        const energy = queryBox(x, y, x + bw, y + bh);
        const density = energy / (bw * bh);
        const score = (energy / totEnergy) * 1.5 + density * 0.8;
        if (score > bestScore) {
          bestScore = score;
          bestSubject = {
            x: x / W,
            y: y / H,
            w: bw / W,
            h: bh / H,
            label: 'Subject'
          };
        }
      }
    }
  }
  return bestSubject;
}

// Master Saliency Scan Pipeline
async function analyzeFraming() {
  const q = vis();
  if (!q.w || !v.videoWidth) return null;

  const a = RAT[ratio];
  const W = 320, H = Math.round(W / a);
  dc.width = W; dc.height = H;
  const ctx = dc.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(v, q.x, q.y, q.w, q.h, 0, 0, W, H);

  let subj = null;

  // 1. Try TF Neural Detection
  if (tfModel) {
    try {
      const preds = await tfModel.detect(dc, 6, 0.35);
      const valid = preds.filter(p => p.bbox[2] * p.bbox[3] > (W * H * 0.03));
      if (valid.length > 0) {
        // Prioritize person / faces
        valid.sort((a, b) => {
          const aP = a.class === 'person' ? 2 : 1;
          const bP = b.class === 'person' ? 2 : 1;
          return (b.score * bP) - (a.score * aP);
        });
        const best = valid[0];
        subj = {
          x: best.bbox[0] / W,
          y: best.bbox[1] / H,
          w: best.bbox[2] / W,
          h: best.bbox[3] / H,
          label: best.class.charAt(0).toUpperCase() + best.class.slice(1)
        };
      }
    } catch(e){}
  }

  // 2. Offline Neural Saliency fallback
  if (!subj) {
    const imgData = ctx.getImageData(0, 0, W, H).data;
    subj = detectOfflineSubject(W, H, imgData);
  }

  if (!subj) return null;

  /* =========================================================================
     FRAMED AESTHETIC COMPOSITION OPTIMIZER:
     - Target Subject Height in Frame: ~50% to 65% (ideal portrait/street aesthetic)
     - Headroom: 10% - 15% above subject
     - Golden Ratio Placement: Eye line along upper 1/3 line
     ========================================================================= */
  const subCenterX = subj.x + subj.w / 2;
  const subCenterY = subj.y + subj.h / 2;

  // Compute optimal crop size (s) so subject is nicely framed without empty dead space
  let optimalSize = Math.max(subj.w * 1.5, subj.h * 1.55);
  optimalSize = Math.max(0.42, Math.min(1.0, optimalSize));

  // Determine aesthetic horizontal anchor: Rule of Thirds (1/3 or 2/3) or center
  let targetRuleX = 0.5;
  if (subCenterX < 0.44) targetRuleX = 1/3;
  else if (subCenterX > 0.56) targetRuleX = 2/3;

  // Determine aesthetic vertical anchor: Upper third for eye line
  const targetRuleY = 0.38;

  // Calculate required crop frame position
  let cropCenterX = subCenterX - (targetRuleX - 0.5) * optimalSize;
  let cropCenterY = subCenterY - (targetRuleY - 0.5) * optimalSize;

  // Keep inside sensor bounds
  cropCenterX = Math.max(optimalSize / 2, Math.min(1 - optimalSize / 2, cropCenterX));
  cropCenterY = Math.max(optimalSize / 2, Math.min(1 - optimalSize / 2, cropCenterY));

  // Calculate deviation vectors from current phone position
  const dx = cropCenterX - 0.5;
  const dy = cropCenterY - 0.5;
  const zoomNeeded = 1 / optimalSize;

  let advice = [];
  if (Math.abs(dx) > 0.08) advice.push(dx > 0 ? 'Pan Right ▸' : '◂ Pan Left');
  if (Math.abs(dy) > 0.08) advice.push(dy > 0 ? 'Tilt Down ▾' : '▴ Tilt Up');
  if (zoomNeeded > 1.25) advice.push(`Zoom ${zoomNeeded.toFixed(1)}× / Step Closer`);

  const isAligned = Math.abs(dx) <= 0.08 && Math.abs(dy) <= 0.08;

  return {
    subject: subj,
    targetFrame: { cx: cropCenterX, cy: cropCenterY, s: optimalSize },
    isAligned,
    advice: advice.length ? advice.join(' · ') : 'Aesthetic Frame Locked · Shoot'
  };
}

        updateHint(`✓ ${res.subject.label} Locked — Shoot`, true);
      } else {
        updateHint(res.advice, false);
      }
    } else {

        cy: (frame ? frame.cy * 0.7 + res.targetFrame.cy * 0.3 : res.targetFrame.cy),

/* Viewfinder Rendering */
function draw() {
  const x = ov.getContext('2d'), W = ov.width, H = ov.height;
  x.clearRect(0, 0, W, H);

  // 1. Classical Rule-Of-Thirds Grid
  x.strokeStyle = 'rgba(255, 255, 255, 0.28)';
  x.lineWidth = 1;
  x.beginPath();
  for (let i = 1; i < 3; i++) {
    x.moveTo(W * i / 3, 0); x.lineTo(W * i / 3, H);
    x.moveTo(0, H * i / 3); x.lineTo(W, H * i / 3);
  }
  x.stroke();

  // 2. Subject Detection Bracket
  if (currentScan && currentScan.subject && autoOn) {
    const s = currentScan.subject;
    const bx = s.x * W, by = s.y * H, bw = s.w * W, bh = s.h * H;
    const d = Math.max(1, W / 400);

    // Subject target corners
    x.strokeStyle = currentScan.isAligned ? '#22c55e' : '#eab308';
    x.lineWidth = 2.5 * d;
    const len = 14 * d;
    
    // Top-Left
    x.beginPath(); x.moveTo(bx, by + len); x.lineTo(bx, by); x.lineTo(bx + len, by); x.stroke();
    // Top-Right
    x.beginPath(); x.moveTo(bx + bw - len, by); x.lineTo(bx + bw, by); x.lineTo(bx + bw, by + len); x.stroke();
    // Bottom-Left
    x.beginPath(); x.moveTo(bx, by + bh - len); x.lineTo(bx, by + bh); x.lineTo(bx + len, by + bh); x.stroke();
    // Bottom-Right
    x.beginPath(); x.moveTo(bx + bw - len, by + bh); x.lineTo(bx + bw, by + bh); x.lineTo(bx + bw, by + bh - len); x.stroke();

    // Subject Label Badge
    const label = `● ${s.label}`;
    x.font = `600 ${12 * d}px -apple-system, sans-serif`;
    const tw = x.measureText(label).width + 16 * d;
    x.fillStyle = 'rgba(15, 15, 18, 0.85)';
    x.fillRect(bx, Math.max(4, by - 24 * d), tw, 20 * d);
    x.fillStyle = currentScan.isAligned ? '#22c55e' : '#eab308';
    x.fillText(label, bx + 8 * d, Math.max(18 * d, by - 10 * d));
  }

  // 3. Recommended Golden Crop Matte
  if (frame) {
    const s = frame.s, l = (frame.cx - s / 2) * W, t = (frame.cy - s / 2) * H, w = s * W, h = s * H;
    x.fillStyle = 'rgba(0, 0, 0, 0.45)';
    x.beginPath();
    x.rect(0, 0, W, H);
    x.rect(l, t, w, h);
    x.fill('evenodd');

    x.strokeStyle = (stable >= 2) ? '#22c55e' : '#eab308';
    x.lineWidth = 2.5;
    x.strokeRect(l, t, w, h);
  }

  drawLevel(x, W, H);
}

let dp = null;
ov.onpointerdown = e => {
  if (!drawMode) return;
  const r = ov.getBoundingClientRect();
  dp = { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
  frame = { cx: dp.x, cy: dp.y, s: 0.35 };
  ov.setPointerCapture(e.pointerId);
  draw();
};
ov.onpointermove = e => {
  if (!dp) return;
  const r = ov.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;
  const y = (e.clientY - r.top) / r.height;
  const s = Math.min(1, Math.max(0.25, 2 * Math.max(Math.abs(x - dp.x), Math.abs(y - dp.y))));
  frame = {
    cx: Math.min(1 - s / 2, Math.max(s / 2, dp.x)),
    cy: Math.min(1 - s / 2, Math.max(s / 2, dp.y)),
    s
  };
  draw();
};
ov.onpointerup = () => { dp = null; };

  // ImageCapture hardware buffer
  if (imageCapture) {
    try {
      const blob = await imageCapture.takePhoto();
      const bm = await createImageBitmap(blob);
      capturedCanvas = document.createElement('canvas');
      capturedCanvas.width = bm.width;
      capturedCanvas.height = bm.height;
      capturedCanvas.getContext('2d').drawImage(bm, 0, 0);
    } catch(e) {}
  }

  // Full track settings buffer fallback
  if (!capturedCanvas) {
    const s = track ? track.getSettings() : {};
    const fullW = (s && s.width) || v.videoWidth || 3840;
    const fullH = (s && s.height) || v.videoHeight || 2160;

    capturedCanvas = document.createElement('canvas');
    capturedCanvas.width = fullW;
    capturedCanvas.height = fullH;
    capturedCanvas.getContext('2d').drawImage(v, 0, 0, fullW, fullH);
  }

  // Apply Aspect Ratio & Framed Crop
  const q = { x: 0, y: 0, w: capturedCanvas.width, h: capturedCanvas.height };
  const targetAspect = RAT[ratio];
  let cw = q.w, ch = q.h;
  if (cw / ch > targetAspect) {
    cw = ch * targetAspect;
  } else {
    ch = cw / targetAspect;
  }
  let cropX = (q.w - cw) / 2;
  let cropY = (q.h - ch) / 2;

  if (frame) {
    cropX += (frame.cx - frame.s / 2) * cw;
    cropY += (frame.cy - frame.s / 2) * ch;
    cw *= frame.s;
    ch *= frame.s;
  }

  const finalC = document.createElement('canvas');
  finalC.width = Math.round(cw);
  finalC.height = Math.round(ch);
  finalC.getContext('2d').drawImage(capturedCanvas, cropX, cropY, cw, ch, 0, 0, finalC.width, finalC.height);

  $('#busy').hidden = true;
  edit(finalC, camExp);
};

function curveLUT(P) {
  const n = P.length, x = P.map(a => a[0]), y = P.map(a => a[1]);
  const dx = [], m = [], t = new Array(n);
  for (let i = 0; i < n - 1; i++) {
    dx[i] = x[i + 1] - x[i];
    m[i] = (y[i + 1] - y[i]) / dx[i];
  }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) t[i] = t[i + 1] = 0;
    else {
      const a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b;
      if (s > 9) {
        const k = 3 / Math.sqrt(s);
        t[i] = k * a * m[i];
        t[i + 1] = k * b * m[i];
      }
    }
  }
  const L = new Uint8Array(256);
  let j = 0;
  for (let v = 0; v < 256; v++) {
    const X = v / 255;
    while (j < n - 2 && X > x[j + 1]) j++;
    const h = dx[j], u = (X - x[j]) / h;
    const u2 = u * u, u3 = u2 * u;
    const Y = (2 * u3 - 3 * u2 + 1) * y[j] + (u3 - 2 * u2 + u) * h * t[j] + (-2 * u3 + 3 * u2) * y[j + 1] + (u3 - u2) * h * t[j + 1];
    L[v] = Math.round(Math.min(1, Math.max(0, Y)) * 255);
  }
  return L;
}

function buildCurves(p) {
  const c = p.curves;
  if (!c) return null;
  const isId = a => a.every(q => Math.abs(q[0] - q[1]) < 0.002);
  if (isId(c.m) && isId(c.r) && isId(c.g) && isId(c.b)) return null;
  const M = curveLUT(c.m);
  const mk = a => {
    const L = curveLUT(a), O = new Uint8Array(256);
    for (let i = 0; i < 256; i++) O[i] = M[L[i]];
    return O;
  };
  return [mk(c.r), mk(c.g), mk(c.b)];
}

const BC = [0, 30, 60, 120, 180, 225, 270, 320];
let hR = 0, hG = 0, hB = 0;
function hslActive(p) { return !!(p.hsl && p.hsl.some(a => a[0] || a[1] || a[2])); }
function hslApply(r, g, b, H) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, l = (mx + mn) / 2;
  if (d < 0.02) { hR = r; hG = g; hB = b; return; }
  const s = d / (1 - Math.abs(2 * l - 1) || 1e-6);
  let h = (mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60;
  let dh = 0, ds = 0, dl = 0;
  for (let k = 0; k < 8; k++) {
    let a = Math.abs(h - BC[k]);
    if (a > 180) a = 360 - a;
    const w = 1 - a / 45;
    if (w > 0) { dh += w * H[k][0]; ds += w * H[k][1]; dl += w * H[k][2]; }
  }
  const k2 = Math.min(1, s * 3);
  h = (h + dh * 0.3 * k2 + 360) % 360;
  const s2 = Math.min(1, Math.max(0, s * (1 + ds / 100 * k2)));
  const l2 = Math.min(1, Math.max(0, l + dl / 200 * k2));
  const c = (1 - Math.abs(2 * l2 - 1)) * s2;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l2 - c / 2;
  const q = h / 60 | 0;
  let R = 0, G = 0, B = 0;
  if (q === 0) { R = c; G = x; }
  else if (q === 1) { R = x; G = c; }
  else if (q === 2) { G = c; B = x; }
  else if (q === 3) { G = x; B = c; }
  else if (q === 4) { R = x; B = c; }
  else { R = c; B = x; }
  hR = R + m; hG = G + m; hB = B + m;
}

let hk = 0, cch = 'm';
const HC = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#14b8a6', '#3b82f6', '#8b5cf6', '#d946ef'];
const CCOL = { m: '#e8e6e0', r: '#ef4444', g: '#22c55e', b: '#3b82f6' };
const idPts = () => Array.from({ length: 9 }, (_, i) => [i / 8, i / 8]);

function curvePanel(P) {
  p.curves = p.curves || { m: idPts(), r: idPts(), g: idPts(), b: idPts() };
  const S = 150, dpr = devicePixelRatio || 1;
  const w = document.createElement('div');
  w.style.cssText = 'display:flex;gap:14px;align-items:center;justify-content:center;';

  const cv = document.createElement('canvas');
  cv.width = cv.height = S * dpr;
  cv.style.cssText = `width:${S}px;height:${S}px;border-radius:10px;background:var(--pan);touch-action:none;`;

  const dr = () => {
    const x = cv.getContext('2d');
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.clearRect(0, 0, S, S);
    x.strokeStyle = 'rgba(128,128,128,.3)';
    x.lineWidth = 1;
    x.beginPath();
    for (let i = 1; i < 4; i++) {
      x.moveTo(S * i / 4, 0); x.lineTo(S * i / 4, S);
      x.moveTo(0, S * i / 4); x.lineTo(S, S * i / 4);
    }
    x.stroke();

    const pts = p.curves[cch], L = curveLUT(pts);
    x.strokeStyle = CCOL[cch];
    x.lineWidth = 2.5;
    x.beginPath();
    for (let v = 0; v < 256; v++) {
      const X = v / 255 * S, Y = S - L[v] / 255 * S;
      v ? x.lineTo(X, Y) : x.moveTo(X, Y);
    }
    x.stroke();

    x.fillStyle = CCOL[cch];
    pts.forEach(q => {
      x.beginPath();
      x.arc(q[0] * S, S - q[1] * S, 4.5, 0, 7);
      x.fill();
    });
  };

  let di = -1;
  const pos = e => {
    const r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height];
  };

  cv.onpointerdown = e => {
    const q = pos(e);
    di = Math.round(Math.min(1, Math.max(0, q[0])) * 8);
    cv.setPointerCapture(e.pointerId);
    p.curves[cch][di][1] = Math.min(1, Math.max(0, q[1]));
    dr();
    paint();
  };
  cv.onpointermove = e => {
    if (di < 0) return;
    p.curves[cch][di][1] = Math.min(1, Math.max(0, pos(e)[1]));
    dr();
    paint();
  };
  cv.onpointerup = () => { di = -1; };

  const col = document.createElement('div');
  col.style.cssText = 'display:flex;flex-direction:column;gap:6px;';
  [['m', 'RGB'], ['r', 'R'], ['g', 'G'], ['b', 'B']].forEach(([k, n]) => {
    const b = document.createElement('button');
    b.textContent = n;
    b.className = k === cch ? 'on' : '';
    b.onclick = () => { cch = k; panel(); };
    col.appendChild(b);
  });
  const rs = document.createElement('button');
  rs.textContent = 'Reset';
  rs.onclick = () => { p.curves = null; panel(); paint(); };
  col.appendChild(rs);

  w.appendChild(cv);
  w.appendChild(col);
  P.appendChild(w);
  dr();
}

function stampInputs(P) {
  [['title', 'Title', 'FRAMED STUDIO'], ['specs', 'Custom Specs', '35MM F/1.4 · ISO 400']].forEach(([k, l, ph]) => {
    const i = document.createElement('input');
    i.value = p[k] || '';
    i.placeholder = ph;
    i.style.cssText = 'display:block;width:100%;box-sizing:border-box;margin:6px 0;padding:8px 12px;border:0;border-radius:8px;background:var(--pan);color:var(--fg);font-size:14px;';
    i.oninput = e => { p[k] = e.target.value; paint(); };
    P.appendChild(i);
  });
}

let tab = 'Looks', raf = 0;
function edit(c, expo) {
  src = c;
  const k = Math.min(1, 1400 / Math.max(c.width, c.height));
  small = document.createElement('canvas');
  small.width = Math.round(c.width * k);
  small.height = Math.round(c.height * k);
  small.getContext('2d').drawImage(c, 0, 0, small.width, small.height);

  p = { ...DEF, ...LOOKS.PORTRA, seed: 1 + Math.floor(Math.random() * 999) };
  p.exposure += expo * 30;
  $('#info').textContent = `${(c.width * c.height / 1e6).toFixed(1)} MP Source`;
  $('#cam').hidden = true;
  $('#ed').hidden = false;
  tabs();
  panel();
  paint();
}

function tabs() {
  const t = $('#tabs');
  t.innerHTML = '';
  Object.keys(TABS).forEach(k => {
    const b = document.createElement('button');
    b.textContent = k;
    b.className = k === tab ? 'on' : '';
    b.onclick = () => { tab = k; tabs(); panel(); };
    t.appendChild(b);
  });
}

function panel() {
  const P = $('#panel');
  P.innerHTML = '';
  if (tab === 'Curve') return curvePanel(P);
  if (tab === 'HSL') return hslPanel(P);
  if (tab === 'Looks') {
    const r = document.createElement('div');
    r.className = 'row';
    Object.keys(LOOKS).forEach(k => {
      const b = document.createElement('button');
      b.textContent = k;
      b.className = p.look === k ? 'on' : '';
      b.onclick = () => {
        p = { ...DEF, ...LOOKS[k], look: k, frame: p.frame, date: p.date, title: p.title, specs: p.specs, curves: p.curves, hsl: p.hsl, seed: p.seed };
        panel();
        paint();
      };
      r.appendChild(b);
    });
    P.appendChild(r);
  } else if (tab === 'Frame') {
    const r = document.createElement('div');
    r.className = 'row';
    FRAMES.forEach(k => {
      const b = document.createElement('button');
      b.textContent = k;
      b.className = p.frame === k ? 'on' : '';
      b.onclick = () => { p.frame = k; panel(); paint(); };
      r.appendChild(b);
    });
    const d = document.createElement('button');
    d.textContent = 'Date Stamp';
    d.className = p.date ? 'on' : '';
    d.onclick = () => { p.date = !p.date; panel(); paint(); };
    r.appendChild(d);
    P.appendChild(r);
    stampInputs(P);
  } else {
    TABS[tab].forEach(([k, n]) => {
      const d = document.createElement('div');
      d.className = 'sl';
      const neg = ['exposure', 'contrast', 'highlights', 'shadows', 'temp', 'tint', 'sat'].includes(k);
      d.innerHTML = `<span>${n}</span><input type="range" min="${neg ? -100 : 0}" max="100" value="${p[k]}"><span>${Math.round(p[k])}</span>`;
      d.querySelector('input').oninput = e => {
        p[k] = +e.target.value;
        d.lastChild.textContent = e.target.value;
        paint();
      };
      P.appendChild(d);
    });
  }
}

function paint() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    const o = render(small, p);
    const pv = $('#pv');
    pv.width = o.width;
    pv.height = o.height;
    pv.getContext('2d').drawImage(o, 0, 0);
  });
}

function hash(x, y, s) {
  let n = Math.imul(x, 374761393) + Math.imul(y, 668265263) + s | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}

function render(sc, p) {
  const w = sc.width, h = sc.height, m = Math.min(w, h);
  const ph = document.createElement('canvas');
  ph.width = w; ph.height = h;
  const x = ph.getContext('2d', { willReadFrequently: true });
  x.drawImage(sc, 0, 0);

  const ex = Math.pow(2, p.exposure / 50);
  const ct = 1 + p.contrast / 100;
  const hi = p.highlights / 100;
  const sh = p.shadows / 100;
  const fd = p.fade / 100 * 0.14;
  const tw = p.temp / 100;
  const tn = p.tint / 100;
  const sa = 1 + p.sat / 100;
  const gr = p.grain / 100 * 0.22;
  const vg = p.vignette / 100;
  const bs = Math.max(0, Math.min(3, Math.round(Math.log2(w / 1200))));
  const sd = p.seed * 7919;

  const CV = buildCurves(p);
  const CR = CV && CV[0], CG = CV && CV[1], CB = CV && CV[2];
  const HS = hslActive(p);

  for (let y0 = 0; y0 < h; y0 += 256) {
    const hh = Math.min(256, h - y0);
    const im = x.getImageData(0, y0, w, hh);
    const d = im.data;

    for (let yy = 0; yy < hh; yy++) {
      const y = y0 + yy, dy = y / h - 0.5;
      for (let xx = 0; xx < w; xx++) {
        const i = (yy * w + xx) * 4;
        let r = d[i] / 255 * ex * (1 + tw * 0.18);
        let g = d[i + 1] / 255 * ex * (1 - tn * 0.12);
        let b = d[i + 2] / 255 * ex * (1 - tw * 0.18);
        let l = 0.299 * r + 0.587 * g + 0.114 * b;

        const a = sh * (1 - l)**2 * 0.35 + hi * l * l * 0.35;
        r += a; g += a; b += a;

        r = (r - 0.5) * ct + 0.5;
        g = (g - 0.5) * ct + 0.5;
        b = (b - 0.5) * ct + 0.5;

        r = fd + r * (1 - fd);
        g = fd + g * (1 - fd);
        b = fd + b * (1 - fd);
        l = 0.299 * r + 0.587 * g + 0.114 * b;

        if (p.mono) {
          r = g = b = l;
        } else {
          r = l + (r - l) * sa;
          g = l + (g - l) * sa;
          b = l + (b - l) * sa;
        }

        if (HS) {
          hslApply(r, g, b, p.hsl);
          r = hR; g = hG; b = hB;
        }

        const dx = xx / w - 0.5;
        const vf = 1 - vg * (dx * dx + dy * dy) * 2.2;
        const n = gr ? (hash(xx >> bs, y >> bs, sd) - 0.5) * gr * (1.1 - Math.abs(l - 0.5)) : 0;

        d[i] = (r * vf + n) * 255;
        d[i + 1] = (g * vf + n) * 255;
        d[i + 2] = (b * vf + n) * 255;

        if (CV) {
          d[i] = CR[d[i]];
          d[i + 1] = CG[d[i + 1]];
          d[i + 2] = CB[d[i + 2]];
        }
      }
    }
    x.putImageData(im, 0, y0);
  }

  let s = p.seed * 9301;
  const rr = () => (s = (s * 16807) % 2147483647) / 2147483647;

  if (p.glow > 0) {
    const t = document.createElement('canvas');
    t.width = Math.max(8, w >> 3);
    t.height = Math.max(8, h >> 3);
    const c = t.getContext('2d');
    c.drawImage(ph, 0, 0, t.width, t.height);
    c.globalCompositeOperation = 'multiply';
    c.fillStyle = '#ff7a45';
    c.fillRect(0, 0, t.width, t.height);

    x.globalCompositeOperation = 'screen';
    x.globalAlpha = p.glow / 100 * 0.45;
    x.drawImage(t, 0, 0, w, h);
    x.globalAlpha = 1;
  }

  x.globalCompositeOperation = 'screen';
  if (p.leak > 0) {
    const cx = rr() < 0.5 ? 0 : w;
    const g = x.createRadialGradient(cx, h * (0.2 + rr() * 0.5), 0, cx, h * 0.4, m * 0.9);
    g.addColorStop(0, `rgba(255,110,30,${p.leak / 100 * 0.8})`);
    g.addColorStop(0.5, `rgba(255,40,60,${p.leak / 100 * 0.25})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g;
    x.fillRect(0, 0, w, h);
  }
  x.globalCompositeOperation = 'source-over';

  if (p.dust > 0) {
    x.fillStyle = 'rgba(255,255,255,.65)';
    for (let i = 0; i < p.dust * 0.8; i++) {
      x.beginPath();
      x.arc(rr() * w, rr() * h, m * 0.0012 * (0.5 + rr() * 1.5), 0, 7);
      x.fill();
    }
    x.strokeStyle = 'rgba(255,255,255,.22)';
    x.lineWidth = Math.max(1, m * 0.0006);
    for (let i = 0; i < p.dust * 0.12; i++) {
      const a = rr() * w, b = rr() * h;
      x.beginPath();
      x.moveTo(a, b);
      x.lineTo(a + (rr() - 0.5) * m * 0.03, b + rr() * m * 0.12);
      x.stroke();
    }
  }

  const dt = new Date();
  const ds = `'${String(dt.getFullYear()).slice(2)} ${String(dt.getMonth() + 1).padStart(2, '0')} ${String(dt.getDate()).padStart(2, '0')}`;
  if (p.date) {
    x.font = `bold ${m * 0.035}px ui-monospace, Menlo, monospace`;
    x.textAlign = 'right';
    x.fillStyle = '#ff8a1e';
    x.shadowColor = '#ff5a00';
    x.shadowBlur = m * 0.01;
    x.fillText(ds, w - m * 0.04, h - m * 0.04);
    x.shadowBlur = 0;
  }

  const F = {
    Plain: [0, 0, '#000'],
    White: [0.06, 0.06, '#f6f4ef'],
    Paper: [0.06, 0.15, '#ece4d2'],
    Black: [0.06, 0.06, '#0b0b0b'],
    Negative: [0.07, 0.07, '#141210'],
    Specs: [0.04, 0.16, '#f7f7f5'],
    Polaroid: [0.05, 0.24, '#fcfbf8'],
    Filmstrip: [0.1, 0.1, '#0f0f11']
  }[p.frame];

  const pd = F[0] * m, bt = F[1] * m;
  if (!pd && !bt) return ph;

  const o = document.createElement('canvas');
  o.width = w + 2 * pd;
  o.height = h + pd + bt;
  const c = o.getContext('2d');
  c.fillStyle = F[2];
  c.fillRect(0, 0, o.width, o.height);
  c.drawImage(ph, pd, pd);

  c.textAlign = 'left';
  const ttl = (p.title || '').toUpperCase();
  const spc = (p.specs || `${(w * h / 1e6).toFixed(0)}MP · ${w}×${h} · ${p.look}`).toUpperCase();
  const mono = 'ui-monospace, Menlo, monospace';
  const bot = h + pd;

  if (p.frame === 'Paper') {
    const ty = bot + bt * 0.45;
    c.fillStyle = '#1c1c1f';
    c.font = `700 ${m * 0.03}px -apple-system, Georgia, serif`;
    c.fillText(ttl, pd, ty);
    c.fillStyle = '#6b7280';
    c.font = `${m * 0.017}px ${mono}`;
    c.fillText(`${spc}  ·  ${ds}`, pd, ty + m * 0.045);
  }
  if (p.frame === 'Polaroid') {
    const ty = bot + bt * 0.42;
    c.fillStyle = '#2a2a2e';
    c.font = `italic 600 ${m * 0.036}px -apple-system, sans-serif`;
    c.fillText(p.title || 'Framed', pd + m * 0.01, ty);
    c.fillStyle = '#8f949e';
    c.font = `${m * 0.016}px ${mono}`;
    c.fillText(`${spc}  ·  ${ds}`, pd + m * 0.012, ty + m * 0.07);
  }
  if (p.frame === 'Specs') {
    c.fillStyle = '#111';
    c.font = `bold ${m * 0.028}px ${mono}`;
    c.fillText(`${p.look.toUpperCase()}  ·  ${(w * h / 1e6).toFixed(0)}MP`, pd, h + pd + m * 0.06);
    c.font = `${m * 0.022}px ${mono}`;
    c.fillStyle = '#666';
    c.fillText(`${w}×${h}  ·  ${dt.toDateString()}`, pd, h + pd + m * 0.1);
  }
  if (p.frame === 'Filmstrip') {
    const hw = m * 0.035, hh = m * 0.05, st = m * 0.07, hy = (pd - hh) / 2;
    c.fillStyle = '#2a2a30';
    for (let X = m * 0.02; X < o.width - m * 0.04; X += st) {
      c.fillRect(X, hy * 0.6, hw, hh);
      c.fillRect(X, o.height - hy * 0.6 - hh, hw, hh);
    }
    c.fillStyle = '#e2a842';
    c.font = `600 ${m * 0.016}px ${mono}`;
    c.fillText(`KODAK 5074 // ${p.look.toUpperCase()} // DX-35`, pd, pd - m * 0.012);
    c.fillStyle = '#f3f4f6';
    c.font = `700 ${m * 0.02}px ${mono}`;
    c.fillText(ttl, pd, bot + m * 0.03);
    c.fillStyle = '#e2a842';
    c.font = `${m * 0.014}px ${mono}`;
    c.textAlign = 'right';
    c.fillText(spc, o.width - pd, bot + m * 0.03);
  }
  if (p.frame === 'Negative') {
    c.fillStyle = '#2a2622';
    for (let i = 0; i < o.width / (m * 0.06); i++) {
      c.fillRect(i * m * 0.06 + m * 0.02, m * 0.02, m * 0.03, m * 0.03);
      c.fillRect(i * m * 0.06 + m * 0.02, o.height - m * 0.05, m * 0.03, m * 0.03);
    }
    c.fillStyle = '#ff9a2e';
    c.font = `${m * 0.022}px ${mono}`;
    c.fillText(`FRAMED 400   ▸ ${String(Math.floor(rr() * 36) + 1).padStart(2, '0')}`, pd, o.height - m * 0.058);
  }

  return o;
}

$('#back').onclick = () => {
  $('#ed').hidden = true;
  $('#cam').hidden = false;
  src = small = null;
};

$('#save').onclick = async () => {
  $('#busy-label').textContent = 'Rendering Full Resolution...';
  $('#busy').hidden = false;
  await tick();
  const o = render(src, p);
  o.toBlob(async b => {
    const f = new File([b], `framed-${Date.now()}.jpg`, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try {
        await navigator.share({ files: [f] });
      } catch(e) {}
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = f.name;
      a.click();
    }
    $('#info').textContent = `Exported ${o.width}×${o.height}`;
    $('#busy').hidden = true;
  }, 'image/jpeg', 0.96);
};

/* Immediately execute camera and start background processes */
start();
loadTFModel();
runAICoach();

// Fallback touch event if iOS requires direct tap
window.addEventListener('touchstart', () => {
  if (!stream || v.paused) {
    start();
  }
}, { passive: true });

/* Offline Cache ServiceWorker */
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'framed-app-v4';
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./'])));
      self.skipWaiting();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
    });
  `;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], { type: 'application/javascript' }))).catch(() => {});
}
</script>
