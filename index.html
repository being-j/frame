<!DOCTYPE html>

<title>Frame — Aesthetic Camera</title>
<style>

:root[data-theme="dark"]{--bg:#0c0c0d;--fg:#f2f0ea;--mut:#8c8a85;--acc:#ffb347;--pan:#1a1a1d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

[hidden]{display:none!important}

.row{display:flex;gap:8px;align-items:center;justify-content:center;padding:8px 12px;flex-wrap:wrap}

#stage{position:relative;flex:none;background:var(--stage);border-radius:14px;overflow:hidden}
video,#ov{position:absolute;inset:0;width:100%;height:100%}
video{object-fit:cover}
#hint{position:absolute;left:0;right:0;top:10px;text-align:center;color:#fff;font-size:14px;font-weight:600;text-shadow:0 1px 4px #000;pointer-events:none;padding:0 12px}

</style></head><body>

  <button id="auto">✦ Scan</button>

</section>
<section id="ed" hidden>
 <div id="pvw"><canvas id="pv"></canvas></div>
 <div class="row" id="tabs"></div>
 <div id="panel"></div>

</section>

<input type="file" id="f1" accept="image/*" hidden>

<script>
const $=s=>document.querySelector(s), RAT={'3:4':3/4,'4:5':4/5,'1:1':1,'9:16':9/16};

/* ---------- camera ---------- */
const topBar=$('#top');

  $('#zm').parentNode.style.opacity=c.zoom?1:.4;if(c.zoom){$('#zm').min=c.zoom.min;$('#zm').max=Math.min(c.zoom.max,8)}
  tb.style.display=c.torch?'':'none';
  }catch(e){$('#hint').textContent='Camera blocked here. Open the link directly, or use Photos / 24MP.'}
}
$('#zm').oninput=e=>track&&track.applyConstraints({advanced:[{zoom:+e.target.value}]}).catch(()=>{});
$('#ex').oninput=e=>{camExp=+e.target.value;const c=track&&track.getCapabilities?track.getCapabilities():{};if(c.exposureCompensation){track.applyConstraints({advanced:[{exposureCompensation:camExp}]}).catch(()=>{});camExp=0}else v.style.filter=`brightness(${Math.pow(2,camExp/2)})`};

function size(){const d=devicePixelRatio||1;ov.width=stage.clientWidth*d;ov.height=stage.clientHeight*d}
function fit(){const w=$('#wrap'),a=RAT[ratio],W=w.clientWidth-16,H=w.clientHeight;if(W<=0||H<=0)return;let sw=W,sh=W/a;if(sh>H){sh=H;sw=H*a}stage.style.width=sw+'px';stage.style.height=sh+'px';size();draw()}
new ResizeObserver(fit).observe($('#wrap'));fit();
function draw(){setAutoUI();const x=ov.getContext('2d'),W=ov.width,H=ov.height;x.clearRect(0,0,W,H);x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=1;x.beginPath();for(let i=1;i<3;i++){x.moveTo(W*i/3,0);x.lineTo(W*i/3,H);x.moveTo(0,H*i/3);x.lineTo(W,H*i/3)}x.stroke();
 if(frame){const s=frame.s,l=(frame.cx-s/2)*W,t=(frame.cy-s/2)*H,w=s*W,h=s*H;x.fillStyle='rgba(0,0,0,.45)';x.beginPath();x.rect(0,0,W,H);x.rect(l,t,w,h);x.fill('evenodd');x.strokeStyle=autoOn?(stable>=2?'#34c759':'#ffd60a'):'#fff';x.lineWidth=3;x.strokeRect(l,t,w,h)}drawLevel(x,W,H);extra2(x,W,H)}
let dp=null;
ov.onpointerdown=e=>{if(!drawMode)return;const r=ov.getBoundingClientRect();dp={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};frame={cx:dp.x,cy:dp.y,s:.25};ov.setPointerCapture(e.pointerId);draw()};
ov.onpointermove=e=>{if(!dp)return;const r=ov.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;const s=Math.min(1,Math.max(.25,2*Math.max(Math.abs(x-dp.x),Math.abs(y-dp.y))));frame={cx:Math.min(1-s/2,Math.max(s/2,dp.x)),cy:Math.min(1-s/2,Math.max(s/2,dp.y)),s};draw()};

$('#drw').onclick=()=>{autoOn=false;$('#auto').classList.remove('on');drawMode=!drawMode;$('#drw').classList.toggle('on',drawMode);if(!drawMode)frame=null;$('#hint').textContent=drawMode?'Drag from the centre of the shot you want':'';$('#shut').classList.remove('lit');draw()};

/* scene analysis: contrast + colour saliency, rule-of-thirds placement */
function vis(){const vw=v.videoWidth,vh=v.videoHeight,a=RAT[ratio];let cw,ch;if(vw/vh>a){ch=vh;cw=vh*a}else{cw=vw;ch=vw/a}return{x:(vw-cw)/2,y:(vh-ch)/2,w:cw,h:ch}}
const tc=document.createElement('canvas');
function analyze(){if(!v.videoWidth)return null;const q=vis(),N=40,M=Math.round(N/RAT[ratio]);tc.width=N;tc.height=M;const x=tc.getContext('2d',{willReadFrequently:true});x.drawImage(v,q.x,q.y,q.w,q.h,0,0,N,M);const d=x.getImageData(0,0,N,M).data,L=new Float32Array(N*M);let mean=0;

 if(tot<=0)return{cx:.5,cy:.5,s:.9,sx:.5,sy:.5};mx/=tot*N;my/=tot*M;let vx=0,vy=0;for(let y=0;y<M;y++)for(let xx=0;xx<N;xx++){const w=Math.max(0,S[y*N+xx]-sm*1.2);vx+=w*(xx/N-mx)**2;vy+=w*(y/M-my)**2}

setInterval(()=>{if(1)return;const t=analyze();if(!t)return;

 frame=frame?{cx:frame.cx+(t.cx-frame.cx)*.6,cy:frame.cy+(t.cy-frame.cy)*.6,s:frame.s+(t.s-frame.s)*.6}:t;
 const z=1/t.s,dx=t.cx-.5,dy=t.cy-.5;let h=[];if(z>1.15)h.push(`Zoom ${z.toFixed(1)}×`);if(dx>.08)h.push('Pan right');if(dx<-.08)h.push('Pan left');if(dy>.08)h.push('Tilt down');if(dy<-.08)h.push('Tilt up');
 $('#hint').textContent=stable>=2?'Locked — shoot':h.join(' · ')||'Nice framing';$('#shut').classList.toggle('lit',stable>=2);draw()},450);

/* ---------- smart auto frame: object detection + guided framing ---------- */
let mp=null,subj=null,scanTimer=0,zoomDone=false;
const loadJS=s=>new Promise((r,j)=>{const e=document.createElement('script');e.src=s;e.onload=r;e.onerror=j;document.head.appendChild(e)});
const getModel=()=>mp||(mp=(async()=>{try{await loadJS('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');await loadJS('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js');return await cocoSsd.load({base:'lite_mobilenet_v2'})}catch(e){return null}})());

const dc=document.createElement('canvas');
async function findSubject(){const q=vis();if(!q.w)return null;const W=640,H=Math.round(W/RAT[ratio]);dc.width=W;dc.height=H;const x=dc.getContext('2d',{willReadFrequently:true});x.drawImage(v,q.x,q.y,q.w,q.h,0,0,W,H);let best=null;const m=await getModel();
 if(m){try{const ds=await m.detect(dc,10,.35);let bs=0;for(const o of ds){const[bx,by,bw,bh]=o.bbox,cx=(bx+bw/2)/W,cy=(by+bh/2)/H,ar=bw*bh/(W*H),sc=o.score*(.5+Math.min(ar,.5))*(1.3-Math.hypot(cx-.5,cy-.5))*(o.class==='person'?1.5:1);if(sc>bs&&ar>.02){bs=sc;best={x:bx/W,y:by/H,w:bw/W,h:bh/H,cls:o.class}}}}catch(e){}}
 if(!best){const t=analyze();if(!t)return null;const hw=Math.min(.9,t.s*.8);best={x:Math.max(0,t.sx-hw/2),y:Math.max(0,t.sy-hw/2),w:hw,h:hw,cls:null}}
 const px=x.getImageData(Math.max(0,best.x*W|0),Math.max(0,best.y*H|0),Math.max(1,Math.min(W-1,best.w*W|0)),Math.max(1,Math.min(H-1,best.h*H|0))).data;let r=0,g=0,b=0,n=0;for(let i=0;i<px.length;i+=16){r+=px[i];g+=px[i+1];b+=px[i+2];n++}
 best.label=cname(r/n,g/n,b/n)+' '+(best.cls||'subject');return best}
/* composition search: scores many candidate crops on a saliency map (boosted by detected objects) */
const sCv=document.createElement('canvas');
async function findFrame(){const q=vis();if(!q.w)return null;const a=RAT[ratio],W=480,H=Math.round(W/a);dc.width=W;dc.height=H;const x=dc.getContext('2d',{willReadFrequently:true});x.drawImage(v,q.x,q.y,q.w,q.h,0,0,W,H);
 const im=x.getImageData(0,0,W,H),d=im.data;let sum=0;for(let i=0;i<d.length;i+=16)sum+=d[i]*.299+d[i+1]*.587+d[i+2]*.114;const mean=sum/(d.length/16),gain=mean<90?Math.min(4,110/Math.max(mean,8)):1;
 if(gain>1.05){for(let i=0;i<d.length;i+=4){d[i]*=gain;d[i+1]*=gain;d[i+2]*=gain}x.putImageData(im,0,0)}
 const N=48,M=Math.round(N/a);sCv.width=N;sCv.height=M;const sx=sCv.getContext('2d',{willReadFrequently:true});sx.drawImage(dc,0,0,N,M);const p=sx.getImageData(0,0,N,M).data,L=new Float32Array(N*M);let ml=0;for(let i=0;i<N*M;i++){L[i]=.299*p[i*4]+.587*p[i*4+1]+.114*p[i*4+2];ml+=L[i]}ml/=N*M;
 const S=new Float32Array(N*M);for(let y=1;y<M-1;y++)for(let xx=1;xx<N-1;xx++){const i=y*N+xx,mx=Math.max(p[i*4],p[i*4+1],p[i*4+2]),mn=Math.min(p[i*4],p[i*4+1],p[i*4+2]),cx=xx/N-.5,cy=y/M-.5;S[i]=(Math.abs(L[i+1]-L[i-1])+Math.abs(L[i+N]-L[i-N])+(mx-mn)*.5+Math.abs(L[i]-ml)*.6)*(1-.5*(cx*cx+cy*cy))}
 let sm=0;for(let i=0;i<N*M;i++)sm+=S[i];sm/=N*M;for(let i=0;i<N*M;i++)S[i]=Math.max(0,S[i]-sm*.8);
 const m=await getModel();$('#det').textContent=m?' · detector on':' · detector offline (composition scan only)';
 let objs=[];if(m){try{objs=(await m.detect(dc,8,.3)).filter(o=>o.bbox[2]*o.bbox[3]>W*H*.02)}catch(e){}}
 for(const o of objs){const bx=o.bbox[0],by=o.bbox[1],bw=o.bbox[2],bh=o.bbox[3],x0=Math.max(0,bx/W*N|0),x1=Math.min(N,Math.ceil((bx+bw)/W*N)),y0=Math.max(0,by/H*M|0),y1=Math.min(M,Math.ceil((by+bh)/H*M)),w8=sm*2.5*o.score*(o.class==='person'?2:1);for(let yy=y0;yy<y1;yy++)for(let xx=x0;xx<x1;xx++)S[yy*N+xx]+=w8}
 const R=N+1,I=new Float64Array(R*(M+1)),IX=new Float64Array(I.length),IY=new Float64Array(I.length);
 for(let y=0;y<M;y++){let r=0,rx=0,ry=0;for(let xx=0;xx<N;xx++){const s=S[y*N+xx];r+=s;rx+=s*xx;ry+=s*y;I[(y+1)*R+xx+1]=I[y*R+xx+1]+r;IX[(y+1)*R+xx+1]=IX[y*R+xx+1]+rx;IY[(y+1)*R+xx+1]=IY[y*R+xx+1]+ry}}
 const box=(A,x0,y0,x1,y1)=>A[y1*R+x1]-A[y0*R+x1]-A[y1*R+x0]+A[y0*R+x0],tot=I[M*R+N]||1;let best=null,bs=-1e9;
 for(const s of[.4,.5,.6,.7,.8,.9,1])for(let cy=s/2;cy<=1-s/2+1e-6;cy+=.04)for(let cx=s/2;cx<=1-s/2+1e-6;cx+=.04){
  const x0=Math.round((cx-s/2)*N),x1=Math.round((cx+s/2)*N),y0=Math.round((cy-s/2)*M),y1=Math.round((cy+s/2)*M),ins=box(I,x0,y0,x1,y1);if(ins<=0)continue;

  const score=1.2*Math.min(1,fr/.65)+.9*Math.min(2.2,dens)/2.2-1.1*cut-1.0*dt;if(score>bs){bs=score;best={cx,cy,s}}}

 const avg=(bx,by,bw,bh)=>{bx=Math.max(0,bx|0);by=Math.max(0,by|0);const px=x.getImageData(bx,by,Math.max(1,Math.min(W-bx,bw|0)),Math.max(1,Math.min(H-by,bh|0))).data;let r=0,g=0,b=0,n=0;for(let i=0;i<px.length;i+=16){r+=px[i];g+=px[i+1];b+=px[i+2];n++}return cname(r/n/gain,g/n/gain,b/n/gain)};
 let label=null,lb=0;for(const o of objs){const ox=(o.bbox[0]+o.bbox[2]/2)/W,oy=(o.bbox[1]+o.bbox[3]/2)/H;if(Math.abs(ox-best.cx)<best.s/2&&Math.abs(oy-best.cy)<best.s/2){const k=o.score*o.bbox[2]*o.bbox[3];if(k>lb){lb=k;label=avg(o.bbox[0],o.bbox[1],o.bbox[2],o.bbox[3])+' '+o.class}}}
