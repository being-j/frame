<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Framed Studio">
  <title>Framed — Aesthetic Studio</title>
  <style>
    :root {
      --bg: #0c0c0d;
      --fg: #f2f0ea;
      --mut: #8c8a85;
      --acc: #ffb347;
      --pan: #1a1a1d;
      --stage: #000;
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    section {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--bg);
      transition: opacity 0.2s ease;
    }
    [hidden] { display: none !important; }
    
    button {
      font: inherit;
      color: inherit;
      background: var(--pan);
      border: 0;
      border-radius: 999px;
      padding: 7px 14px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      transition: background 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.96); }
    button.on { background: var(--acc); color: #111; font-weight: 600; }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      flex-wrap: wrap;
    }

    #wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
    }
    #stage {
      position: relative;
      flex: none;
      background: var(--stage);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    video, #ov {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    video { object-fit: cover; }
    #hint {
      position: absolute;
      left: 0;
      right: 0;
      top: 12px;
      text-align: center;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      padding: 0 16px;
      z-index: 10;
    }

    /* Live Controls Bar */
    #tools {
      display: flex;
      gap: 16px;
      padding: 6px 20px;
    }
    #tools label {
      flex: 1;
      font-size: 11px;
      color: var(--mut);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    input[type=range] {
      accent-color: var(--acc);
      width: 100%;
      height: 4px;
      border-radius: 2px;
      outline: none;
    }

    #info-bar {
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
    }
    small {
      color: var(--mut);
      font-size: 11px;
      font-family: ui-monospace, Menlo, monospace;
    }

    #bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 10px 14px 18px;
    }
    #shut {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid var(--bg);
      outline: 3px solid var(--fg);
      padding: 0;
      cursor: pointer;
      transition: outline-color 0.2s, box-shadow 0.2s;
    }
    #shut.lit {
      outline-color: var(--acc);
      box-shadow: 0 0 20px var(--acc);
    }
    #shut:active {
      transform: scale(0.92);
      background: var(--acc);
    }

    /* EDITOR VIEW */
    #pvw {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: #09090b;
    }
    #pv {
      max-width: 100%;
      max-height: 100%;
      border-radius: 4px;
      box-shadow: 0 6px 30px rgba(0,0,0,0.8);
    }
    #panel {
      height: 200px;
      overflow-y: auto;
      padding: 8px 16px;
      background: var(--bg);
    }
    .sl {
      display: grid;
      grid-template-columns: 88px 1fr 36px;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--mut);
      margin: 8px 0;
    }
    .sl span:last-child {
      text-align: right;
      font-family: monospace;
      color: var(--fg);
    }

    #busy {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 500;
      z-index: 99;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: var(--acc);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- VIEW 1: VIEWFINDER -->
<section id="cam">
  <div class="row" id="top"></div>

  <div id="wrap">
    <div id="stage">
      <video id="v" playsinline muted autoplay></video>
      <canvas id="ov"></canvas>
      <div id="hint"></div>
    </div>
  </div>

  <div id="tools">
    <label>Optical / Digital Zoom
      <input type="range" id="zm" min="1" max="5" step="0.1" value="1">
    </label>
    <label>Exposure EV
      <input type="range" id="ex" min="-2" max="2" step="0.1" value="0">
    </label>
  </div>

  <div id="info-bar">
    <small id="res">Resolving camera...</small>
    <small id="det">Offline Engine Ready</small>
  </div>

  <div id="bar">
    <button id="imp" title="Import photo from library">Photos</button>
    <button id="auto">✦ Scan</button>
    <button id="shut" aria-label="Take high resolution photo"></button>
    <button id="drw">Your frame</button>
    <button id="nat" title="Full uncompressed 24MP/48MP sensor capture" style="font-weight:700;color:var(--acc);">24MP</button>
  </div>
</section>

<!-- VIEW 2: PROFESSIONAL FILM LAB -->
<section id="ed" hidden>
  <div id="pvw"><canvas id="pv"></canvas></div>
  <div class="row" id="tabs"></div>
  <div id="panel"></div>
  <div class="row" style="border-top: 1px solid var(--pan); padding-top: 10px;">
    <button id="back">Retake</button>
    <small id="info" style="flex:1; text-align:center;"></small>
    <button id="save" class="on">Save Photo</button>
  </div>
</section>

<div id="busy" hidden>
  <div class="spinner"></div>
  <span>Developing high-res film...</span>
</div>

<input type="file" id="f1" accept="image/*" hidden>
<!-- Native hardware capture bypass: directly triggers iOS camera pipeline for 24MP/48MP files -->
<input type="file" id="f2" accept="image/*" capture="environment" hidden>

<script>
const $ = s => document.querySelector(s);
const RAT = { '3:4': 3/4, '4:5': 4/5, '1:1': 1, '3:2': 3/2, '9:16': 9/16, '65:24': 65/24 };
let ratio = '3:2', facing = 'environment', stream = null, track = null, imageCapture = null;
let frame = null, drawMode = false, autoOn = false, src = null, small = null, p = null;
let camExp = 0, prev = null, stable = 0, lastMP = 0;
const v = $('#v'), ov = $('#ov'), stage = $('#stage');
const tick = () => new Promise(r => setTimeout(r, 20));

/* Setup Touch Icon */
try {
  const ic = document.createElement('canvas');
  ic.width = ic.height = 180;
  const x = ic.getContext('2d');
  x.fillStyle = '#0c0c0d';
  x.fillRect(0,0,180,180);
  x.strokeStyle = '#ffb347';
  x.lineWidth = 10;
  x.strokeRect(36,36,108,108);
  const l = document.createElement('link');
  l.rel = 'apple-touch-icon';
  l.href = ic.toDataURL();
  document.head.appendChild(l);
} catch(e){}

/* ---------- CAMERA SETUP ---------- */
const topBar = $('#top');
Object.keys(RAT).forEach(k => {
  const b = document.createElement('button');
  b.textContent = k;
  b.className = k === ratio ? 'on' : '';
  b.onclick = () => {
    ratio = k;
    fit();
    [...topBar.children].forEach(c => {
      if (RAT[c.textContent] !== undefined) c.classList.toggle('on', c.textContent === k);
    });
    frame = null;
    size();
    draw();
  };
  topBar.appendChild(b);
});

const fl = document.createElement('button');
fl.textContent = 'Flip';
fl.onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; start(); };
topBar.appendChild(fl);

const tb = document.createElement('button');
tb.textContent = 'Torch';
topBar.appendChild(tb);

async function start() {
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: facing,
        width: { ideal: 4032, max: 8192 },
        height: { ideal: 3024, max: 6144 }
      },
      audio: false
    });
    v.srcObject = stream;
    track = stream.getVideoTracks()[0];
    if (window.ImageCapture) {
      imageCapture = new ImageCapture(track);
    }
    const c = track.getCapabilities ? track.getCapabilities() : {};
    const s = track.getSettings ? track.getSettings() : {};
    lastMP = ((s.width * s.height) / 1e6) || 0;
    $('#res').textContent = `Sensor: ${s.width || 'Native'}×${s.height || ''} (${lastMP ? lastMP.toFixed(1) + 'MP' : 'Live'})`;
    
    $('#zm').parentNode.style.opacity = c.zoom ? 1 : 0.6;
    if (c.zoom) {
      $('#zm').min = c.zoom.min;
      $('#zm').max = Math.min(c.zoom.max, 8);
    }
    tb.style.display = c.torch ? '' : 'none';
  } catch (e) {
    $('#hint').textContent = 'Camera permission required or preview active in another app.';
  }
}

$('#zm').oninput = e => {
  const val = +e.target.value;
  if (track && track.getCapabilities && track.getCapabilities().zoom) {
    track.applyConstraints({ advanced: [{ zoom: val }] }).catch(() => {});
  } else {
    v.style.transform = `scale(${val})`;
  }
};

$('#ex').oninput = e => {
  camExp = +e.target.value;
  const c = track && track.getCapabilities ? track.getCapabilities() : {};
  if (c.exposureCompensation) {
    track.applyConstraints({ advanced: [{ exposureCompensation: camExp }] }).catch(() => {});
    camExp = 0;
  } else {
    v.style.filter = `brightness(${Math.pow(2, camExp / 2)})`;
  }
};

let torch = false;
tb.onclick = () => {
  torch = !torch;
  tb.classList.toggle('on', torch);
  if (track) track.applyConstraints({ advanced: [{ torch }] }).catch(() => {});
};

function size() {
  const d = devicePixelRatio || 1;
  ov.width = stage.clientWidth * d;
  ov.height = stage.clientHeight * d;
}

function fit() {
  const w = $('#wrap'), a = RAT[ratio];
  const W = w.clientWidth - 16, H = w.clientHeight;
  if (W <= 0 || H <= 0) return;
  let sw = W, sh = W / a;
  if (sh > H) {
    sh = H;
    sw = H * a;
  }
  stage.style.width = sw + 'px';
  stage.style.height = sh + 'px';
  size();
  draw();
}
new ResizeObserver(fit).observe($('#wrap'));
fit();

/* Horizon Level (Device Orientation) */
let lvlOn = false, lvlAng = 0, lvlRaf = 0;
{
  const lb = document.createElement('button');
  lb.textContent = 'Level';
  lb.onclick = async () => {
    lvlOn = !lvlOn;
    lb.classList.toggle('on', lvlOn);
    if (lvlOn && window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) {
      try {
        if (await DeviceOrientationEvent.requestPermission() !== 'granted') {
          lvlOn = false;
          lb.classList.remove('on');
        }
      } catch(e) {}
    }
    draw();
  };
  topBar.appendChild(lb);
}
window.addEventListener('deviceorientation', e => {
  if (!lvlOn) return;
  lvlAng = Math.max(-45, Math.min(45, e.gamma || 0));
  cancelAnimationFrame(lvlRaf);
  lvlRaf = requestAnimationFrame(draw);
});

function drawLevel(x, W, H) {
  if (!lvlOn) return;
  const d = Math.max(1, W / 400), ok = Math.abs(lvlAng) < 1;
  x.save();
  x.translate(W / 2, H / 2);
  x.rotate(-lvlAng * Math.PI / 180);
  x.strokeStyle = ok ? '#34c759' : 'rgba(255,255,255,.75)';
  x.lineWidth = 2.5 * d;
  x.beginPath();
  x.moveTo(-W * 0.24, 0); x.lineTo(-W * 0.07, 0);
  x.moveTo(W * 0.07, 0);  x.lineTo(W * 0.24, 0);
  x.stroke();
  x.restore();
}

/* Viewfinder Overlay Drawing */
function draw() {
  setAutoUI();
  const x = ov.getContext('2d'), W = ov.width, H = ov.height;
  x.clearRect(0, 0, W, H);

  // Rule-of-thirds grid
  x.strokeStyle = 'rgba(255, 255, 255, 0.35)';
  x.lineWidth = 1;
  x.beginPath();
  for (let i = 1; i < 3; i++) {
    x.moveTo(W * i / 3, 0); x.lineTo(W * i / 3, H);
    x.moveTo(0, H * i / 3); x.lineTo(W, H * i / 3);
  }
  x.stroke();

  // Framing box & Matte
  if (frame) {
    const s = frame.s, l = (frame.cx - s / 2) * W, t = (frame.cy - s / 2) * H, w = s * W, h = s * H;
    x.fillStyle = 'rgba(0, 0, 0, 0.45)';
    x.beginPath();
    x.rect(0, 0, W, H);
    x.rect(l, t, w, h);
    x.fill('evenodd');

    x.strokeStyle = autoOn ? (stable >= 2 ? '#34c759' : '#ffd60a') : '#fff';
    x.lineWidth = 3;
    x.strokeRect(l, t, w, h);
  }

  drawLevel(x, W, H);
  extraOverlay(x, W, H);
}

/* User Custom Touch Framing */
let dp = null;
ov.onpointerdown = e => {
  if (!drawMode) return;
  const r = ov.getBoundingClientRect();
  dp = { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
  frame = { cx: dp.x, cy: dp.y, s: 0.25 };
  ov.setPointerCapture(e.pointerId);
  draw();
};
ov.onpointermove = e => {
  if (!dp) return;
  const r = ov.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;
  const y = (e.clientY - r.top) / r.height;
  const s = Math.min(1, Math.max(0.25, 2 * Math.max(Math.abs(x - dp.x), Math.abs(y - dp.y))));
  frame = {
    cx: Math.min(1 - s / 2, Math.max(s / 2, dp.x)),
    cy: Math.min(1 - s / 2, Math.max(s / 2, dp.y)),
    s
  };
  draw();
};
ov.onpointerup = () => { dp = null; };

$('#drw').onclick = () => {
  autoOn = false;
  $('#auto').classList.remove('on');
  drawMode = !drawMode;
  $('#drw').classList.toggle('on', drawMode);
  if (!drawMode) frame = null;
  $('#hint').textContent = drawMode ? 'Drag from the centre of the subject you want' : '';
  $('#shut').classList.remove('lit');
  draw();
};

/* ---------- 100% OFFLINE SMART AUTO-FRAMING ENGINE ---------- */
function vis() {
  const vw = v.videoWidth, vh = v.videoHeight, a = RAT[ratio];
  let cw, ch;
  if (vw / vh > a) {
    ch = vh;
    cw = vh * a;
  } else {
    cw = vw;
    ch = vw / a;
  }
  return { x: (vw - cw) / 2, y: (vh - ch) / 2, w: cw, h: ch };
}

const dc = document.createElement('canvas');
const sCv = document.createElement('canvas');

function cname(r, g, b) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 510, d = mx - mn;
  if (d < 28) return l < 0.2 ? 'dark' : l > 0.75 ? 'bright' : 'grey';
  let h = mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  h *= 60;
  const n = h < 18 || h >= 340 ? 'red' : h < 42 ? 'warm' : h < 75 ? 'yellow' : h < 165 ? 'green' : h < 255 ? 'blue' : 'violet';
  return n;
}

// Pure on-device gradient & chroma contrast saliency tracker (Zero network / Zero latency)
async function findSubjectOffline() {
  const q = vis();
  if (!q.w) return null;
  const a = RAT[ratio], W = 360, H = Math.round(W / a);
  dc.width = W; dc.height = H;
  const x = dc.getContext('2d', { willReadFrequently: true });
  x.drawImage(v, q.x, q.y, q.w, q.h, 0, 0, W, H);

  const N = 36, M = Math.round(N / a), n = N * M;
  sCv.width = N; sCv.height = M;
  const sx = sCv.getContext('2d', { willReadFrequently: true });
  sx.drawImage(dc, 0, 0, N, M);
  const p = sx.getImageData(0, 0, N, M).data;

  const Y = new Float32Array(n), B = new Float32Array(n), Rr = new Float32Array(n);
  let my = 0, mb = 0, mr = 0;
  for (let i = 0; i < n; i++) {
    const r = p[i * 4], g = p[i * 4 + 1], b = p[i * 4 + 2];
    Y[i] = 0.299 * r + 0.587 * g + 0.114 * b;
    B[i] = b - Y[i];
    Rr[i] = r - Y[i];
    my += Y[i]; mb += B[i]; mr += Rr[i];
  }
  my /= n; mb /= n; mr /= n;

  const S = new Float32Array(n);
  let mx = 0;
  for (let i = 0; i < n; i++) {
    const xx = (i % N) / N - 0.5, yy = (i / N | 0) / M - 0.5;
    S[i] = Math.sqrt(0.6 * (Y[i] - my)**2 + 1.5 * (B[i] - mb)**2 + 1.5 * (Rr[i] - mr)**2) * (1 - 0.5 * (xx * xx + yy * yy));
    if (S[i] > mx) mx = S[i];
  }

  let ms = 0;
  for (let i = 0; i < n; i++) { S[i] /= (mx || 1); ms += S[i]; }
  ms /= n;

  let sumX = 0, sumY = 0, tot = 0;
  for (let y = 0; y < M; y++) {
    for (let xx = 0; xx < N; xx++) {
      const idx = y * N + xx;
      const w = Math.max(0, S[idx] - ms * 1.2);
      tot += w;
      sumX += w * xx;
      sumY += w * y;
    }
  }

  if (tot <= 0) return null;
  const cx = (sumX / tot) / N;
  const cy = (sumY / tot) / M;
  const s = 0.65;
  const ux = cx < 0.5 ? 1/3 : 2/3;
  const uy = cy < 0.5 ? 1/3 : 2/3;

  return {
    x: Math.max(0, cx - s / 2),
    y: Math.max(0, cy - s / 2),
    w: s, h: s,
    label: 'subject',
    t: { cx: Math.min(1 - s / 2, Math.max(s / 2, cx - (ux - 0.5) * s)), cy: Math.min(1 - s / 2, Math.max(s / 2, cy - (uy - 0.5) * s)), s },
    sub: { x: cx - 0.15, y: cy - 0.15, w: 0.3, h: 0.3 }
  };
}

let scanTimer = 0, phase = 0, ctr = 0, subj = null;
function setAutoUI() {
  const b = $('#auto');
  b.textContent = !autoOn ? '✦ Scan' : stable >= 2 ? '↻ Rescan' : '✕ Cancel';
  b.classList.toggle('on', autoOn);
}
function stopAuto() {
  phase = 0; ctr = 0;
  v.style.transform = '';
  autoOn = false;
  clearTimeout(scanTimer);
  subj = null; frame = null; stable = 0; prev = null;
  $('#hint').textContent = '';
  $('#shut').classList.remove('lit');
  draw();
}
$('#auto').onclick = () => {
  const was = autoOn, lk = stable >= 2;
  stopAuto();
  if (was && !lk) return;
  drawMode = false;
  $('#drw').classList.remove('on');
  autoOn = true;
  $('#hint').textContent = 'Hold still · scanning subject…';
  $('#hint').style.color = '#ffd60a';
  draw();
  setTimeout(tickAutoScan, 500);
};

async function tickAutoScan() {
  if (!autoOn || phase === 2) return;
  const sb = await findSubjectOffline();
  if (!autoOn) return;

  if (!sb) {
    subj = null; ctr = 0;
    $('#hint').textContent = 'Adjust angle — scanning…';
    draw();
    scanTimer = setTimeout(tickAutoScan, 400);
    return;
  }

  const u = sb.sub, cx = u.x + u.w / 2, cy = u.y + u.h / 2;
  const dx = cx - 0.5, dy = cy - 0.5;
  subj = { x: u.x, y: u.y, w: u.w, h: u.h, label: sb.label, tx: cx, ty: cy };

  if (Math.hypot(dx, dy) > 0.12) {
    ctr = 0;
    $('#hint').textContent = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'Move camera right' : 'Move camera left') : (dy > 0 ? 'Move camera down' : 'Move camera up');
    $('#hint').style.color = '#ffd60a';
  } else {
    ctr++;
    $('#hint').textContent = 'Centered · locking composition…';
    $('#hint').style.color = '#ffd60a';
    if (ctr >= 2) {
      phase = 2;
      stable = 2;
      frame = sb.t;
      $('#hint').textContent = 'Golden Framing Locked — Shoot';
      $('#hint').style.color = '#34c759';
      $('#shut').classList.add('lit');
      draw();
      return;
    }
  }
  draw();
  scanTimer = setTimeout(tickAutoScan, 380);
}

function extraOverlay(x, W, H) {
  if (!autoOn || !subj) return;
  const lk = phase === 2, c = lk ? '#34c759' : '#ffd60a', d = Math.max(1, W / 400);
  x.strokeStyle = c;
  x.lineWidth = 2.5 * d;

  if (!lk) {
    const bx = subj.x * W, by = subj.y * H, bw = subj.w * W, bh = subj.h * H;
    x.strokeRect(bx, by, bw, bh);
    x.setLineDash([8 * d, 8 * d]);
    x.beginPath();
    x.moveTo(W / 2, H / 2);
    x.lineTo(subj.tx * W, subj.ty * H);
    x.stroke();
    x.setLineDash([]);
  }

  // Crosshairs
  x.beginPath();
  x.moveTo(W / 2 - 12 * d, H / 2); x.lineTo(W / 2 + 12 * d, H / 2);
  x.moveTo(W / 2, H / 2 - 12 * d); x.lineTo(W / 2, H / 2 + 12 * d);
  x.stroke();
}

/* ---------- FULL RESOLUTION SHUTTER & FILE CAPTURE ---------- */
$('#shut').onclick = async () => {
  if (!v.videoWidth) return;
  $('#busy').hidden = false;
  await tick();

  let capturedCanvas = null;

  // 1. First priority: ImageCapture API for native sensor resolution
  if (imageCapture) {
    try {
      const blob = await imageCapture.takePhoto();
      const bm = await createImageBitmap(blob);
      capturedCanvas = document.createElement('canvas');
      capturedCanvas.width = bm.width;
      capturedCanvas.height = bm.height;
      capturedCanvas.getContext('2d').drawImage(bm, 0, 0);
    } catch(e) {
      console.warn("takePhoto fallback:", e);
    }
  }

  // 2. High-res Track Settings Buffer fallback
  if (!capturedCanvas) {
    const s = track ? track.getSettings() : {};
    const fullW = (s && s.width) || v.videoWidth || 3840;
    const fullH = (s && s.height) || v.videoHeight || 2160;

    capturedCanvas = document.createElement('canvas');
    capturedCanvas.width = fullW;
    capturedCanvas.height = fullH;
    capturedCanvas.getContext('2d').drawImage(v, 0, 0, fullW, fullH);
  }

  // Apply aspect ratio crop and user frame if active
  const q = { x: 0, y: 0, w: capturedCanvas.width, h: capturedCanvas.height };
  const targetAspect = RAT[ratio];
  let cw = q.w, ch = q.h;
  if (cw / ch > targetAspect) {
    cw = ch * targetAspect;
  } else {
    ch = cw / targetAspect;
  }
  let cropX = (q.w - cw) / 2;
  let cropY = (q.h - ch) / 2;

  if (frame) {
    cropX += (frame.cx - frame.s / 2) * cw;
    cropY += (frame.cy - frame.s / 2) * ch;
    cw *= frame.s;
    ch *= frame.s;
  }

  const finalC = document.createElement('canvas');
  finalC.width = Math.round(cw);
  finalC.height = Math.round(ch);
  finalC.getContext('2d').drawImage(capturedCanvas, cropX, cropY, cw, ch, 0, 0, finalC.width, finalC.height);

  $('#busy').hidden = true;
  edit(finalC, camExp);
};

};

const LOOKS = {

  TRIX: { mono: true, exposure: -4, contrast: 36, grain: 58, vignette: 16 },
  CINESTILL: { temp: -16, tint: 4, contrast: 18, sat: 6, grain: 38, glow: 45, vignette: 12 },
  SUPERIA: { exposure: 8, temp: 4, tint: -8, contrast: 20, sat: 20, grain: 32 },
  KODACHROME: { exposure: -8, temp: 20, contrast: 28, sat: 22, grain: 24, vignette: 10 }
};

const TABS = {

  Frame: null
};

const FRAMES = ['Paper', 'Polaroid', 'Filmstrip', 'Negative', 'Specs', 'Plain', 'White', 'Black'];

/* 9-Point Monotone Cubic Spline Curves */
function curveLUT(P) {
  const n = P.length, x = P.map(a => a[0]), y = P.map(a => a[1]);
  const dx = [], m = [], t = new Array(n);
  for (let i = 0; i < n - 1; i++) {
    dx[i] = x[i + 1] - x[i];
    m[i] = (y[i + 1] - y[i]) / dx[i];
  }
  t[0] = m[0];
  t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) {
    t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  }
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) {
      t[i] = t[i + 1] = 0;
    } else {
      const a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b;
      if (s > 9) {
        const k = 3 / Math.sqrt(s);
        t[i] = k * a * m[i];
        t[i + 1] = k * b * m[i];
      }
    }
  }
  const L = new Uint8Array(256);
  let j = 0;
  for (let v = 0; v < 256; v++) {
    const X = v / 255;
    while (j < n - 2 && X > x[j + 1]) j++;
    const h = dx[j], u = (X - x[j]) / h;
    const u2 = u * u, u3 = u2 * u;
    const Y = (2 * u3 - 3 * u2 + 1) * y[j] + (u3 - 2 * u2 + u) * h * t[j] + (-2 * u3 + 3 * u2) * y[j + 1] + (u3 - u2) * h * t[j + 1];
    L[v] = Math.round(Math.min(1, Math.max(0, Y)) * 255);
  }
  return L;
}

function buildCurves(p) {
  const c = p.curves;
  if (!c) return null;
  const isId = a => a.every(q => Math.abs(q[0] - q[1]) < 0.002);
  if (isId(c.m) && isId(c.r) && isId(c.g) && isId(c.b)) return null;
  const M = curveLUT(c.m);
  const mk = a => {
    const L = curveLUT(a), O = new Uint8Array(256);
    for (let i = 0; i < 256; i++) O[i] = M[L[i]];
    return O;
  };
  return [mk(c.r), mk(c.g), mk(c.b)];
}

/* 8-Channel HSL Mixer */
const BC = [0, 30, 60, 120, 180, 225, 270, 320];
let hR = 0, hG = 0, hB = 0;
function hslActive(p) { return !!(p.hsl && p.hsl.some(a => a[0] || a[1] || a[2])); }
function hslApply(r, g, b, H) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, l = (mx + mn) / 2;
  if (d < 0.02) { hR = r; hG = g; hB = b; return; }
  const s = d / (1 - Math.abs(2 * l - 1) || 1e-6);
  let h = (mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60;
  let dh = 0, ds = 0, dl = 0;
  for (let k = 0; k < 8; k++) {
    let a = Math.abs(h - BC[k]);
    if (a > 180) a = 360 - a;
    const w = 1 - a / 45;
    if (w > 0) { dh += w * H[k][0]; ds += w * H[k][1]; dl += w * H[k][2]; }
  }
  const k2 = Math.min(1, s * 3);
  h = (h + dh * 0.3 * k2 + 360) % 360;
  const s2 = Math.min(1, Math.max(0, s * (1 + ds / 100 * k2)));
  const l2 = Math.min(1, Math.max(0, l + dl / 200 * k2));
  const c = (1 - Math.abs(2 * l2 - 1)) * s2;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l2 - c / 2;
  const q = h / 60 | 0;
  let R = 0, G = 0, B = 0;
  if (q === 0) { R = c; G = x; }
  else if (q === 1) { R = x; G = c; }
  else if (q === 2) { G = c; B = x; }
  else if (q === 3) { G = x; B = c; }
  else if (q === 4) { R = x; B = c; }
  else { R = c; B = x; }
  hR = R + m; hG = G + m; hB = B + m;
}

let hk = 0, cch = 'm';
const HC = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#14b8a6', '#3b82f6', '#8b5cf6', '#d946ef'];
const CCOL = { m: '#e8e6e0', r: '#ef4444', g: '#22c55e', b: '#3b82f6' };
const idPts = () => Array.from({ length: 9 }, (_, i) => [i / 8, i / 8]);

function hslPanel(P) {
  p.hsl = p.hsl || HC.map(() => [0, 0, 0]);
  const r = document.createElement('div');
  r.className = 'row';
  HC.forEach((c, i) => {
    const b = document.createElement('button');
    b.style.cssText = `width:32px;height:32px;padding:0;background:${c};outline:${i === hk ? '3px solid var(--fg)' : 'none'};border-radius:50%;`;
    b.onclick = () => { hk = i; panel(); };
    r.appendChild(b);
  });
  P.appendChild(r);
  ['Hue', 'Saturation', 'Luminance'].forEach((n, j) => {
    const d = document.createElement('div');
    d.className = 'sl';
    const v = p.hsl[hk][j];
    d.innerHTML = `<span>${n}</span><input type="range" min="-100" max="100" value="${v}"><span>${v}</span>`;
    d.querySelector('input').oninput = e => {

      d.lastChild.textContent = e.target.value;
      paint();
    };
    P.appendChild(d);
  });
}

function curvePanel(P) {
  p.curves = p.curves || { m: idPts(), r: idPts(), g: idPts(), b: idPts() };
  const S = 150, dpr = devicePixelRatio || 1;
  const w = document.createElement('div');
  w.style.cssText = 'display:flex;gap:14px;align-items:center;justify-content:center;';

  const cv = document.createElement('canvas');
  cv.width = cv.height = S * dpr;
  cv.style.cssText = `width:${S}px;height:${S}px;border-radius:10px;background:var(--pan);touch-action:none;`;

  const dr = () => {
    const x = cv.getContext('2d');
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.clearRect(0, 0, S, S);
    x.strokeStyle = 'rgba(128,128,128,.3)';
    x.lineWidth = 1;
    x.beginPath();
    for (let i = 1; i < 4; i++) {
      x.moveTo(S * i / 4, 0); x.lineTo(S * i / 4, S);
      x.moveTo(0, S * i / 4); x.lineTo(S, S * i / 4);
    }
    x.stroke();

    const pts = p.curves[cch], L = curveLUT(pts);
    x.strokeStyle = CCOL[cch];
    x.lineWidth = 2.5;
    x.beginPath();
    for (let v = 0; v < 256; v++) {
      const X = v / 255 * S, Y = S - L[v] / 255 * S;
      v ? x.lineTo(X, Y) : x.moveTo(X, Y);
    }
    x.stroke();

    x.fillStyle = CCOL[cch];
    pts.forEach(q => {
      x.beginPath();
      x.arc(q[0] * S, S - q[1] * S, 4.5, 0, 7);
      x.fill();
    });
  };

  let di = -1;
  const pos = e => {
    const r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height];
  };

  cv.onpointerdown = e => {
    const q = pos(e);
    di = Math.round(Math.min(1, Math.max(0, q[0])) * 8);
    cv.setPointerCapture(e.pointerId);
    p.curves[cch][di][1] = Math.min(1, Math.max(0, q[1]));
    dr();
    paint();
  };
  cv.onpointermove = e => {
    if (di < 0) return;
    p.curves[cch][di][1] = Math.min(1, Math.max(0, pos(e)[1]));
    dr();
    paint();
  };
  cv.onpointerup = () => { di = -1; };

  const col = document.createElement('div');
  col.style.cssText = 'display:flex;flex-direction:column;gap:6px;';
  [['m', 'RGB'], ['r', 'R'], ['g', 'G'], ['b', 'B']].forEach(([k, n]) => {
    const b = document.createElement('button');
    b.textContent = n;
    b.className = k === cch ? 'on' : '';
    b.onclick = () => { cch = k; panel(); };
    col.appendChild(b);
  });
  const rs = document.createElement('button');
  rs.textContent = 'Reset';
  rs.onclick = () => { p.curves = null; panel(); paint(); };
  col.appendChild(rs);

  w.appendChild(cv);
  w.appendChild(col);
  P.appendChild(w);
  dr();
}

function stampInputs(P) {

let tab = 'Looks', raf = 0;
function edit(c, expo) {

  const k = Math.min(1, 1400 / Math.max(c.width, c.height));

function tabs() {

      d.innerHTML = `<span>${n}</span><input type="range" min="${neg ? -100 : 0}" max="100" value="${p[k]}"><span>${Math.round(p[k])}</span>`;

function paint() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    const o = render(small, p);
    const pv = $('#pv');
    pv.width = o.width;
    pv.height = o.height;
    pv.getContext('2d').drawImage(o, 0, 0);
  });
}

function hash(x, y, s) {
  let n = Math.imul(x, 374761393) + Math.imul(y, 668265263) + s | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}

function render(sc, p) {
  const w = sc.width, h = sc.height, m = Math.min(w, h);
  const ph = document.createElement('canvas');
  ph.width = w; ph.height = h;
  const x = ph.getContext('2d', { willReadFrequently: true });
  x.drawImage(sc, 0, 0);

  const ex = Math.pow(2, p.exposure / 50);
  const ct = 1 + p.contrast / 100;
  const hi = p.highlights / 100;
  const sh = p.shadows / 100;
  const fd = p.fade / 100 * 0.14;
  const tw = p.temp / 100;
  const tn = p.tint / 100;
  const sa = 1 + p.sat / 100;
  const gr = p.grain / 100 * 0.22;
  const vg = p.vignette / 100;
  const bs = Math.max(0, Math.min(3, Math.round(Math.log2(w / 1200))));
  const sd = p.seed * 7919;

  const CV = buildCurves(p);
  const CR = CV && CV[0], CG = CV && CV[1], CB = CV && CV[2];
  const HS = hslActive(p);

  for (let y0 = 0; y0 < h; y0 += 256) {
    const hh = Math.min(256, h - y0);
    const im = x.getImageData(0, y0, w, hh);
    const d = im.data;

    for (let yy = 0; yy < hh; yy++) {
      const y = y0 + yy, dy = y / h - 0.5;
      for (let xx = 0; xx < w; xx++) {
        const i = (yy * w + xx) * 4;
        let r = d[i] / 255 * ex * (1 + tw * 0.18);
        let g = d[i + 1] / 255 * ex * (1 - tn * 0.12);
        let b = d[i + 2] / 255 * ex * (1 - tw * 0.18);
        let l = 0.299 * r + 0.587 * g + 0.114 * b;

        const a = sh * (1 - l)**2 * 0.35 + hi * l * l * 0.35;
        r += a; g += a; b += a;

        r = (r - 0.5) * ct + 0.5;
        g = (g - 0.5) * ct + 0.5;
        b = (b - 0.5) * ct + 0.5;

        r = fd + r * (1 - fd);
        g = fd + g * (1 - fd);
        b = fd + b * (1 - fd);
        l = 0.299 * r + 0.587 * g + 0.114 * b;

        if (p.mono) {
          r = g = b = l;
        } else {
          r = l + (r - l) * sa;
          g = l + (g - l) * sa;
          b = l + (b - l) * sa;
        }

        if (HS) {
          hslApply(r, g, b, p.hsl);
          r = hR; g = hG; b = hB;
        }

        const dx = xx / w - 0.5;
        const vf = 1 - vg * (dx * dx + dy * dy) * 2.2;
        const n = gr ? (hash(xx >> bs, y >> bs, sd) - 0.5) * gr * (1.1 - Math.abs(l - 0.5)) : 0;

        d[i] = (r * vf + n) * 255;
        d[i + 1] = (g * vf + n) * 255;
        d[i + 2] = (b * vf + n) * 255;

        if (CV) {
          d[i] = CR[d[i]];
          d[i + 1] = CG[d[i + 1]];
          d[i + 2] = CB[d[i + 2]];
        }
      }
    }
    x.putImageData(im, 0, y0);
  }

  let s = p.seed * 9301;
  const rr = () => (s = (s * 16807) % 2147483647) / 2147483647;

  // Analog Halation / Glow
  if (p.glow > 0) {
    const t = document.createElement('canvas');
    t.width = Math.max(8, w >> 3);
    t.height = Math.max(8, h >> 3);
    const c = t.getContext('2d');
    c.drawImage(ph, 0, 0, t.width, t.height);
    c.globalCompositeOperation = 'multiply';
    c.fillStyle = '#ff7a45';
    c.fillRect(0, 0, t.width, t.height);

    x.globalCompositeOperation = 'screen';
    x.globalAlpha = p.glow / 100 * 0.45;
    x.drawImage(t, 0, 0, w, h);
    x.globalAlpha = 1;
  }

  // Light Leak
  x.globalCompositeOperation = 'screen';
  if (p.leak > 0) {
    const cx = rr() < 0.5 ? 0 : w;
    const g = x.createRadialGradient(cx, h * (0.2 + rr() * 0.5), 0, cx, h * 0.4, m * 0.9);
    g.addColorStop(0, `rgba(255,110,30,${p.leak / 100 * 0.8})`);
    g.addColorStop(0.5, `rgba(255,40,60,${p.leak / 100 * 0.25})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g;
    x.fillRect(0, 0, w, h);
  }
  x.globalCompositeOperation = 'source-over';

  // Dust & Scratches
  if (p.dust > 0) {
    x.fillStyle = 'rgba(255,255,255,.65)';
    for (let i = 0; i < p.dust * 0.8; i++) {
      x.beginPath();
      x.arc(rr() * w, rr() * h, m * 0.0012 * (0.5 + rr() * 1.5), 0, 7);
      x.fill();
    }
    x.strokeStyle = 'rgba(255,255,255,.22)';
    x.lineWidth = Math.max(1, m * 0.0006);
    for (let i = 0; i < p.dust * 0.12; i++) {
      const a = rr() * w, b = rr() * h;
      x.beginPath();
      x.moveTo(a, b);
      x.lineTo(a + (rr() - 0.5) * m * 0.03, b + rr() * m * 0.12);
      x.stroke();
    }
  }

  // Retro Orange Date Stamp
  const dt = new Date();
  const ds = `'${String(dt.getFullYear()).slice(2)} ${String(dt.getMonth() + 1).padStart(2, '0')} ${String(dt.getDate()).padStart(2, '0')}`;
  if (p.date) {
    x.font = `bold ${m * 0.035}px ui-monospace, Menlo, monospace`;
    x.textAlign = 'right';
    x.fillStyle = '#ff8a1e';
    x.shadowColor = '#ff5a00';
    x.shadowBlur = m * 0.01;
    x.fillText(ds, w - m * 0.04, h - m * 0.04);
    x.shadowBlur = 0;
  }

  // Exhibition Frame Styles
  const F = {
    Plain: [0, 0, '#000'],
    White: [0.06, 0.06, '#f6f4ef'],
    Paper: [0.06, 0.15, '#ece4d2'],
    Black: [0.06, 0.06, '#0b0b0b'],
    Negative: [0.07, 0.07, '#141210'],
    Specs: [0.04, 0.16, '#f7f7f5'],
    Polaroid: [0.05, 0.24, '#fcfbf8'],
    Filmstrip: [0.1, 0.1, '#0f0f11']
  }[p.frame];

  const pd = F[0] * m, bt = F[1] * m;
  if (!pd && !bt) return ph;

  const o = document.createElement('canvas');
  o.width = w + 2 * pd;
  o.height = h + pd + bt;
  const c = o.getContext('2d');
  c.fillStyle = F[2];
  c.fillRect(0, 0, o.width, o.height);
  c.drawImage(ph, pd, pd);

  c.textAlign = 'left';
  const ttl = (p.title || '').toUpperCase();
  const spc = (p.specs || `${(w * h / 1e6).toFixed(0)}MP · ${w}×${h} · ${p.look}`).toUpperCase();
  const mono = 'ui-monospace, Menlo, monospace';
  const bot = h + pd;

  if (p.frame === 'Paper') {
    const ty = bot + bt * 0.45;
    c.fillStyle = '#1c1c1f';
    c.font = `700 ${m * 0.03}px -apple-system, Georgia, serif`;
    c.fillText(ttl, pd, ty);
    c.fillStyle = '#6b7280';
    c.font = `${m * 0.017}px ${mono}`;
    c.fillText(`${spc}  ·  ${ds}`, pd, ty + m * 0.045);
  }
  if (p.frame === 'Polaroid') {
    const ty = bot + bt * 0.42;
    c.fillStyle = '#2a2a2e';
    c.font = `italic 600 ${m * 0.036}px -apple-system, sans-serif`;
    c.fillText(p.title || 'Framed', pd + m * 0.01, ty);
    c.fillStyle = '#8f949e';
    c.font = `${m * 0.016}px ${mono}`;
    c.fillText(`${spc}  ·  ${ds}`, pd + m * 0.012, ty + m * 0.07);
  }
  if (p.frame === 'Specs') {
    c.fillStyle = '#111';
    c.font = `bold ${m * 0.028}px ${mono}`;
    c.fillText(`${p.look.toUpperCase()}  ·  ${(w * h / 1e6).toFixed(0)}MP`, pd, h + pd + m * 0.06);
    c.font = `${m * 0.022}px ${mono}`;
    c.fillStyle = '#666';
    c.fillText(`${w}×${h}  ·  ${dt.toDateString()}`, pd, h + pd + m * 0.1);
  }
  if (p.frame === 'Filmstrip') {
    const hw = m * 0.035, hh = m * 0.05, st = m * 0.07, hy = (pd - hh) / 2;
    c.fillStyle = '#2a2a30';
    for (let X = m * 0.02; X < o.width - m * 0.04; X += st) {
      c.fillRect(X, hy * 0.6, hw, hh);
      c.fillRect(X, o.height - hy * 0.6 - hh, hw, hh);
    }
    c.fillStyle = '#e2a842';
    c.font = `600 ${m * 0.016}px ${mono}`;
    c.fillText(`KODAK 5074 // ${p.look.toUpperCase()} // DX-35`, pd, pd - m * 0.012);
    c.fillStyle = '#f3f4f6';
    c.font = `700 ${m * 0.02}px ${mono}`;
    c.fillText(ttl, pd, bot + m * 0.03);
    c.fillStyle = '#e2a842';
    c.font = `${m * 0.014}px ${mono}`;
    c.textAlign = 'right';
    c.fillText(spc, o.width - pd, bot + m * 0.03);
  }
  if (p.frame === 'Negative') {
    c.fillStyle = '#2a2622';
    for (let i = 0; i < o.width / (m * 0.06); i++) {
      c.fillRect(i * m * 0.06 + m * 0.02, m * 0.02, m * 0.03, m * 0.03);
      c.fillRect(i * m * 0.06 + m * 0.02, o.height - m * 0.05, m * 0.03, m * 0.03);
    }
    c.fillStyle = '#ff9a2e';
    c.font = `${m * 0.022}px ${mono}`;
    c.fillText(`FRAMED 400   ▸ ${String(Math.floor(rr() * 36) + 1).padStart(2, '0')}`, pd, o.height - m * 0.058);
  }

  return o;
}

$('#back').onclick = () => {
  $('#ed').hidden = true;
  $('#cam').hidden = false;
  src = small = null;
};

$('#save').onclick = async () => {
  $('#busy').hidden = false;
  await tick();
  const o = render(src, p);
  o.toBlob(async b => {
    const f = new File([b], `framed-${Date.now()}.jpg`, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try {
        await navigator.share({ files: [f] });
      } catch(e) {}
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = f.name;
      a.click();
    }
    $('#info').textContent = `Exported ${o.width}×${o.height}`;
    $('#busy').hidden = true;
  }, 'image/jpeg', 0.96);
};

/* Start camera loop */
start();

/* 100% Offline ServiceWorker */
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'framed-app-v3';
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./'])));
      self.skipWaiting();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
    });
  `;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], { type: 'application/javascript' }))).catch(() => {});
}
</script>
</body>
