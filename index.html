<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Framed">
  <title>Framed — Aesthetic Camera Studio</title>
  <style>
    :root {
      --bg: #0c0c0d;
      --fg: #f2f0ea;
      --mut: #8c8a85;
      --acc: #ffb347;
      --green: #34c759;
      --pan: #1a1a1d;
      --stage: #000;
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    section {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--bg);
    }
    [hidden] { display: none !important; }
    
    button, label.btn {
      font: inherit;
      color: inherit;
      background: var(--pan);
      border: 0;
      border-radius: 999px;
      padding: 7px 13px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }
    button:active, label.btn:active { transform: scale(0.95); }
    button.on, label.btn.on { background: var(--acc); color: #111; font-weight: 600; }

    .row {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      flex-wrap: wrap;
    }

    #wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
    }
    #stage {
      position: relative;
      flex: none;
      background: var(--stage);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
    }
    video, #ov {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    video { object-fit: cover; }
    
    #hint {
      position: absolute;
      left: 0;
      right: 0;
      top: 10px;
      text-align: center;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      padding: 0 16px;
      z-index: 10;
    }

    #tools {
      display: flex;
      gap: 14px;
      padding: 4px 18px;
    }
    #tools label {
      flex: 1;
      font-size: 11px;
      color: var(--mut);
    }
    input[type=range] {
      accent-color: var(--acc);
      width: 100%;
      height: 4px;
    }

    #info-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 20px;
    }
    small {
      color: var(--mut);
      font-size: 11px;
      font-family: ui-monospace, Menlo, monospace;
    }

    #bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 8px 10px 16px;
    }
    #shut {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid var(--bg);
      outline: 3px solid var(--fg);
      padding: 0;
      cursor: pointer;
      transition: all 0.2s;
    }
    #shut.lit {
      outline-color: var(--green);
      box-shadow: 0 0 20px var(--green);
      background: #f0fdf4;
    }
    #shut:active {
      transform: scale(0.92);
      background: var(--acc);
    }

    /* Editor View */
    #pvw {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: #000;
    }
    #pv {
      max-width: 100%;
      max-height: 100%;
      border-radius: 6px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
    }
    #panel {
      height: 195px;
      overflow-y: auto;
      padding: 4px 16px;
      background: var(--bg);
    }
    .sl {
      display: grid;
      grid-template-columns: 88px 1fr 34px;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--mut);
      margin: 6px 0;
    }
    .sl span:last-child {
      text-align: right;
      font-family: monospace;
      color: var(--fg);
    }
    #busy {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      z-index: 99;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: var(--acc);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- CAMERA SECTION -->
<section id="cam">
  <div class="row" id="top"></div>

  <div id="wrap">
    <div id="stage">
      <video id="v" playsinline webkit-playsinline muted autoplay></video>
      <canvas id="ov"></canvas>
      <div id="hint"></div>
    </div>
  </div>

  <div id="tools">
    <label>Zoom<input type="range" id="zm" min="1" max="5" step="0.1" value="1"></label>
    <label>Exposure<input type="range" id="ex" min="-2" max="2" step="0.1" value="0"></label>
  </div>

  <div id="info-row">
    <small id="res">Connecting camera...</small>
    <small id="exif-tag">EXIF Engine Active</small>
  </div>

  <div id="bar">
    <label class="btn" for="f1" title="Import with EXIF Reader">Photos</label>
    <button id="auto">✦ Scan</button>
    <button id="shut" aria-label="Shutter"></button>
    <button id="drw">Your frame</button>
    <label class="btn" for="f2" title="Full native resolution capture" style="color:var(--acc); font-weight:700;">24MP</label>
  </div>
</section>

<!-- EDITOR SECTION -->
<section id="ed" hidden>
  <div id="pvw"><canvas id="pv"></canvas></div>
  <div class="row" id="tabs"></div>
  <div id="panel"></div>
  <div class="row">
    <button id="back">Retake</button>
    <small id="info" style="flex:1; text-align:center;"></small>
    <button id="save" class="on">Save</button>
  </div>
</section>

<div id="busy" hidden>
  <div class="spinner"></div>
  <span id="busy-label">Developing photo…</span>
</div>

<!-- File pickers -->
<input type="file" id="f1" accept="image/*" style="position:fixed; top:-9999px;">
<input type="file" id="f2" accept="image/*" capture="environment" style="position:fixed; top:-9999px;">
<input type="file" id="f-lut" accept=".cube" style="position:fixed; top:-9999px;">

<script>
// 1. Purge legacy service worker caches
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    for (let r of regs) r.unregister();
  });
}

const $ = s => document.querySelector(s);
const RAT = { '3:4': 3/4, '4:5': 4/5, '1:1': 1, '3:2': 3/2, '9:16': 9/16, '65:24': 65/24 };
let ratio = '3:2', facing = 'environment', stream = null, track = null, imageCapture = null;
let frame = null, drawMode = false, autoOn = false, src = null, small = null, p = null;
let camExp = 0, stable = 0, lastMP = 0;
const v = $('#v'), ov = $('#ov'), stage = $('#stage');
const tick = () => new Promise(r => setTimeout(r, 20));

/* =========================================================================
   FEATURE 1: MULTIPLE COMPOSITION GRID OVERLAYS
   Modes: '3rds' | 'phi' | 'spiral' | 'baroque' | 'cross' | 'off'
   ========================================================================= */
const GRID_MODES = ['3rds', 'phi', 'spiral', 'baroque', 'cross', 'off'];
const GRID_LABELS = {
  '3rds': 'Grid: 3rds',
  'phi': 'Grid: Phi',
  'spiral': 'Grid: Spiral',
  'baroque': 'Grid: Baroque',
  'cross': 'Grid: Cross',
  'off': 'Grid: Off'
};
let gridMode = '3rds';

// Top bar controls (Ratios, Flip, Torch, Level, Grid Cycle)
const topBar = $('#top');
Object.keys(RAT).forEach(k => {
  const b = document.createElement('button');
  b.textContent = k;
  b.className = k === ratio ? 'on' : '';
  b.onclick = (e) => {
    e.stopPropagation();
    ratio = k;
    fit();
    [...topBar.children].forEach(c => {
      if (RAT[c.textContent] !== undefined) c.classList.toggle('on', c.textContent === k);
    });
    frame = null;
    draw();
  };
  topBar.appendChild(b);
});

const fl = document.createElement('button');
fl.textContent = 'Flip';
fl.onclick = (e) => {
  e.stopPropagation();
  facing = (facing === 'environment') ? 'user' : 'environment';
  start();
};
topBar.appendChild(fl);

const tb = document.createElement('button');
tb.textContent = 'Flash';
topBar.appendChild(tb);

// Grid toggle button
const gb = document.createElement('button');
gb.textContent = GRID_LABELS[gridMode];
gb.onclick = (e) => {
  e.stopPropagation();
  const nextIdx = (GRID_MODES.indexOf(gridMode) + 1) % GRID_MODES.length;
  gridMode = GRID_MODES[nextIdx];
  gb.textContent = GRID_LABELS[gridMode];
  gb.classList.toggle('on', gridMode !== 'off');
  draw();
};
topBar.appendChild(gb);

// Horizon Level
let lvlOn = false, lvlAng = 0, lvlRaf = 0;
const lb = document.createElement('button');
lb.textContent = 'Level';
lb.onclick = async (e) => {
  e.stopPropagation();
  lvlOn = !lvlOn;
  lb.classList.toggle('on', lvlOn);
  if (lvlOn && window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) {
    try {
      if (await DeviceOrientationEvent.requestPermission() !== 'granted') {
        lvlOn = false;
        lb.classList.remove('on');
      }
    } catch(err){}
  }
  draw();
};
topBar.appendChild(lb);

window.addEventListener('deviceorientation', e => {
  if (!lvlOn) return;
  lvlAng = Math.max(-45, Math.min(45, e.gamma || 0));
  cancelAnimationFrame(lvlRaf);
  lvlRaf = requestAnimationFrame(draw);
});

function drawLevel(x, W, H) {
  if (!lvlOn) return;
  const d = Math.max(1, W / 400), ok = Math.abs(lvlAng) < 1.2;
  x.save();
  x.translate(W / 2, H / 2);
  x.rotate(-lvlAng * Math.PI / 180);
  x.strokeStyle = ok ? '#34c759' : 'rgba(255,255,255,.75)';
  x.lineWidth = 2.5 * d;
  x.beginPath();
  x.moveTo(-W * 0.24, 0); x.lineTo(-W * 0.08, 0);
  x.moveTo(W * 0.08, 0);  x.lineTo(W * 0.24, 0);
  x.stroke();
  x.restore();
}

/* Drawing All Grid Overlays */
function drawGridOverlay(x, W, H) {
  if (gridMode === 'off') return;
  x.save();
  x.strokeStyle = 'rgba(255, 255, 255, 0.32)';
  x.lineWidth = 1;

  if (gridMode === '3rds') {
    // Rule of Thirds (1/3, 2/3)
    x.beginPath();
    for (let i = 1; i < 3; i++) {
      x.moveTo(W * i / 3, 0); x.lineTo(W * i / 3, H);
      x.moveTo(0, H * i / 3); x.lineTo(W, H * i / 3);
    }
    x.stroke();
  } 
  else if (gridMode === 'phi') {
    // Golden Ratio / Phi Grid (0.382 and 0.618)
    const p1 = 0.382, p2 = 0.618;
    x.beginPath();
    x.moveTo(W * p1, 0); x.lineTo(W * p1, H);
    x.moveTo(W * p2, 0); x.lineTo(W * p2, H);
    x.moveTo(0, H * p1); x.lineTo(W, H * p1);
    x.moveTo(0, H * p2); x.lineTo(W, H * p2);
    x.stroke();

    // Eye Intersection Markers
    x.fillStyle = 'rgba(255, 179, 71, 0.6)';
    [[p1, p1], [p2, p1], [p1, p2], [p2, p2]].forEach(([gx, gy]) => {
      x.beginPath();
      x.arc(W * gx, H * gy, 3.5, 0, Math.PI * 2);
      x.fill();
    });
  } 
  else if (gridMode === 'spiral') {
    // Golden / Fibonacci Spiral
    x.beginPath();
    let sx = 0, sy = 0, sw = W, sh = H;
    const phi = 0.6180339887;
    for (let i = 0; i < 6; i++) {
      const vert = (i % 2 === 0);
      if (vert) {
        const cut = sw * phi;
        x.strokeRect(sx, sy, cut, sh);
        // Arc inside square
        x.beginPath();
        x.arc(sx + cut, sy + sh, cut, Math.PI, Math.PI * 1.5);
        x.stroke();
        sx += cut;
        sw -= cut;
      } else {
        const cut = sh * phi;
        x.strokeRect(sx, sy, sw, cut);
        x.beginPath();
        x.arc(sx, sy + cut, cut, Math.PI * 1.5, Math.PI * 2);
        x.stroke();
        sy += cut;
        sh -= cut;
      }
    }
  } 
  else if (gridMode === 'baroque') {
    // Dynamic Symmetry: Baroque diagonal & Reciprocal orthogonals
    x.beginPath();
    // Baroque diagonal (bottom-left to top-right)
    x.moveTo(0, H); x.lineTo(W, 0);
    // Sinister diagonal (top-left to bottom-right)
    x.moveTo(0, 0); x.lineTo(W, H);
    // Reciprocals from top-left and bottom-right perpendicular to baroque
    const m = -H / W;
    const mPerp = -1 / m;
    // Perpendicular from (0,0) hits y = mPerp * x
    const xIntersect = H / (mPerp - m);
    const yIntersect = mPerp * xIntersect;
    x.moveTo(0, 0); x.lineTo(xIntersect, yIntersect);
    x.moveTo(W, H); x.lineTo(W - xIntersect, H - yIntersect);
    x.stroke();
  } 
  else if (gridMode === 'cross') {
    // Minimalist Crosshair & Central Focus Ring
    x.beginPath();
    x.moveTo(W / 2 - 16, H / 2); x.lineTo(W / 2 + 16, H / 2);
    x.moveTo(W / 2, H / 2 - 16); x.lineTo(W / 2, H / 2 + 16);
    x.arc(W / 2, H / 2, Math.min(W, H) * 0.18, 0, Math.PI * 2);
    x.stroke();
  }

  x.restore();
}

/* =========================================================================
   FEATURE 2: 3D LUT SUPPORT (.cube parser & Trilinear Interpolator)
   ========================================================================= */
let activeLUT = null; // { size: 33, data: Float32Array }

function parseCubeLUT(text) {
  const lines = text.split(/\r?\n/);
  let size = 0;
  const rawValues = [];

  for (let line of lines) {
    line = line.trim();
    if (!line || line.startsWith('#')) continue;
    if (line.startsWith('LUT_3D_SIZE')) {
      size = parseInt(line.split(/\s+/)[1], 10);
      continue;
    }
    if (line.startsWith('TITLE') || line.startsWith('DOMAIN_')) continue;
    
    const parts = line.split(/\s+/).map(Number);
    if (parts.length === 3 && !isNaN(parts[0])) {
      rawValues.push(parts[0], parts[1], parts[2]);
    }
  }

  if (!size || rawValues.length < size * size * size * 3) {
    console.error("Invalid .cube file format or size mismatch", size, rawValues.length);
    return null;
  }

  return {
    size,
    data: new Float32Array(rawValues)
  };
}

// Ultra-fast Trilinear Interpolation on 3D Color Cube
function applyLUT3D(r, g, b, lut) {
  const S = lut.size;
  const d = lut.data;
  const maxIdx = S - 1;

  // Normalize 0..1 to 0..(S-1)
  const x = Math.max(0, Math.min(1, r)) * maxIdx;
  const y = Math.max(0, Math.min(1, g)) * maxIdx;
  const z = Math.max(0, Math.min(1, b)) * maxIdx;

  const x0 = Math.floor(x), x1 = Math.min(maxIdx, x0 + 1);
  const y0 = Math.floor(y), y1 = Math.min(maxIdx, y0 + 1);
  const z0 = Math.floor(z), z1 = Math.min(maxIdx, z0 + 1);

  const fx = x - x0, fy = y - y0, fz = z - z0;

  // Cube indexing in standard DaVinci .cube format: index = (r + g * S + b * S * S) * 3
  const getIndex = (ix, iy, iz) => (ix + iy * S + iz * S * S) * 3;

  const i000 = getIndex(x0, y0, z0);
  const i100 = getIndex(x1, y0, z0);
  const i010 = getIndex(x0, y1, z0);
  const i110 = getIndex(x1, y1, z0);
  const i001 = getIndex(x0, y0, z1);
  const i101 = getIndex(x1, y0, z1);
  const i011 = getIndex(x0, y1, z1);
  const i111 = getIndex(x1, y1, z1);

  const out = [0, 0, 0];
  for (let c = 0; c < 3; c++) {
    const c00 = d[i000 + c] * (1 - fx) + d[i100 + c] * fx;
    const c10 = d[i010 + c] * (1 - fx) + d[i110 + c] * fx;
    const c01 = d[i001 + c] * (1 - fx) + d[i101 + c] * fx;
    const c11 = d[i011 + c] * (1 - fx) + d[i111 + c] * fx;

    const c0 = c00 * (1 - fy) + c10 * fy;
    const c1 = c01 * (1 - fy) + c11 * fy;

    out[c] = c0 * (1 - fz) + c1 * fz;
  }
  return out;
}

// Built-in Procedural Cinema LUT Generator (Kodak Vision3 500T 5219 Emulation Cube)
function createBuiltInFilmCube(size = 17) {
  const N = size * size * size * 3;
  const data = new Float32Array(N);
  let idx = 0;

  for (let z = 0; z < size; z++) {
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        let r = x / (size - 1);
        let g = y / (size - 1);
        let b = z / (size - 1);

        // Vision3 5219 signature: warm rich midtones, cool teal shadows, soft highlight rolloff
        const luma = 0.299 * r + 0.587 * g + 0.114 * b;
        
        // Highlight compression
        r = Math.pow(r, 0.92) * 1.05;
        g = Math.pow(g, 0.96) * 1.01;
        b = Math.pow(b, 1.04) * 0.95;

        // Shadow teal split-toning
        const shadowMask = Math.max(0, 1 - luma * 2.2);
        b += shadowMask * 0.08;
        g += shadowMask * 0.03;

        data[idx++] = Math.min(1, Math.max(0, r));
        data[idx++] = Math.min(1, Math.max(0, g));
        data[idx++] = Math.min(1, Math.max(0, b));
      }
    }
  }
  return { size, data };
}
const BUILTIN_VISION3_LUT = createBuiltInFilmCube(17);

/* =========================================================================
   FEATURE 3: PURE BINARY EXIF METADATA PRESERVATION & PARSER
   Reads ArrayBuffer directly from JPEG APP1 Segment without dependencies
   ========================================================================= */
function parseEXIF(arrayBuffer) {
  const dataView = new DataView(arrayBuffer);
  if (dataView.getUint16(0, false) !== 0xFFD8) {
    // Not a valid JPEG
    return null;
  }

  let offset = 2;
  const length = dataView.byteLength;
  let exifMarkerFound = false;

  while (offset < length) {
    const marker = dataView.getUint16(offset, false);
    offset += 2;

    if (marker === 0xFFE1) {
      // APP1 Marker found
      const app1Length = dataView.getUint16(offset, false);
      offset += 2;
      // Check for "Exif\0\0"
      if (dataView.getUint32(offset, false) === 0x45786966 && dataView.getUint16(offset + 4, false) === 0x0000) {
        exifMarkerFound = true;
        offset += 6; // Start of TIFF header
        break;
      }
      offset += app1Length - 2;
    } else if ((marker & 0xFF00) === 0xFF00) {
      // Other marker, skip length
      offset += dataView.getUint16(offset, false);
    } else {
      break;
    }
  }

  if (!exifMarkerFound) return null;

  const tiffStart = offset;
  const isLittleEndian = (dataView.getUint16(tiffStart, false) === 0x4949);
  const firstIFDOffset = dataView.getUint32(tiffStart + 4, isLittleEndian);

  const tags = {};

  function readTags(ifdOffset) {
    if (ifdOffset >= dataView.byteLength - tiffStart) return;
    const entries = dataView.getUint16(tiffStart + ifdOffset, isLittleEndian);
    let entryOffset = tiffStart + ifdOffset + 2;

    for (let i = 0; i < entries; i++) {
      if (entryOffset + 12 > dataView.byteLength) break;
      const tag = dataView.getUint16(entryOffset, isLittleEndian);
      const type = dataView.getUint16(entryOffset + 2, isLittleEndian);
      const count = dataView.getUint32(entryOffset + 4, isLittleEndian);
      const valOffset = entryOffset + 8;

      let value = null;
      if (type === 2) {
        // ASCII String
        const stringOffset = count > 4 ? tiffStart + dataView.getUint32(valOffset, isLittleEndian) : valOffset;
        let str = '';
        for (let j = 0; j < count - 1; j++) {
          if (stringOffset + j < dataView.byteLength) {
            str += String.fromCharCode(dataView.getUint8(stringOffset + j));
          }
        }
        value = str.trim();
      } else if (type === 3) {
        // SHORT 16-bit
        value = dataView.getUint16(valOffset, isLittleEndian);
      } else if (type === 4) {
        // LONG 32-bit
        value = dataView.getUint32(valOffset, isLittleEndian);
      } else if (type === 5) {
        // RATIONAL (2x 32-bit)
        const rationalOffset = tiffStart + dataView.getUint32(valOffset, isLittleEndian);
        if (rationalOffset + 8 <= dataView.byteLength) {
          const num = dataView.getUint32(rationalOffset, isLittleEndian);
          const den = dataView.getUint32(rationalOffset + 4, isLittleEndian);
          value = den ? (num / den) : 0;
          if (tag === 0x829A) {
            // ExposureTime fractional format
            value = (num && den) ? (num < den ? `1/${Math.round(den/num)}s` : `${(num/den).toFixed(1)}s`) : '';
          }
        }
      }

      if (value !== null) tags[tag] = value;
      entryOffset += 12;
    }
  }

  // Read IFD0 (Camera Make / Model)
  readTags(firstIFDOffset);

  // Read Exif IFD Pointer if present
  if (tags[0x8769]) {
    readTags(tags[0x8769]);
  }

  // Formatted camera specs
  const make = tags[0x010F] || '';
  const model = tags[0x0110] || '';
  const fNumber = tags[0x829D] ? `f/${tags[0x829D].toFixed(1)}` : '';
  const expTime = tags[0x829A] || '';
  const iso = tags[0x8827] ? `ISO ${tags[0x8827]}` : '';
  const focal = tags[0x920A] ? `${Math.round(tags[0x920A])}mm` : '';
  const date = tags[0x9003] || '';

  const cameraTitle = (make && model && !model.toLowerCase().includes(make.toLowerCase())) 
    ? `${make} ${model}`.toUpperCase() 
    : (model || make || 'ANALOG STUDIO').toUpperCase();

  const specsList = [focal, fNumber, expTime, iso].filter(Boolean);
  const specsLine = specsList.length ? specsList.join(' · ') : '';

  return {
    title: cameraTitle,
    specs: specsLine,
    dateOriginal: date

}

  const r = ov.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;

// Auto framing saliency analysis
function vis() {
  const vw = v.videoWidth || 640, vh = v.videoHeight || 480, a = RAT[ratio];
  let cw, ch;
  if (vw / vh > a) { ch = vh; cw = vh * a; } else { cw = vw; ch = vw / a; }
  return { x: (vw - cw) / 2, y: (vh - ch) / 2, w: cw, h: ch };
}

const dc = document.createElement('canvas');
function analyzeFrame() {
  if (!v.videoWidth) return null;
  const q = vis(), N = 36, M = Math.round(N / RAT[ratio]);
  dc.width = N; dc.height = M;
  const x = dc.getContext('2d', { willReadFrequently: true });
  x.drawImage(v, q.x, q.y, q.w, q.h, 0, 0, N, M);
  const d = x.getImageData(0, 0, N, M).data;
  let tot = 0, sumX = 0, sumY = 0;
  for (let y = 1; y < M - 1; y++) {
    for (let xx = 1; xx < N - 1; xx++) {
      const idx = (y * N + xx) * 4;
      const lum = 0.299 * d[idx] + 0.587 * d[idx+1] + 0.114 * d[idx+2];
      const r = d[idx], g = d[idx+1], b = d[idx+2];
      const isSkin = (r > 60 && g > 35 && b > 25 && r > g && r > b);
      const edge = Math.abs(lum - (0.299 * d[idx+4] + 0.587 * d[idx+5] + 0.114 * d[idx+6]));
      const w = edge + (isSkin ? 60 : 0);
      if (w > 20) {
        tot += w; sumX += w * xx; sumY += w * y;
      }
    }
  }
  if (tot <= 0) return { cx: 0.5, cy: 0.5, s: 0.7 };
  const mx = (sumX / tot) / N, my = (sumY / tot) / M;
  const ux = mx < 0.5 ? 1/3 : 2/3, uy = my < 0.5 ? 1/3 : 2/3;
  return { cx: Math.min(0.65, Math.max(0.35, mx - (ux - 0.5) * 0.6)), cy: Math.min(0.65, Math.max(0.35, my - (uy - 0.5) * 0.6)), s: 0.65 };
}

  $('#busy-label').textContent = 'Developing High-Res Capture…';
  $('#busy').hidden = false;
  await tick();

  let captured = null;
  if (imageCapture) {
    try {
      const blob = await imageCapture.takePhoto();
      const bm = await createImageBitmap(blob);
      captured = document.createElement('canvas');
      captured.width = bm.width; captured.height = bm.height;
      captured.getContext('2d').drawImage(bm, 0, 0);
    } catch(err){}
  }
  if (!captured) {
    const s = track ? track.getSettings() : {};
    const w = (s && s.width) || v.videoWidth || 1920;
    const h = (s && s.height) || v.videoHeight || 1080;
    captured = document.createElement('canvas');
    captured.width = w; captured.height = h;
    captured.getContext('2d').drawImage(v, 0, 0, w, h);
  }

  const q = { x: 0, y: 0, w: captured.width, h: captured.height };
  const targetAspect = RAT[ratio];
  let cw = q.w, ch = q.h;
  if (cw / ch > targetAspect) cw = ch * targetAspect; else ch = cw / targetAspect;
  let cropX = (q.w - cw) / 2, cropY = (q.h - ch) / 2;

  if (frame) {
    cropX += (frame.cx - frame.s / 2) * cw;
    cropY += (frame.cy - frame.s / 2) * ch;
    cw *= frame.s;
    ch *= frame.s;
  }

  const finalC = document.createElement('canvas');
  finalC.width = Math.round(cw);
  finalC.height = Math.round(ch);
  finalC.getContext('2d').drawImage(captured, cropX, cropY, cw, ch, 0, 0, finalC.width, finalC.height);

  $('#busy').hidden = true;
  edit(finalC, camExp, {
    title: 'FRAMED STUDIO',
    specs: `${(finalC.width * finalC.height / 1e6).toFixed(1)}MP · ${finalC.width}×${finalC.height}`

function curveLUT(P) {
  const n = P.length, x = P.map(a => a[0]), y = P.map(a => a[1]);
  const dx = [], m = [], t = new Array(n);
  for (let i = 0; i < n - 1; i++) { dx[i] = x[i + 1] - x[i]; m[i] = (y[i + 1] - y[i]) / dx[i]; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) t[i] = t[i + 1] = 0;
    else { const a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b; if (s > 9) { const k = 3 / Math.sqrt(s); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; } }
  }
  const L = new Uint8Array(256);
  let j = 0;
  for (let v = 0; v < 256; v++) {
    const X = v / 255;
    while (j < n - 2 && X > x[j + 1]) j++;
    const h = dx[j], u = (X - x[j]) / h, u2 = u * u, u3 = u2 * u;
    const Y = (2 * u3 - 3 * u2 + 1) * y[j] + (u3 - 2 * u2 + u) * h * t[j] + (-2 * u3 + 3 * u2) * y[j + 1] + (u3 - u2) * h * t[j + 1];
    L[v] = Math.round(Math.min(1, Math.max(0, Y)) * 255);
  }
  return L;
}

function buildCurves(p) {
  const c = p.curves;
  if (!c) return null;
  const isId = a => a.every(q => Math.abs(q[0] - q[1]) < 0.002);
  if (isId(c.m) && isId(c.r) && isId(c.g) && isId(c.b)) return null;
  const M = curveLUT(c.m);
  const mk = a => { const L = curveLUT(a), O = new Uint8Array(256); for (let i = 0; i < 256; i++) O[i] = M[L[i]]; return O; };
  return [mk(c.r), mk(c.g), mk(c.b)];
}

const BC = [0, 30, 60, 120, 180, 225, 270, 320];
let hR = 0, hG = 0, hB = 0;
function hslActive(p) { return !!(p.hsl && p.hsl.some(a => a[0] || a[1] || a[2])); }
function hslApply(r, g, b, H) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, l = (mx + mn) / 2;
  if (d < 0.02) { hR = r; hG = g; hB = b; return; }
  const s = d / (1 - Math.abs(2 * l - 1) || 1e-6);
  let h = (mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60;
  let dh = 0, ds = 0, dl = 0;
  for (let k = 0; k < 8; k++) {
    let a = Math.abs(h - BC[k]);
    if (a > 180) a = 360 - a;
    const w = 1 - a / 45;
    if (w > 0) { dh += w * H[k][0]; ds += w * H[k][1]; dl += w * H[k][2]; }
  }
  const k2 = Math.min(1, s * 3);
  h = (h + dh * 0.3 * k2 + 360) % 360;
  const s2 = Math.min(1, Math.max(0, s * (1 + ds / 100 * k2))), l2 = Math.min(1, Math.max(0, l + dl / 200 * k2));
  const c = (1 - Math.abs(2 * l2 - 1)) * s2, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l2 - c / 2, q = h / 60 | 0;
  let R = 0, G = 0, B = 0;
  if (q === 0) { R = c; G = x; } else if (q === 1) { R = x; G = c; } else if (q === 2) { G = c; B = x; } else if (q === 3) { G = x; B = c; } else if (q === 4) { R = x; B = c; } else { R = c; B = x; }
  hR = R + m; hG = G + m; hB = B + m;
}

  const v3Btn = document.createElement('button');
  v3Btn.textContent = 'Kodak Vision3 500T';
  v3Btn.className = p.lutName === 'Vision3 500T' ? 'on' : '';
  v3Btn.onclick = () => {
    activeLUT = BUILTIN_VISION3_LUT;
    p.lutName = 'Vision3 500T';
    paint(); panel();
  };
  r.appendChild(v3Btn);

  const loadBtn = document.createElement('label');
  loadBtn.className = 'btn';
  loadBtn.htmlFor = 'f-lut';
  loadBtn.textContent = '+ Load .cube File';
  r.appendChild(loadBtn);

  P.appendChild(r);

  const status = document.createElement('div');
  status.style.cssText = 'font-size:12px; color:var(--mut); text-align:center; margin-top:8px;';
  status.textContent = `Active 3D LUT: ${p.lutName} ${activeLUT ? `(${activeLUT.size}³ points)` : ''}`;
  P.appendChild(status);
}

function stampInputs(P) {
  [['title', 'Title (Make & Model)', 'FRAMED STUDIO'], ['specs', 'Lens / Exposure Specs', '35MM F/1.4 · ISO 400']].forEach(([k, l, ph]) => {
    const i = document.createElement('input');
    i.value = p[k] || '';
    i.placeholder = ph;
    i.style.cssText = 'display:block;width:100%;box-sizing:border-box;margin:6px 0;padding:8px 12px;border:0;border-radius:8px;background:var(--pan);color:var(--fg);font-size:13px;';
    i.oninput = e => { p[k] = e.target.value; paint(); };
    P.appendChild(i);
  });
}

let tab = 'Looks', raf = 0;
function edit(c, expo, exifData = null) {
  src = c;
  const k = Math.min(1, 1400 / Math.max(c.width, c.height));
  small = document.createElement('canvas');
  small.width = Math.round(c.width * k);
  small.height = Math.round(c.height * k);
  small.getContext('2d').drawImage(c, 0, 0, small.width, small.height);

  p = { ...DEF, ...LOOKS.PORTRA, seed: 1 + Math.floor(Math.random() * 999) };
  p.exposure += expo * 30;

  // Auto-populate with real EXIF data if present
  if (exifData) {
    if (exifData.title) p.title = exifData.title;
    if (exifData.specs) p.specs = exifData.specs;
  }

  $('#info').textContent = `${(c.width * c.height / 1e6).toFixed(1)} MP Source`;
  $('#cam').hidden = true;
  $('#ed').hidden = false;
  tabs(); panel(); paint();
}

function tabs() {
  const t = $('#tabs');
  t.innerHTML = '';
  Object.keys(TABS).forEach(k => {
    const b = document.createElement('button');
    b.textContent = k;
    b.className = k === tab ? 'on' : '';
    b.onclick = () => { tab = k; tabs(); panel(); };
    t.appendChild(b);
  });
}

function panel() {
  const P = $('#panel');
  P.innerHTML = '';
  if (tab === 'Curve') return curvePanel(P);
  if (tab === 'HSL') return hslPanel(P);
  if (tab === 'LUT3D') return lutPanel(P);
  if (tab === 'Looks') {
    const r = document.createElement('div');
    r.className = 'row';
    Object.keys(LOOKS).forEach(k => {
      const b = document.createElement('button');
      b.textContent = k;
      b.className = p.look === k ? 'on' : '';
      b.onclick = () => {
        p = { ...DEF, ...LOOKS[k], look: k, frame: p.frame, date: p.date, title: p.title, specs: p.specs, curves: p.curves, hsl: p.hsl, seed: p.seed };
        if (k === 'VISION3') {
          activeLUT = BUILTIN_VISION3_LUT;
        } else if (p.lutName === 'None') {
          activeLUT = null;
        }
        panel(); paint();
      };
      r.appendChild(b);
    });
    P.appendChild(r);
  } else if (tab === 'Frame') {
    const r = document.createElement('div');
    r.className = 'row';
    FRAMES.forEach(k => {
      const b = document.createElement('button');
      b.textContent = k;
      b.className = p.frame === k ? 'on' : '';
      b.onclick = () => { p.frame = k; panel(); paint(); };
      r.appendChild(b);
    });
    const d = document.createElement('button');
    d.textContent = 'Date Stamp';
    d.className = p.date ? 'on' : '';
    d.onclick = () => { p.date = !p.date; panel(); paint(); };
    r.appendChild(d);
    P.appendChild(r);
    stampInputs(P);
  } else {
    TABS[tab].forEach(([k, n]) => {
      const d = document.createElement('div');
      d.className = 'sl';
      const neg = ['exposure', 'contrast', 'highlights', 'shadows', 'temp', 'tint', 'sat'].includes(k);
      d.innerHTML = `<span>${n}</span><input type="range" min="${neg ? -100 : 0}" max="100" value="${p[k]}"><span>${Math.round(p[k])}</span>`;
      d.querySelector('input').oninput = e => { p[k] = +e.target.value; d.lastChild.textContent = e.target.value; paint(); };
      P.appendChild(d);
    });
  }
}

function paint() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    const o = render(small, p);
    const pv = $('#pv');
    pv.width = o.width; pv.height = o.height;
    pv.getContext('2d').drawImage(o, 0, 0);
  });
}

function hash(x, y, s) {
  let n = Math.imul(x, 374761393) + Math.imul(y, 668265263) + s | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}

function render(sc, p) {
  const w = sc.width, h = sc.height, m = Math.min(w, h);
  const ph = document.createElement('canvas');
  ph.width = w; ph.height = h;
  const x = ph.getContext('2d', { willReadFrequently: true });
  x.drawImage(sc, 0, 0);

  const ex = Math.pow(2, p.exposure / 50), ct = 1 + p.contrast / 100, hi = p.highlights / 100, sh = p.shadows / 100, fd = p.fade / 100 * 0.14, tw = p.temp / 100, tn = p.tint / 100, sa = 1 + p.sat / 100, gr = p.grain / 100 * 0.22, vg = p.vignette / 100, bs = Math.max(0, Math.min(3, Math.round(Math.log2(w / 1200)))), sd = p.seed * 7919;
  const CV = buildCurves(p), CR = CV && CV[0], CG = CV && CV[1], CB = CV && CV[2], HS = hslActive(p);
  const LUT = activeLUT;

  for (let y0 = 0; y0 < h; y0 += 256) {
    const hh = Math.min(256, h - y0), im = x.getImageData(0, y0, w, hh), d = im.data;
    for (let yy = 0; yy < hh; yy++) {
      const y = y0 + yy, dy = y / h - 0.5;
      for (let xx = 0; xx < w; xx++) {
        const i = (yy * w + xx) * 4;
        let r = d[i] / 255 * ex * (1 + tw * 0.18);
        let g = d[i + 1] / 255 * ex * (1 - tn * 0.12);
        let b = d[i + 2] / 255 * ex * (1 - tw * 0.18);
        let l = 0.299 * r + 0.587 * g + 0.114 * b;

        const a = sh * (1 - l)**2 * 0.35 + hi * l * l * 0.35;
        r += a; g += a; b += a;
        r = (r - 0.5) * ct + 0.5; g = (g - 0.5) * ct + 0.5; b = (b - 0.5) * ct + 0.5;
        r = fd + r * (1 - fd); g = fd + g * (1 - fd); b = fd + b * (1 - fd);
        l = 0.299 * r + 0.587 * g + 0.114 * b;

        if (p.mono) {
          r = g = b = l;
        } else {
          r = l + (r - l) * sa;
          g = l + (g - l) * sa;
          b = l + (b - l) * sa;
        }

        // 3D LUT Trilinear Color Transform
        if (LUT) {
          const lutSample = applyLUT3D(r, g, b, LUT);
          r = lutSample[0]; g = lutSample[1]; b = lutSample[2];
        }

        if (HS) {
          hslApply(r, g, b, p.hsl);
          r = hR; g = hG; b = hB;
        }

        const dx = xx / w - 0.5, vf = 1 - vg * (dx * dx + dy * dy) * 2.2;
        const n = gr ? (hash(xx >> bs, y >> bs, sd) - 0.5) * gr * (1.1 - Math.abs(l - 0.5)) : 0;

        d[i] = (r * vf + n) * 255;
        d[i + 1] = (g * vf + n) * 255;
        d[i + 2] = (b * vf + n) * 255;

        if (CV) {
          d[i] = CR[d[i]];
          d[i + 1] = CG[d[i + 1]];
          d[i + 2] = CB[d[i + 2]];
        }
      }
    }
    x.putImageData(im, 0, y0);
  }

  let s = p.seed * 9301;
  const rr = () => (s = (s * 16807) % 2147483647) / 2147483647;

  if (p.glow > 0) {
    const t = document.createElement('canvas');
    t.width = Math.max(8, w >> 3); t.height = Math.max(8, h >> 3);
    const c = t.getContext('2d');
    c.drawImage(ph, 0, 0, t.width, t.height);
    c.globalCompositeOperation = 'multiply'; c.fillStyle = '#ff7a45'; c.fillRect(0, 0, t.width, t.height);
    x.globalCompositeOperation = 'screen'; x.globalAlpha = p.glow / 100 * 0.45; x.drawImage(t, 0, 0, w, h); x.globalAlpha = 1;
  }
  x.globalCompositeOperation = 'screen';
  if (p.leak > 0) {
    const cx = rr() < 0.5 ? 0 : w, g = x.createRadialGradient(cx, h * (0.2 + rr() * 0.5), 0, cx, h * 0.4, m * 0.9);
    g.addColorStop(0, `rgba(255,110,30,${p.leak / 100 * 0.8})`); g.addColorStop(0.5, `rgba(255,40,60,${p.leak / 100 * 0.25})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
  }
  x.globalCompositeOperation = 'source-over';
  if (p.dust > 0) {
    x.fillStyle = 'rgba(255,255,255,.65)';
    for (let i = 0; i < p.dust * 0.8; i++) { x.beginPath(); x.arc(rr() * w, rr() * h, m * 0.0012 * (0.5 + rr() * 1.5), 0, 7); x.fill(); }
    x.strokeStyle = 'rgba(255,255,255,.22)'; x.lineWidth = Math.max(1, m * 0.0006);
    for (let i = 0; i < p.dust * 0.12; i++) { const a = rr() * w, b = rr() * h; x.beginPath(); x.moveTo(a, b); x.lineTo(a + (rr() - 0.5) * m * 0.03, b + rr() * m * 0.12); x.stroke(); }
  }

  const dt = new Date(), ds = `'${String(dt.getFullYear()).slice(2)} ${String(dt.getMonth() + 1).padStart(2, '0')} ${String(dt.getDate()).padStart(2, '0')}`;
  if (p.date) {
    x.font = `bold ${m * 0.035}px ui-monospace, Menlo, monospace`;
    x.textAlign = 'right'; x.fillStyle = '#ff8a1e'; x.shadowColor = '#ff5a00'; x.shadowBlur = m * 0.01;
    x.fillText(ds, w - m * 0.04, h - m * 0.04); x.shadowBlur = 0;
  }

  const F = { Plain: [0, 0, '#000'], White: [0.06, 0.06, '#f6f4ef'], Paper: [0.06, 0.15, '#ece4d2'], Black: [0.06, 0.06, '#0b0b0b'], Negative: [0.07, 0.07, '#141210'], Specs: [0.04, 0.16, '#f7f7f5'], Polaroid: [0.05, 0.24, '#fcfbf8'], Filmstrip: [0.1, 0.1, '#0f0f11'] }[p.frame];
  const pd = F[0] * m, bt = F[1] * m;
  if (!pd && !bt) return ph;

  const o = document.createElement('canvas');
  o.width = w + 2 * pd; o.height = h + pd + bt;
  const c = o.getContext('2d');
  c.fillStyle = F[2]; c.fillRect(0, 0, o.width, o.height); c.drawImage(ph, pd, pd);

  c.textAlign = 'left';
  const ttl = (p.title || '').toUpperCase();
  const spc = (p.specs || `${(w * h / 1e6).toFixed(0)}MP · ${w}×${h} · ${p.look}`).toUpperCase();
  const mono = 'ui-monospace, Menlo, monospace', bot = h + pd;

  if (p.frame === 'Paper') {
    const ty = bot + bt * 0.45;
    c.fillStyle = '#1c1c1f'; c.font = `700 ${m * 0.03}px -apple-system, Georgia, serif`; c.fillText(ttl, pd, ty);
    c.fillStyle = '#6b7280'; c.font = `${m * 0.017}px ${mono}`; c.fillText(`${spc}  ·  ${ds}`, pd, ty + m * 0.045);
  }
  if (p.frame === 'Polaroid') {
    const ty = bot + bt * 0.42;
    c.fillStyle = '#2a2a2e'; c.font = `italic 600 ${m * 0.036}px -apple-system, sans-serif`; c.fillText(p.title || 'Framed', pd + m * 0.01, ty);
    c.fillStyle = '#8f949e'; c.font = `${m * 0.016}px ${mono}`; c.fillText(`${spc}  ·  ${ds}`, pd + m * 0.012, ty + m * 0.07);
  }
  if (p.frame === 'Specs') {
    c.fillStyle = '#111'; c.font = `bold ${m * 0.028}px ${mono}`; c.fillText(ttl, pd, h + pd + m * 0.055);
    c.font = `${m * 0.021}px ${mono}`; c.fillStyle = '#666'; c.fillText(`${spc}  ·  ${dt.toDateString()}`, pd, h + pd + m * 0.1);
  }
  if (p.frame === 'Filmstrip') {
    const hw = m * 0.035, hh = m * 0.05, st = m * 0.07, hy = (pd - hh) / 2;
    c.fillStyle = '#2a2a30';
    for (let X = m * 0.02; X < o.width - m * 0.04; X += st) {
      c.fillRect(X, hy * 0.6, hw, hh); c.fillRect(X, o.height - hy * 0.6 - hh, hw, hh);
    }
    c.fillStyle = '#e2a842'; c.font = `600 ${m * 0.016}px ${mono}`; c.fillText(`KODAK 5074 // ${p.look.toUpperCase()} // DX-35`, pd, pd - m * 0.012);
    c.fillStyle = '#f3f4f6'; c.font = `700 ${m * 0.02}px ${mono}`; c.fillText(ttl, pd, bot + m * 0.03);
    c.fillStyle = '#e2a842'; c.font = `${m * 0.014}px ${mono}`; c.textAlign = 'right'; c.fillText(spc, o.width - pd, bot + m * 0.03);
  }
  if (p.frame === 'Negative') {
    c.fillStyle = '#2a2622';
    for (let i = 0; i < o.width / (m * 0.06); i++) {
      c.fillRect(i * m * 0.06 + m * 0.02, m * 0.02, m * 0.03, m * 0.03);
      c.fillRect(i * m * 0.06 + m * 0.02, o.height - m * 0.05, m * 0.03, m * 0.03);
    }
    c.fillStyle = '#ff9a2e'; c.font = `${m * 0.022}px ${mono}`; c.fillText(`FRAMED 400   ▸ ${String(Math.floor(rr() * 36) + 1).padStart(2, '0')}`, pd, o.height - m * 0.058);
  }
  return o;
}

$('#back').onclick = () => { $('#ed').hidden = true; $('#cam').hidden = false; src = small = null; };
$('#save').onclick = async () => {
  $('#busy-label').textContent = 'Exporting Full Resolution…';
  $('#busy').hidden = false; await tick();
  const o = render(src, p);
  o.toBlob(async b => {
    const f = new File([b], `framed-${Date.now()}.jpg`, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f] }); } catch(e) {}
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = f.name; a.click();
    }
    $('#info').textContent = `Exported ${o.width}×${o.height}`;
    $('#busy').hidden = true;
  }, 'image/jpeg', 0.96);
};

// Start camera immediately
start();
</script>
</body>
