<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Frame">
<title>Frame — Aesthetic Camera</title>
<style>
:root{--bg:#f3f1ec;--fg:#1a1a1c;--mut:#77756f;--acc:#d9822b;--pan:#e6e3dc;--stage:#000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c0d;--fg:#f2f0ea;--mut:#8c8a85;--acc:#ffb347;--pan:#1a1a1d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0c0d;--fg:#f2f0ea;--mut:#8c8a85;--acc:#ffb347;--pan:#1a1a1d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:14px -apple-system,system-ui,"Helvetica Neue",sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
section{height:100%;display:flex;flex-direction:column;box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:var(--pan);border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
button.on{background:var(--acc);color:#111}
.row{display:flex;gap:8px;align-items:center;justify-content:center;padding:8px 12px;flex-wrap:wrap}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px}
#stage{position:relative;height:100%;max-width:100%;aspect-ratio:3/4;background:var(--stage);border-radius:14px;overflow:hidden}
video,#ov{position:absolute;inset:0;width:100%;height:100%}
video{object-fit:cover}
#hint{position:absolute;left:0;right:0;top:10px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 4px #000;pointer-events:none;padding:0 12px}
input[type=range]{accent-color:var(--acc);width:100%}
#tools{display:flex;gap:14px;padding:4px 18px}
#tools label{flex:1;font-size:11px;color:var(--mut)}
#bar{display:flex;align-items:center;justify-content:space-around;padding:10px 8px 14px}
#shut{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid var(--bg);outline:3px solid var(--fg);padding:0}
#shut.lit{outline-color:var(--acc);box-shadow:0 0 18px var(--acc)}
#pvw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
#pv{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 4px 24px #0006}
#panel{height:150px;overflow-y:auto;padding:4px 16px}
.sl{display:grid;grid-template-columns:84px 1fr 34px;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin:6px 0}
#busy{position:fixed;inset:0;background:#000a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;z-index:9}
small{color:var(--mut);font-size:11px}
</style></head><body>
<section id="cam">
 <div class="row" id="top"></div>
 <div id="wrap"><div id="stage"><video id="v" playsinline muted autoplay></video><canvas id="ov"></canvas><div id="hint"></div></div></div>
 <div id="tools"><label>Zoom<input type="range" id="zm" min="1" max="5" step="0.1" value="1"></label><label>Exposure<input type="range" id="ex" min="-2" max="2" step="0.1" value="0"></label></div>
 <div class="row"><small id="res"></small></div>
 <div id="bar">
  <button id="imp" title="Import">Photos</button>
  <button id="auto">Auto frame</button>
  <button id="shut" aria-label="Shutter"></button>
  <button id="drw">Your frame</button>
  <button id="nat" title="System camera, full sensor resolution">24MP</button>
 </div>
</section>
<section id="ed" hidden>
 <div id="pvw"><canvas id="pv"></canvas></div>
 <div class="row" id="tabs"></div>
 <div id="panel"></div>
 <div class="row"><button id="back">Back</button><small id="info"></small><button id="save" class="on">Save</button></div>
</section>
<div id="busy" hidden>Developing…</div>
<input type="file" id="f1" accept="image/*" hidden>
<input type="file" id="f2" accept="image/*" capture="environment" hidden>
<script>
const $=s=>document.querySelector(s), RAT={'3:4':3/4,'4:5':4/5,'1:1':1,'9:16':9/16};
let ratio='3:4',facing='environment',stream,track,frame=null,drawMode=false,autoOn=false,src,small,p,camExp=0,prev=null,stable=0,lastMP=0;
const v=$('#v'),ov=$('#ov'),stage=$('#stage'),tick=()=>new Promise(r=>setTimeout(r,30));
try{const ic=document.createElement('canvas');ic.width=ic.height=180;const x=ic.getContext('2d');x.fillStyle='#111';x.fillRect(0,0,180,180);x.strokeStyle='#ffb347';x.lineWidth=8;x.strokeRect(40,40,100,100);const l=document.createElement('link');l.rel='apple-touch-icon';l.href=ic.toDataURL();document.head.appendChild(l)}catch(e){}

/* ---------- camera ---------- */
const topBar=$('#top');
Object.keys(RAT).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className=k===ratio?'on':'';b.onclick=()=>{ratio=k;stage.style.aspectRatio=RAT[k];[...topBar.children].forEach(c=>c.classList.toggle('on',c.textContent===k));frame=null;size();draw()};topBar.appendChild(b)});
const fl=document.createElement('button');fl.textContent='Flip';fl.onclick=()=>{facing=facing==='environment'?'user':'environment';start()};topBar.appendChild(fl);
const tb=document.createElement('button');tb.textContent='Flash';topBar.appendChild(tb);
async function start(){
  try{stream&&stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:6000},height:{ideal:4500}},audio:false});
  v.srcObject=stream;track=stream.getVideoTracks()[0];const c=track.getCapabilities?track.getCapabilities():{},s=track.getSettings();
  lastMP=(s.width*s.height/1e6)||0;$('#res').textContent=`Live preview capture: ${s.width}×${s.height} (${lastMP.toFixed(1)}MP). Tap 24MP for full sensor.`;
  $('#zm').parentNode.style.opacity=c.zoom?1:.4;if(c.zoom){$('#zm').min=c.zoom.min;$('#zm').max=Math.min(c.zoom.max,8)}
  tb.style.display=c.torch?'':'none';
  }catch(e){$('#hint').textContent='Camera blocked here. Open the link directly, or use Photos / 24MP.'}
}
$('#zm').oninput=e=>track&&track.applyConstraints({advanced:[{zoom:+e.target.value}]}).catch(()=>{});
$('#ex').oninput=e=>{camExp=+e.target.value;const c=track&&track.getCapabilities?track.getCapabilities():{};if(c.exposureCompensation){track.applyConstraints({advanced:[{exposureCompensation:camExp}]}).catch(()=>{});camExp=0}else v.style.filter=`brightness(${Math.pow(2,camExp/2)})`};
let torch=false;tb.onclick=()=>{torch=!torch;tb.classList.toggle('on',torch);track.applyConstraints({advanced:[{torch}]}).catch(()=>{})};
function size(){const d=devicePixelRatio||1;ov.width=stage.clientWidth*d;ov.height=stage.clientHeight*d}
new ResizeObserver(()=>{size();draw()}).observe(stage);
function draw(){const x=ov.getContext('2d'),W=ov.width,H=ov.height;x.clearRect(0,0,W,H);x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=1;x.beginPath();for(let i=1;i<3;i++){x.moveTo(W*i/3,0);x.lineTo(W*i/3,H);x.moveTo(0,H*i/3);x.lineTo(W,H*i/3)}x.stroke();
 if(frame){const s=frame.s,l=(frame.cx-s/2)*W,t=(frame.cy-s/2)*H,w=s*W,h=s*H;x.fillStyle='rgba(0,0,0,.45)';x.beginPath();x.rect(0,0,W,H);x.rect(l,t,w,h);x.fill('evenodd');x.strokeStyle=stable>=2?'#ffb347':'#fff';x.lineWidth=3;x.strokeRect(l,t,w,h)}}
let dp=null;
ov.onpointerdown=e=>{if(!drawMode)return;const r=ov.getBoundingClientRect();dp={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};frame={cx:dp.x,cy:dp.y,s:.25};ov.setPointerCapture(e.pointerId);draw()};
ov.onpointermove=e=>{if(!dp)return;const r=ov.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;const s=Math.min(1,Math.max(.25,2*Math.max(Math.abs(x-dp.x),Math.abs(y-dp.y))));frame={cx:Math.min(1-s/2,Math.max(s/2,dp.x)),cy:Math.min(1-s/2,Math.max(s/2,dp.y)),s};draw()};
ov.onpointerup=()=>{dp=null};
$('#drw').onclick=()=>{autoOn=false;$('#auto').classList.remove('on');drawMode=!drawMode;$('#drw').classList.toggle('on',drawMode);if(!drawMode)frame=null;$('#hint').textContent=drawMode?'Drag from the centre of the shot you want':'';$('#shut').classList.remove('lit');draw()};
$('#auto').onclick=()=>{autoOn=!autoOn;drawMode=false;$('#drw').classList.remove('on');$('#auto').classList.toggle('on',autoOn);if(!autoOn){frame=null;$('#hint').textContent='';$('#shut').classList.remove('lit')}draw()};

/* scene analysis: contrast + colour saliency, rule-of-thirds placement */
function vis(){const vw=v.videoWidth,vh=v.videoHeight,a=RAT[ratio];let cw,ch;if(vw/vh>a){ch=vh;cw=vh*a}else{cw=vw;ch=vw/a}return{x:(vw-cw)/2,y:(vh-ch)/2,w:cw,h:ch}}
const tc=document.createElement('canvas');

 const s=Math.min(.95,Math.max(.45,3.4*Math.max(Math.sqrt(vx/tot),Math.sqrt(vy/tot)))),ux=mx<.5?1/3:2/3,uy=my<.5?1/3:2/3;
 return{cx:Math.min(1-s/2,Math.max(s/2,mx-(ux-.5)*s)),cy:Math.min(1-s/2,Math.max(s/2,my-(uy-.5)*s)),s,sx:mx,sy:my}}
setInterval(()=>{if(!autoOn)return;const t=analyze();if(!t)return;
 const dd=prev?Math.hypot(t.cx-prev.cx,t.cy-prev.cy)+Math.abs(t.s-prev.s):1;prev=t;stable=dd<.04?stable+1:0;
 frame=frame?{cx:frame.cx+(t.cx-frame.cx)*.6,cy:frame.cy+(t.cy-frame.cy)*.6,s:frame.s+(t.s-frame.s)*.6}:t;
 const z=1/t.s,dx=t.cx-.5,dy=t.cy-.5;let h=[];if(z>1.15)h.push(`Zoom ${z.toFixed(1)}×`);if(dx>.08)h.push('Pan right');if(dx<-.08)h.push('Pan left');if(dy>.08)h.push('Tilt down');if(dy<-.08)h.push('Tilt up');
 $('#hint').textContent=stable>=2?'Locked — shoot':h.join(' · ')||'Nice framing';$('#shut').classList.toggle('lit',stable>=2);draw()},450);

/* ---------- capture ---------- */
$('#shut').onclick=()=>{if(!v.videoWidth)return;const q=vis();let{x,y,w,h}=q;if(frame){x+=(frame.cx-frame.s/2)*q.w;y+=(frame.cy-frame.s/2)*q.h;w*=frame.s;h*=frame.s}
 const c=document.createElement('canvas');c.width=Math.round(w);c.height=Math.round(h);c.getContext('2d').drawImage(v,x,y,w,h,0,0,c.width,c.height);edit(c,camExp&&!track.getCapabilities().exposureCompensation?camExp:0)};
$('#imp').onclick=()=>$('#f1').click();$('#nat').onclick=()=>$('#f2').click();
let LIM=0;function okSize(w,h){try{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(w-1,h-1,1,1);return x.getImageData(w-1,h-1,1,1).data[3]===255}catch(e){return false}}
function maxPx(){return LIM||(LIM=okSize(6048,4200)?6048*4200:16777216)}
async function load(f){if(!f)return;$('#busy').hidden=false;await tick();let bm;try{bm=await createImageBitmap(f,{imageOrientation:'from-image'})}catch(e){bm=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=URL.createObjectURL(f)})}
 const w=bm.width||bm.naturalWidth,h=bm.height||bm.naturalHeight,k=Math.min(1,Math.sqrt(maxPx()/(w*h))),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);$('#busy').hidden=true;edit(c,0)}
$('#f1').onchange=$('#f2').onchange=e=>{load(e.target.files[0]);e.target.value=''};

/* ---------- editor ---------- */
const DEF={exposure:0,contrast:0,highlights:0,shadows:0,fade:0,temp:0,tint:0,sat:0,grain:0,glow:0,vignette:0,leak:0,dust:0,mono:false,frame:'Plain',date:false,look:'P400',seed:1};
const LOOKS={None:{},N1600:{contrast:18,shadows:12,fade:14,temp:-10,tint:6,sat:-8,grain:55,glow:22,vignette:20},P400:{exposure:6,contrast:10,temp:14,sat:22,fade:6,grain:28,glow:10,vignette:10},RELIC:{contrast:-8,fade:38,temp:8,tint:-14,sat:-22,grain:40,vignette:35,leak:55,dust:50},MONO:{mono:true,contrast:28,fade:8,grain:50,vignette:18}};
const TABS={Looks:null,Light:[['exposure','Exposure'],['contrast','Contrast'],['highlights','Highlights'],['shadows','Shadows'],['fade','Fade'],['temp','Temperature'],['tint','Tint']],Color:[['sat','Saturation']],Effects:[['grain','Grain'],['glow','Halation/Glow'],['vignette','Vignette'],['leak','Light leak'],['dust','Dust & scratches']],Frame:null};
const FRAMES=['Plain','White','Paper','Black','Negative','Specs'];let tab='Looks',raf=0;
function edit(c,expo){src=c;const k=Math.min(1,1400/Math.max(c.width,c.height));small=document.createElement('canvas');small.width=Math.round(c.width*k);small.height=Math.round(c.height*k);small.getContext('2d').drawImage(c,0,0,small.width,small.height);
 p={...DEF,...LOOKS.P400,seed:1+Math.floor(Math.random()*999)};p.exposure+=expo*30;$('#info').textContent=`${(c.width*c.height/1e6).toFixed(1)}MP source`;$('#cam').hidden=true;$('#ed').hidden=false;tabs();panel();paint()}
function tabs(){const t=$('#tabs');t.innerHTML='';Object.keys(TABS).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className=k===tab?'on':'';b.onclick=()=>{tab=k;tabs();panel()};t.appendChild(b)})}
function panel(){const P=$('#panel');P.innerHTML='';
 if(tab==='Looks'){const r=document.createElement('div');r.className='row';Object.keys(LOOKS).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className=p.look===k?'on':'';b.onclick=()=>{p={...DEF,...LOOKS[k],look:k,frame:p.frame,date:p.date,seed:p.seed};panel();paint()};r.appendChild(b)});P.appendChild(r);P.insertAdjacentHTML('beforeend','<small>Each look is a starting point — fine-tune it in the other tabs.</small>')}
 else if(tab==='Frame'){const r=document.createElement('div');r.className='row';FRAMES.forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className=p.frame===k?'on':'';b.onclick=()=>{p.frame=k;panel();paint()};r.appendChild(b)});const d=document.createElement('button');d.textContent='Date stamp';d.className=p.date?'on':'';d.onclick=()=>{p.date=!p.date;panel();paint()};r.appendChild(d);P.appendChild(r)}
 else TABS[tab].forEach(([k,n])=>{const d=document.createElement('div');d.className='sl';const neg=['exposure','contrast','highlights','shadows','temp','tint','sat'].includes(k);d.innerHTML=`<span>${n}</span><input type="range" min="${neg?-100:0}" max="100" value="${p[k]}"><span>${Math.round(p[k])}</span>`;d.querySelector('input').oninput=e=>{p[k]=+e.target.value;d.lastChild.textContent=e.target.value;paint()};P.appendChild(d)})}
function paint(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const o=render(small,p);const pv=$('#pv');pv.width=o.width;pv.height=o.height;pv.getContext('2d').drawImage(o,0,0)})}
function hash(x,y,s){let n=Math.imul(x,374761393)+Math.imul(y,668265263)+s|0;n=Math.imul(n^(n>>>13),1274126177);n^=n>>>16;return(n>>>0)/4294967296}
function render(sc,p){const w=sc.width,h=sc.height,m=Math.min(w,h),ph=document.createElement('canvas');ph.width=w;ph.height=h;const x=ph.getContext('2d',{willReadFrequently:true});x.drawImage(sc,0,0);
 const ex=Math.pow(2,p.exposure/50),ct=1+p.contrast/100,hi=p.highlights/100,sh=p.shadows/100,fd=p.fade/100*.14,tw=p.temp/100,tn=p.tint/100,sa=1+p.sat/100,gr=p.grain/100*.22,vg=p.vignette/100,bs=Math.max(0,Math.min(3,Math.round(Math.log2(w/1200)))),sd=p.seed*7919;
 for(let y0=0;y0<h;y0+=256){const hh=Math.min(256,h-y0),im=x.getImageData(0,y0,w,hh),d=im.data;
  for(let yy=0;yy<hh;yy++){const y=y0+yy,dy=y/h-.5;for(let xx=0;xx<w;xx++){const i=(yy*w+xx)*4;
   let r=d[i]/255*ex*(1+tw*.18),g=d[i+1]/255*ex*(1-tn*.12),b=d[i+2]/255*ex*(1-tw*.18),l=.299*r+.587*g+.114*b;const a=sh*(1-l)*(1-l)*.35+hi*l*l*.35;r+=a;g+=a;b+=a;
   r=(r-.5)*ct+.5;g=(g-.5)*ct+.5;b=(b-.5)*ct+.5;r=fd+r*(1-fd);g=fd+g*(1-fd);b=fd+b*(1-fd);l=.299*r+.587*g+.114*b;
   if(p.mono){r=g=b=l}else{r=l+(r-l)*sa;g=l+(g-l)*sa;b=l+(b-l)*sa}
   const dx=xx/w-.5,vf=1-vg*(dx*dx+dy*dy)*2.2;const n=gr?(hash(xx>>bs,y>>bs,sd)-.5)*gr*(1.1-Math.abs(l-.5)):0;
   d[i]=(r*vf+n)*255;d[i+1]=(g*vf+n)*255;d[i+2]=(b*vf+n)*255}}
  x.putImageData(im,0,y0)}
 let s=p.seed*9301;const rr=()=>(s=(s*16807)%2147483647)/2147483647;
 if(p.glow>0){const t=document.createElement('canvas');t.width=Math.max(8,w>>3);t.height=Math.max(8,h>>3);const c=t.getContext('2d');c.drawImage(ph,0,0,t.width,t.height);c.globalCompositeOperation='multiply';c.fillStyle='#ff7a45';c.fillRect(0,0,t.width,t.height);x.globalCompositeOperation='screen';x.globalAlpha=p.glow/100*.45;x.drawImage(t,0,0,w,h);x.globalAlpha=1}
 x.globalCompositeOperation='screen';if(p.leak>0){const cx=rr()<.5?0:w,g=x.createRadialGradient(cx,h*(.2+rr()*.5),0,cx,h*.4,m*.9);g.addColorStop(0,`rgba(255,110,30,${p.leak/100*.8})`);g.addColorStop(.5,`rgba(255,40,60,${p.leak/100*.25})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,w,h)}
 x.globalCompositeOperation='source-over';
 if(p.dust>0){x.fillStyle='rgba(255,255,255,.65)';for(let i=0;i<p.dust*.8;i++){x.beginPath();x.arc(rr()*w,rr()*h,m*.0012*(.5+rr()*1.5),0,7);x.fill()}x.strokeStyle='rgba(255,255,255,.22)';x.lineWidth=Math.max(1,m*.0006);for(let i=0;i<p.dust*.12;i++){const a=rr()*w,b=rr()*h;x.beginPath();x.moveTo(a,b);x.lineTo(a+(rr()-.5)*m*.03,b+rr()*m*.12);x.stroke()}}
 const dt=new Date(),ds=`'${String(dt.getFullYear()).slice(2)} ${String(dt.getMonth()+1).padStart(2,'0')} ${String(dt.getDate()).padStart(2,'0')}`;
 if(p.date){x.font=`bold ${m*.035}px ui-monospace,Menlo,monospace`;x.textAlign='right';x.fillStyle='#ff8a1e';x.shadowColor='#ff5a00';x.shadowBlur=m*.01;x.fillText(ds,w-m*.04,h-m*.04);x.shadowBlur=0}
 const F={Plain:[0,0,'#000'],White:[.06,.06,'#f6f4ef'],Paper:[.06,.15,'#ece4d2'],Black:[.06,.06,'#0b0b0b'],Negative:[.07,.07,'#141210'],Specs:[.04,.16,'#f7f7f5']}[p.frame],pd=F[0]*m,bt=F[1]*m;
